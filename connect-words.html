: ["Turkey", "Stuffing", "Gravy", "Pilgrims", "Cranberry"]}, {"name": "At a Wedding", "words": ["Bride", "Groom", "Ring", "Bouquet", "Veil"]}, {"name": "Birthday Party", "words": ["Candles", "Presents", "Party Hats", "Streamers", "Wishes"]}]}, {"theme": "Getting Dressed", "cats": [{"name": "Clothing", "words": ["Shirt", "Pants", "Dress", "Coat", "Sweater"]}, {"name": "On Your Feet", "words": ["Shoes", "Socks", "Boots", "Slippers", "Sandals"]}, {"name": "Kinds of Hats", "words": ["Cap", "Bonnet", "Beret", "Cowboy Hat", "Top Hat"]}, {"name": "Jewelry", "words": ["Necklace", "Bracelet", "Earrings", "Brooch", "Locket"]}]}, {"theme": "Sweet Treats", "cats": [{"name": "Drinks", "words": ["Coffee", "Tea", "Milk", "Juice", "Lemonade"]}, {"name": "Candy", "words": ["Chocolate", "Lollipop", "Taffy", "Gumdrops", "Caramel"]}, {"name": "Ice Cream Flavors", "words": ["Vanilla", "Strawberry", "Mint", "Rocky Road", "Butter Pecan"]}, {"name": "Kinds of Pie", "words": ["Cherry", "Pumpkin", "Pecan", "Lemon", "Blueberry"]}]}, {"theme": "The Great Outdoors", "cats": [{"name": "Camping Items", "words": ["Tent", "Campfire", "Sleeping Bag", "Lantern", "Marshmallows"]}, {"name": "Fishing Items", "words": ["Rod", "Reel", "Bait", "Hook", "Bobber"]}, {"name": "At a Picnic", "words": ["Basket", "Sandwich", "Watermelon", "Checkered Cloth", "Thermos"]}, {"name": "At the Beach", "words": ["Sand", "Waves", "Seashell", "Sunscreen", "Beach Umbrella"]}]}, {"theme": "Opposites Attract", "cats": [{"name": "Loud Things", "words": ["Thunder", "Siren", "Drum Roll", "Train Whistle", "Alarm Clock"]}, {"name": "Quiet Things", "words": ["Whisper", "Library Room", "Snowfall", "Naptime", "Mouse"]}, {"name": "Soft Things", "words": ["Cotton", "Feather", "Kitten Fur", "Marshmallow Fluff", "Velvet"]}, {"name": "Round Things", "words": ["Ball", "Wheel", "Coin", "Globe", "Donut"]}]}, {"theme": "Name That Color", "cats": [{"name": "Green Things", "words": ["Grass", "Frog", "Pickle", "Lettuce Leaf", "Pea Pod"]}, {"name": "Yellow Things", "words": ["Sunflower", "Banana Peel", "School Bus", "Lemon Drop", "Corn Cob"]}, {"name": "Red Things", "words": ["Fire Truck", "Stop Sign", "Cherry Pie", "Ladybug Wings", "Rose Petal"]}, {"name": "Shapes", "words": ["Circle", "Square", "Triangle", "Heart", "Star"]}]}, {"theme": "Around Town", "cats": [{"name": "Library Words", "words": ["Books", "Shelf", "Librarian", "Bookmark", "Quiet Please"]}, {"name": "Doctor's Office", "words": ["Stethoscope", "Bandage", "Thermometer", "Scale", "Waiting Room"]}, {"name": "Post Office", "words": ["Mailbox", "Parcel", "Zip Code", "Mail Truck", "Postmark"]}, {"name": "Grocery Store", "words": ["Cart", "Aisle", "Checkout", "Coupon", "Produce"]}]}, {"theme": "Good Cooking", "cats": [{"name": "Kitchen Appliances", "words": ["Toaster", "Blender", "Mixer", "Kettle", "Skillet"]}, {"name": "Bakery Items", "words": ["Donuts", "Muffins", "Bagels", "Croissant", "Cupcakes"]}, {"name": "Pizza Toppings", "words": ["Pepperoni", "Mushrooms", "Sausage", "Onions", "Peppers"]}, {"name": "Herbs & Spices", "words": ["Salt", "Pepper", "Cinnamon", "Basil", "Garlic"]}]}, {"theme": "Counting the Days", "cats": [{"name": "Money Words", "words": ["Penny", "Nickel", "Dime", "Quarter", "Dollar"]}, {"name": "Time Words", "words": ["Clock", "Minute", "Hour", "Calendar", "Watch"]}, {"name": "Numbers", "words": ["One", "Two", "Five", "Seven", "Ten"]}, {"name": "Months", "words": ["January", "March", "June", "October", "December"]}]}, {"theme": "The Good Old Days", "cats": [{"name": "Old TV Shows", "words": ["I Love Lucy", "Bonanza", "Gunsmoke", "Lassie", "Andy Griffith"]}, {"name": "Cowboy Words", "words": ["Lasso", "Saddle", "Spurs", "Rodeo", "Bandana"]}, {"name": "Sewing Items", "words": ["Needle", "Thread", "Button", "Scissors", "Thimble"]}, {"name": "In a Purse", "words": ["Wallet", "Keys", "Lipstick", "Tissues", "Comb"]}]}];

let mode = 'easy';                    // 'easy' | 'hard'
let roundIdxByMode = { easy: 0, hard: 0 };
let grid = [];                        // rows of 5 words
let lockedRows = [];                  // category name per row when locked
let selected = null;

function rounds() { return mode === 'easy' ? EASY_ROUNDS : HARD_ROUNDS; }
function nRows() { return mode === 'easy' ? 3 : 4; }
function roundIdx() { return roundIdxByMode[mode]; }
function currentCats() { return rounds()[roundIdx()].cats; }

function sameSet(arr, set) {
  if (arr.length !== set.size) return false;
  return arr.every(w => set.has(w));
}

function shuffleWords() {
  const words = [];
  currentCats().forEach(c => words.push(...c.words));
  const R = nRows();
  const sets = currentCats().map(c => new Set(c.words));
  for (let t = 0; t < 50; t++) {
    for (let i = words.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [words[i], words[j]] = [words[j], words[i]];
    }
    const rows = [];
    for (let r = 0; r < R; r++) rows.push(words.slice(r*5, r*5+5));
    if (!rows.some(row => sets.some(s => sameSet(row, s)))) return rows;
  }
  const rows = [];
  for (let r = 0; r < R; r++) rows.push(words.slice(r*5, r*5+5));
  return rows;
}

function startRound(idx) {
  const n = rounds().length;
  roundIdxByMode[mode] = ((idx % n) + n) % n;
  grid = shuffleWords();
  lockedRows = new Array(nRows()).fill(null);
  selected = null;
  document.getElementById('bigmsg').classList.remove('show');
  render();
}

function render() {
  const board = document.getElementById('board');
  const R = nRows();
  board.className = 'h-full grid gap-2 sm:gap-3 ' + (R === 3 ? 'rows3' : 'rows4');
  board.style.gridTemplateColumns = 'minmax(70px, .8fr) repeat(5, 2fr)';
  board.style.gridTemplateRows = 'repeat(' + R + ', 1fr)';
  board.innerHTML = '';

  document.getElementById('roundlabel').textContent =
    'Round ' + (roundIdx() + 1) + ' of ' + rounds().length;
  const theme = rounds()[roundIdx()].theme;
  document.getElementById('themelabel').textContent = theme ? 'Theme: ' + theme : '';

  document.getElementById('easybtn').classList.toggle('mode-off', mode !== 'easy');
  document.getElementById('hardbtn').classList.toggle('mode-off', mode !== 'hard');

  for (let r = 0; r < R; r++) {
    const label = document.createElement('div');
    label.className = 'rowlabel' + (lockedRows[r] ? ' show' : '');
    label.textContent = lockedRows[r] ? '✓ ' + lockedRows[r] : '';
    board.appendChild(label);
    for (let c = 0; c < 5; c++) {
      const t = document.createElement('div');
      t.className = 'tile'
        + (lockedRows[r] ? ' locked' : '')
        + (selected && selected.r === r && selected.c === c ? ' selected' : '');
      t.textContent = grid[r][c];
      if (!lockedRows[r]) t.addEventListener('click', () => tapTile(r, c));
      board.appendChild(t);
    }
  }
}

function tapTile(r, c) {
  if (lockedRows[r]) return;
  if (!selected) { selected = { r, c }; render(); return; }
  if (selected.r === r && selected.c === c) { selected = null; render(); return; }
  const a = selected; selected = null;
  const tmp = grid[a.r][a.c];
  grid[a.r][a.c] = grid[r][c];
  grid[r][c] = tmp;
  checkRows();
  render();
  if (lockedRows.every(x => x)) setTimeout(showWin, 650);
}

function checkRows() {
  const cats = currentCats().map(c => ({ name: c.name, set: new Set(c.words) }));
  const used = new Set(lockedRows.filter(Boolean));
  for (let r = 0; r < nRows(); r++) {
    if (lockedRows[r]) continue;
    for (const c of cats) {
      if (used.has(c.name)) continue;
      if (sameSet(grid[r], c.set)) { lockedRows[r] = c.name; used.add(c.name); break; }
    }
  }
}

function showWin() {
  document.getElementById('bigmsg-cats').textContent =
    currentCats().map(c => c.name).join('  •  ');
  document.getElementById('bigmsg').classList.add('show');
}

function setMode(m) {
  if (mode === m) return;
  mode = m;
  startRound(roundIdxByMode[mode]);
}

document.getElementById('easybtn').addEventListener('click', () => setMode('easy'));
document.getElementById('hardbtn').addEventListener('click', () => setMode('hard'));
document.getElementById('pick-easy').addEventListener('click', () => {
  document.getElementById('modepick').classList.remove('show');
  mode = 'easy'; startRound(0);
});
document.getElementById('pick-hard').addEventListener('click', () => {
  document.getElementById('modepick').classList.remove('show');
  mode = 'hard'; startRound(0);
});

document.getElementById('shufflebtn').addEventListener('click', () => {
  if (lockedRows.every(x => !x)) { grid = shuffleWords(); selected = null; render(); return; }
  const loose = [];
  for (let r = 0; r < nRows(); r++) if (!lockedRows[r]) loose.push(...grid[r]);
  for (let i = loose.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [loose[i], loose[j]] = [loose[j], loose[i]];
  }
  let k = 0;
  for (let r = 0; r < nRows(); r++) if (!lockedRows[r]) { grid[r] = loose.slice(k, k + 5); k += 5; }
  selected = null;
  checkRows();
  render();
});

document.getElementById('nextbtn').addEventListener('click', () => startRound(roundIdx() + 1));
document.getElementById('bigmsg-next').addEventListener('click', () => startRound(roundIdx() + 1));

// Board renders behind the mode-select overlay so nothing looks empty
mode = 'easy'; startRound(0);
