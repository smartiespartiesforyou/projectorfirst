<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rhyme &amp; Riddle | Projector First</title>

<script data-memberstack-app="app_cmgnwpg8y00x10suih4pua785"

<script src="/guard.js"></script>

<style>
:root{
  --navy:#17324d;--blue:#3f7898;--blue2:#2f607a;--coral:#d97961;--coral2:#bc5e4b;
  --sage:#6e9d8b;--sage2:#557e70;--cream:#fff8e8;--ivory:#fffdf6;--gold:#d5c49d;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;color:var(--navy);font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 12% 10%,rgba(242,184,75,.30),transparent 24%),
    radial-gradient(circle at 88% 18%,rgba(110,157,139,.25),transparent 26%),
    linear-gradient(145deg,#fff8e8,#f3ede2 52%,#e6f0ed);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;
  background-image:
    linear-gradient(90deg,transparent 49%,rgba(23,50,77,.07) 50%,transparent 51%),
    linear-gradient(transparent 49%,rgba(23,50,77,.05) 50%,transparent 51%);
  background-size:48px 48px
}
button,a{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.topbar{
  max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:18px;flex-wrap:wrap;border-bottom:1px solid rgba(23,50,77,.12)
}
.back-btn,.top-btn{
  border:0;border-radius:14px;background:#1e3a8a;color:#fff;text-decoration:none;
  font-weight:900;padding:11px 17px;box-shadow:0 5px 0 rgba(23,50,77,.22)
}
.title-block{text-align:center;flex:1;min-width:270px}
.eyebrow{font-size:.8rem;font-weight:900;letter-spacing:.18em;color:#80694e}
h1{
  margin:3px 0 0;font-family:Georgia,serif;font-size:clamp(2.1rem,4.8vw,3.8rem);
  color:var(--navy);line-height:1
}
.voice{
  display:flex;align-items:center;gap:8px;background:#fffdf6;color:#17324d;
  border:3px solid #d5c49d;border-radius:14px;padding:8px 12px;font-weight:900
}
.voice input{width:20px;height:20px}

.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 34px}
.progress{text-align:center;color:#80694e;font-weight:900;margin-bottom:12px}
.stage{
  min-height:590px;background:linear-gradient(145deg,#fffdf6,#f1e6d0);
  border:4px solid #d5c49d;border-radius:30px;padding:clamp(20px,3vw,34px);
  box-shadow:0 10px 0 #b99d69,0 17px 32px rgba(23,50,77,.14);
  display:flex;flex-direction:column;justify-content:center;align-items:center
}
.prompt-label{
  font-size:.84rem;font-weight:900;letter-spacing:.16em;color:#80694e;margin-bottom:4px
}
.prompt{
  text-align:center;font-family:Georgia,serif;font-weight:900;
  font-size:clamp(2.1rem,4.6vw,3.8rem);line-height:1.05;margin-bottom:20px
}
.word{
  display:inline-block;background:#17324d;color:#fff;border-radius:15px;
  padding:.12em .28em;box-shadow:0 5px 0 #0d263b
}
.clue{
  width:min(850px,100%);background:#fff;border:3px solid #d8cdbc;border-radius:20px;
  padding:18px 22px;text-align:center;font-size:clamp(1.5rem,3.2vw,2.35rem);
  font-weight:900;color:#17324d;box-shadow:0 6px 0 rgba(23,50,77,.08)
}
.hint{
  width:min(760px,100%);margin-top:14px;background:#fff5d8;border:3px solid #d8aa43;
  border-radius:18px;padding:14px 18px;text-align:center;
  font-size:clamp(1.2rem,2.6vw,1.8rem);font-weight:900;color:#745515
}
.answer{
  width:min(850px,100%);margin-top:16px;background:#e3efe8;border:4px solid #6e9d8b;
  border-radius:20px;padding:18px;text-align:center;box-shadow:0 7px 0 #9eb8ae
}
.answer .small{font-size:.78rem;font-weight:900;letter-spacing:.15em;color:#557e70}
.answer .big{
  margin-top:4px;font-family:"Arial Black",Arial,sans-serif;font-weight:900;
  font-size:clamp(3rem,7vw,5.5rem);line-height:1;color:#17324d
}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px}
.action{
  min-width:180px;border:4px solid rgba(255,255,255,.82);border-radius:18px;color:#fff;
  font-weight:900;padding:13px 18px;font-size:clamp(1.05rem,2.2vw,1.4rem)
}
.hint-btn{background:linear-gradient(145deg,#d8aa43,#b98424);box-shadow:0 7px 0 #8d641b;color:#17324d}
.reveal{background:linear-gradient(145deg,var(--coral),var(--coral2));box-shadow:0 7px 0 #934738}
.next{background:linear-gradient(145deg,var(--sage),var(--sage2));box-shadow:0 7px 0 #42665b}
.helper{text-align:center;margin-top:12px;color:#7a7167;font-size:.92rem;font-weight:700}

@media(max-width:650px){
  .title-block{order:-1;flex-basis:100%}
  .stage{min-height:520px}
}
</style>
</head>
<body>

<div class="topbar">
  <a href="apps.html" class="back-btn">← Back to Apps</a>
  <div class="title-block">
    <div class="eyebrow">WORD PLAY</div>
    <h1>Rhyme &amp; Riddle</h1>
  </div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <label class="voice">
      <input id="voiceToggle" type="checkbox" checked>
      🔊 Voice
    </label>
    <button class="top-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
  </div>
</div>

<main class="wrap">
  <div id="progress" class="progress"></div>

  <section class="stage">
    <div class="prompt-label">FIND A WORD THAT RHYMES</div>
    <div class="prompt">What rhymes with <span id="word" class="word"></span>?</div>

    <div id="clue" class="clue"></div>
    <div id="hint" class="hint hidden"></div>

    <div id="answerBox" class="answer hidden">
      <div class="small">THE RHYMING ANSWER IS</div>
      <div id="answer" class="big"></div>
    </div>

    <div class="actions">
      <button id="hintBtn" class="action hint-btn" onclick="showHint()">Hint</button>
      <button id="revealBtn" class="action reveal" onclick="revealAnswer()">Reveal Answer</button>
      <button id="nextBtn" class="action next hidden" onclick="nextRiddle()">Next Riddle →</button>
    </div>

    <div class="helper">10 riddles per round • No score or timer • Space = Hint / Reveal / Next • F = Fullscreen</div>
  </section>
</main>

<script>
"use strict";

const RIDDLES=[{"word":"TRAIN","answer":"PLANE","clue":"I carry passengers through the sky.","hint":"It starts with P."},{"word":"CHAIR","answer":"HAIR","clue":"It grows on your head.","hint":"It starts with H."},{"word":"CAT","answer":"HAT","clue":"You wear me on your head.","hint":"It starts with H."},{"word":"DOG","answer":"FOG","clue":"I can make it hard to see outside.","hint":"It starts with F."},{"word":"SUN","answer":"RUN","clue":"You do this when you move faster than a walk.","hint":"It starts with R."},{"word":"STAR","answer":"CAR","clue":"I have four wheels and drive on roads.","hint":"It starts with C."},{"word":"CAKE","answer":"LAKE","clue":"I am a large body of water surrounded by land.","hint":"It starts with L."},{"word":"MOON","answer":"SPOON","clue":"You might use me to eat soup.","hint":"It starts with S."},{"word":"BEE","answer":"TREE","clue":"I have a trunk, branches, and leaves.","hint":"It starts with T."},{"word":"DAY","answer":"TRAY","clue":"You might carry drinks on me.","hint":"It starts with T."},{"word":"NIGHT","answer":"LIGHT","clue":"I help you see in the dark.","hint":"It starts with L."},{"word":"RING","answer":"KING","clue":"I wear a crown and rule a kingdom.","hint":"It starts with K."},{"word":"BALL","answer":"WALL","clue":"I divide rooms and hold up a roof.","hint":"It starts with W."},{"word":"PIE","answer":"SKY","clue":"I am above you outdoors.","hint":"It starts with S."},{"word":"ROSE","answer":"NOSE","clue":"You smell with me.","hint":"It starts with N."},{"word":"BOAT","answer":"COAT","clue":"You wear me when the weather is cold.","hint":"It starts with C."},{"word":"SNOW","answer":"CROW","clue":"I am a black bird often seen outdoors.","hint":"It starts with C."},{"word":"BEAR","answer":"PEAR","clue":"I am a sweet fruit with a narrow top.","hint":"It starts with P."},{"word":"FISH","answer":"DISH","clue":"Food is often served on me.","hint":"It starts with D."},{"word":"CLOCK","answer":"SOCK","clue":"You wear me on your foot.","hint":"It starts with S."},{"word":"SHOE","answer":"BLUE","clue":"I am the color of a clear daytime sky.","hint":"It starts with B."},{"word":"PAN","answer":"FAN","clue":"I blow air to help cool a room.","hint":"It starts with F."},{"word":"PIG","answer":"WIG","clue":"I am fake hair worn on the head.","hint":"It starts with W."},{"word":"HEN","answer":"PEN","clue":"You write with me.","hint":"It starts with P."},{"word":"COW","answer":"PLOW","clue":"A farmer uses me to turn over soil.","hint":"It starts with P."},{"word":"DUCK","answer":"TRUCK","clue":"I am a large vehicle used to haul things.","hint":"It starts with T."},{"word":"GOAT","answer":"FLOAT","clue":"I stay on top of water instead of sinking.","hint":"It starts with F."},{"word":"MOP","answer":"SHOP","clue":"You go here to buy something.","hint":"It starts with S."},{"word":"BED","answer":"RED","clue":"I am the color of a stop sign.","hint":"It starts with R."},{"word":"TEA","answer":"KEY","clue":"I can unlock a door.","hint":"It starts with K."},{"word":"CORN","answer":"HORN","clue":"You might honk me in a car.","hint":"It starts with H."},{"word":"PEACH","answer":"BEACH","clue":"You may find sand and waves here.","hint":"It starts with B."},{"word":"DRUM","answer":"PLUM","clue":"I am a small purple fruit.","hint":"It starts with P."},{"word":"BREAD","answer":"SLED","clue":"You ride me downhill in the snow.","hint":"It starts with S."},{"word":"CHEESE","answer":"BREEZE","clue":"I am a gentle wind.","hint":"It starts with B."},{"word":"RICE","answer":"DICE","clue":"You roll me in many games.","hint":"It starts with D."},{"word":"BEAN","answer":"GREEN","clue":"I am the color of grass.","hint":"It starts with G."},{"word":"HAM","answer":"JAM","clue":"You might spread me on toast.","hint":"It starts with J."},{"word":"BROOM","answer":"ROOM","clue":"I am a space inside a house.","hint":"It starts with R."},{"word":"LAMP","answer":"STAMP","clue":"You put me on an envelope before mailing it.","hint":"It starts with S."},{"word":"DOOR","answer":"FLOOR","clue":"You walk on me inside a room.","hint":"It starts with F."},{"word":"BUG","answer":"RUG","clue":"I may lie on the floor under a table.","hint":"It starts with R."},{"word":"SEED","answer":"NEED","clue":"I mean something you must have or require.","hint":"It starts with N."},{"word":"RAIN","answer":"CHAIN","clue":"I am made of metal links joined together.","hint":"It starts with C."},{"word":"CLOUD","answer":"LOUD","clue":"I describe a sound that is not quiet.","hint":"It starts with L."},{"word":"HILL","answer":"PILL","clue":"You may swallow me as medicine.","hint":"It starts with P."},{"word":"ROCK","answer":"LOCK","clue":"I can keep a door from opening.","hint":"It starts with L."},{"word":"MOUSE","answer":"HOUSE","clue":"People may live inside me.","hint":"It starts with H."},{"word":"CAR","answer":"JAR","clue":"You might keep jelly or pickles in me.","hint":"It starts with J."},{"word":"SOCK","answer":"BLOCK","clue":"A child may stack me when building.","hint":"It starts with B."},{"word":"BELL","answer":"SHELL","clue":"I may wash up on a beach.","hint":"It starts with S."},{"word":"BOOK","answer":"COOK","clue":"I prepare food in a kitchen.","hint":"It starts with C."},{"word":"PHONE","answer":"STONE","clue":"I am a small piece of rock.","hint":"It starts with S."},{"word":"LIGHT","answer":"KITE","clue":"I fly on a string in the wind.","hint":"It starts with K."},{"word":"SING","answer":"SWING","clue":"You might sit on me and move back and forth.","hint":"It starts with S."},{"word":"TREE","answer":"KNEE","clue":"I am the joint in the middle of your leg.","hint":"It starts with K."},{"word":"MOUSE","answer":"BLOUSE","clue":"I am a shirt often worn by women.","hint":"It starts with B."},{"word":"KING","answer":"SPRING","clue":"I am the season after winter.","hint":"It starts with S."},{"word":"FLOOR","answer":"STORE","clue":"You go here to buy things.","hint":"It starts with S."},{"word":"PARK","answer":"DARK","clue":"This describes a room with no lights on.","hint":"It starts with D."},{"word":"COLD","answer":"GOLD","clue":"I am a shiny yellow precious metal.","hint":"It starts with G."},{"word":"TOWN","answer":"CROWN","clue":"A king or queen may wear me.","hint":"It starts with C."},{"word":"SNAKE","answer":"RAKE","clue":"You use me to gather leaves.","hint":"It starts with R."},{"word":"WALL","answer":"HALL","clue":"I am a passageway connecting rooms.","hint":"It starts with H."},{"word":"BEE","answer":"SEA","clue":"I am a very large body of salt water.","hint":"It starts with S."},{"word":"STAR","answer":"JAR","clue":"I may hold cookies on a kitchen counter.","hint":"It starts with J."},{"word":"BALL","answer":"CALL","clue":"You might do this when you use a telephone.","hint":"It starts with C."},{"word":"MOON","answer":"NOON","clue":"I am twelve o'clock in the middle of the day.","hint":"It starts with N."},{"word":"FISH","answer":"WISH","clue":"You make me before blowing out birthday candles.","hint":"It starts with W."},{"word":"BED","answer":"HEAD","clue":"Your eyes, ears, nose, and mouth are on me.","hint":"It starts with H."},{"word":"TEA","answer":"SEA","clue":"Ships travel across me.","hint":"It starts with S."},{"word":"CORN","answer":"BORN","clue":"This means brought into the world as a baby.","hint":"It starts with B."},{"word":"PEAR","answer":"STAIR","clue":"You step on me when going up or down.","hint":"It starts with S."},{"word":"CLOCK","answer":"KNOCK","clue":"You might do this before entering a closed door.","hint":"It starts with K."}];
const ROUND_SIZE=10;

let deck=[];
let index=0;
let hintShown=false;
let revealed=false;

const wordEl=document.getElementById("word");
const clueEl=document.getElementById("clue");
const hintEl=document.getElementById("hint");
const answerBox=document.getElementById("answerBox");
const answerEl=document.getElementById("answer");
const progress=document.getElementById("progress");
const hintBtn=document.getElementById("hintBtn");
const revealBtn=document.getElementById("revealBtn");
const nextBtn=document.getElementById("nextBtn");

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function newRound(){
  deck=shuffle(RIDDLES).slice(0,ROUND_SIZE);
  index=0;
  renderRiddle();
}

function renderRiddle(){
  hintShown=false;
  revealed=false;
  const item=deck[index];

  wordEl.textContent=item.word;
  clueEl.textContent=item.clue;
  hintEl.textContent=item.hint;
  hintEl.classList.add("hidden");
  answerEl.textContent=item.answer;
  answerBox.classList.add("hidden");

  hintBtn.classList.remove("hidden");
  revealBtn.classList.remove("hidden");
  nextBtn.classList.add("hidden");

  progress.textContent="Riddle "+(index+1)+" of "+deck.length;
  speak("What rhymes with "+item.word+"? "+item.clue);
}

function showHint(){
  if(revealed||hintShown)return;
  hintShown=true;
  hintEl.classList.remove("hidden");
  hintBtn.classList.add("hidden");
  speak(deck[index].hint);
}

function revealAnswer(){
  if(revealed)return;
  revealed=true;
  answerBox.classList.remove("hidden");
  hintBtn.classList.add("hidden");
  revealBtn.classList.add("hidden");
  nextBtn.classList.remove("hidden");
  speak("The answer is "+deck[index].answer+".");
}

function nextRiddle(){
  index++;
  if(index>=deck.length){
    newRound();
    return;
  }
  renderRiddle();
}

function speak(text){
  if(!document.getElementById("voiceToggle").checked)return;
  if(!("speechSynthesis" in window))return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=.9;
  window.speechSynthesis.speak(u);
}

function toggleFullscreen(){
  if(!document.fullscreenElement)document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

document.addEventListener("keydown",e=>{
  if(e.code==="KeyF"){toggleFullscreen();return}
  if(e.code!=="Space"&&e.key!==" ")return;
  e.preventDefault();
  if(revealed)nextRiddle();
  else if(!hintShown)showHint();
  else revealAnswer();
});

newRound();
</script>
</body>
</html>
