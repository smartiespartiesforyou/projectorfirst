const LABELS={
sayings:"Sayings",hymns:"Hymns",holiday:"Christmas",winter:"Winter",funny:"Funny",
easter:"Easter",stpatricks:"St. Patrick’s Day",valentines:"Valentine’s Day",spring:"Spring",
mardigras:"Mardi Gras",fathersday:"Father’s Day",fall:"Fall",thanksgiving:"Thanksgiving"
};
let currentCategory="",deck=[],pos=0,roundSize=0;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pretty(cat){return LABELS[cat]||cat.charAt(0).toUpperCase()+cat.slice(1)}
function show(screen){
 document.getElementById("categoryScreen").classList.toggle("hidden",screen!=="categories");
 document.getElementById("gameScreen").classList.toggle("hidden",screen!=="game");
 document.getElementById("doneScreen").classList.toggle("hidden",screen!=="done");
}
function startGame(cat){
 currentCategory=cat;
 const pool=DEFAULT_PHRASES[cat]||[];
 roundSize=Math.min(10,pool.length);
 deck=shuffle(pool).slice(0,roundSize);
 pos=0;
 show("game");
 render();
}
function render(){
 const item=deck[pos];
 document.getElementById("categoryTitle").textContent=pretty(currentCategory);
 document.getElementById("prompt").textContent=item.prompt;
 document.getElementById("answer").textContent=item.answer;
 document.getElementById("answer").classList.add("hidden");
 document.getElementById("showAnswerBtn").classList.remove("hidden");
 document.getElementById("nextPhraseBtn").classList.add("hidden");
 document.getElementById("status").textContent="Phrase "+(pos+1)+" of "+roundSize+" • Let the group call out the ending";
}
function reveal(){
 document.getElementById("answer").classList.remove("hidden");
 document.getElementById("showAnswerBtn").classList.add("hidden");
 document.getElementById("nextPhraseBtn").classList.remove("hidden");
}
function next(){
 pos++;
 if(pos>=deck.length){show("done");return}
 render();
}
function full(){
 if(document.fullscreenElement){document.exitFullscreen()}else{document.documentElement.requestFullscreen()}
}
const categoryButtons=document.getElementById("categoryButtons");
Object.keys(DEFAULT_PHRASES).forEach(cat=>{
 const btn=document.createElement("button");
 btn.className="text-2xl md:text-3xl font-bold py-6 transition-transform hover:scale-[1.01]";
 btn.textContent=pretty(cat);
 btn.addEventListener("click",()=>startGame(cat));
 categoryButtons.appendChild(btn);
});
const total=Object.values(DEFAULT_PHRASES).reduce((n,a)=>n+a.length,0);
document.getElementById("bankInfo").textContent=Object.keys(DEFAULT_PHRASES).length+" ready-to-play categories • "+total+" phrases built in";
document.getElementById("showAnswerBtn").addEventListener("click",reveal);
document.getElementById("nextPhraseBtn").addEventListener("click",next);
document.getElementById("backBtn").addEventListener("click",()=>show("categories"));
document.getElementById("againBtn").addEventListener("click",()=>startGame(currentCategory));
document.getElementById("chooseBtn").addEventListener("click",()=>show("categories"));
document.getElementById("fullscreenBtn").addEventListener("click",full);
</script>
