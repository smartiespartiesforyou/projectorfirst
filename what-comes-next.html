<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Comes Next? — ProjectorFirst</title>
<script data-memberstack-app="app_cmgnwpg8y00x10suih4pua785" src="https://static.memberstack.com/scripts/v2/memberstack.js" type="text/javascript"></script>
<script src="/guard.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{
  margin:0;min-height:100vh;color:#17324d;font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 12% 10%,rgba(242,184,75,.30),transparent 24%),
    radial-gradient(circle at 88% 18%,rgba(110,157,139,.25),transparent 26%),
    linear-gradient(145deg,#fff8e8,#f3ede2 52%,#e6f0ed);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;
  background-image:
    linear-gradient(90deg,transparent 49%,rgba(23,50,77,.08) 50%,transparent 51%),
    linear-gradient(transparent 49%,rgba(23,50,77,.06) 50%,transparent 51%);
  background-size:48px 48px;
}
.pf-blue{background:#1e3a8a}.pf-blue:hover{background:#1d4ed8}
#startScreen,#gameScreen,#doneScreen{position:relative}
#startScreen h1,#gameTitle,#doneScreen h1{font-family:Georgia,serif!important;color:#17324d!important;text-shadow:0 3px 0 white}
#startScreen:before{content:"WHAT COMES NEXT?";display:block;font-weight:900;letter-spacing:.18em;color:#80694e;margin-top:8px;margin-bottom:10px}
.level-btn{
  border:4px solid rgba(255,255,255,.75);border-radius:26px;
  box-shadow:0 9px 0 #244d63,0 14px 28px rgba(23,50,77,.18);
  min-height:120px;color:white;font-weight:900
}
.level-btn.easy{background:linear-gradient(145deg,#3f7898,#2f607a)}
.level-btn.mixed{background:linear-gradient(145deg,#d97961,#bc5e4b);box-shadow:0 9px 0 #934738,0 14px 28px rgba(23,50,77,.18)}
#gameScreen{
  background:rgba(255,253,246,.9);border:3px solid rgba(23,50,77,.12);
  border-radius:34px;padding:24px!important;margin-top:24px!important;
  box-shadow:0 20px 50px rgba(23,50,77,.15)
}
#patternCard{
  background:linear-gradient(145deg,#fffdf6,#efe3c7);
  border:4px solid #d5c49d;border-radius:26px;
  box-shadow:0 8px 0 #b99d69,0 12px 18px rgba(23,50,77,.15);
  padding:34px 22px;max-width:1050px;margin:0 auto
}
#pattern{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px}
.pat-item,.mystery{
  width:clamp(72px,10vw,120px);height:clamp(72px,10vw,120px);
  display:flex;align-items:center;justify-content:center;
  background:#fffdf6;border:4px solid #d5c49d;border-radius:20px;
  box-shadow:0 7px 0 #b99d69;font-size:clamp(2.6rem,6vw,5.3rem);
  line-height:1
}
.mystery{
  background:#fff8e8;border-color:#e2b64c;color:#17324d;
  font-family:Georgia,serif;font-weight:900
}
.mystery.solved{background:#e9f4e8;border-color:#7aa17a;box-shadow:0 7px 0 #648c64}
#choices{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:24px}
.choice-btn{
  min-width:130px;min-height:100px;background:linear-gradient(145deg,#fffdf6,#efe3c7);
  border:4px solid #d5c49d;border-radius:20px;box-shadow:0 7px 0 #b99d69;
  font-size:clamp(2.5rem,6vw,5rem);cursor:pointer
}
.choice-btn.winner{background:#e9f4e8;border-color:#7aa17a;box-shadow:0 7px 0 #648c64}
.choice-btn.dimmed{opacity:.32}.choice-btn.wobble{animation:wobble .35s ease}
@keyframes wobble{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#status{
  background:#fff8e8;border-radius:16px;padding:10px 18px;max-width:820px;
  margin:18px auto 0;font-size:1.15rem;font-weight:800;color:#5e6a75
}
.big-btn{font-size:22px;padding:14px 22px;border-radius:1rem;font-weight:800;color:white;box-shadow:0 6px 0 rgba(23,50,77,.25)}
.confetti{position:fixed;top:-20px;pointer-events:none;z-index:50;font-size:1.8rem;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){.choice-btn.wobble,.confetti{animation:none}}
@media(max-width:700px){
  #gameScreen{padding:14px!important}#patternCard{padding:24px 14px}
  .pat-item,.mystery{width:65px;height:65px;border-radius:14px}
}
</style>
</head>
<body class="min-h-screen">

<div class="max-w-6xl mx-auto flex justify-between items-center p-6 border-b border-gray-200">
  <a href="apps.html" class="pf-blue text-white text-xl font-bold px-5 py-3 rounded-xl">← Back to Apps</a>
  <div class="flex gap-3 flex-wrap justify-end">
    <label class="flex items-center gap-2 text-[#17324d] font-bold text-lg bg-white/70 px-4 py-2 rounded-xl">
      <input type="checkbox" id="voiceToggle" class="w-5 h-5" checked> 🔊 Voice
    </label>
    <button id="fullscreenBtn" class="bg-blue-700 text-white text-xl font-bold px-6 py-3 rounded-xl hover:bg-blue-600">⛶ Fullscreen</button>
  </div>
</div>

<div id="startScreen" class="text-center mt-10 px-6 max-w-6xl mx-auto">
  <h1 class="text-4xl md:text-6xl font-extrabold mb-3">Choose a Level</h1>
  <p class="text-xl md:text-2xl font-bold text-slate-600 mb-10">10 patterns per round • tap the answer that comes next</p>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-4xl mx-auto">
    <button id="easyBtn" class="level-btn easy text-2xl md:text-3xl py-6">Easy Patterns<br><span class="text-lg">A-B-A-B</span></button>
    <button id="mixedBtn" class="level-btn mixed text-2xl md:text-3xl py-6">Mixed Patterns<br><span class="text-lg">A little trickier</span></button>
  </div>
</div>

<div id="gameScreen" class="text-center px-4 hidden max-w-6xl mx-auto">
  <div class="flex justify-between items-center gap-3 flex-wrap mb-6">
    <button id="levelsBtn" class="big-btn bg-gray-600 hover:bg-gray-500">← Levels</button>
    <h1 id="gameTitle" class="text-3xl md:text-5xl font-extrabold">What Comes Next?</h1>
    <button id="newRoundBtn" class="big-btn pf-blue">New Round</button>
  </div>

  <div id="patternCard">
    <div id="hostLine" class="text-xl md:text-2xl font-black mb-5">What comes next in the pattern?</div>
    <div id="pattern"></div>
    <div class="text-lg md:text-xl font-black mt-7 mb-2 text-slate-600">Pick one:</div>
    <div id="choices"></div>
  </div>

  <div id="status"></div>

  <div class="flex justify-center gap-6 mt-8 flex-wrap">
    <button id="revealBtn" class="big-btn bg-green-700 hover:bg-green-600">Show Answer</button>
    <button id="nextBtn" class="big-btn pf-blue hidden">Next Pattern</button>
  </div>
</div>

<div id="doneScreen" class="text-center mt-16 px-4 hidden max-w-5xl mx-auto">
  <div class="bg-white/80 border-4 border-white rounded-[34px] p-10 shadow-xl">
    <div class="text-6xl mb-4">👏</div>
    <h1 class="text-4xl md:text-6xl font-extrabold mb-4">Round Complete!</h1>
    <p class="text-xl md:text-2xl font-bold text-slate-600 mb-8">That was 10 patterns.</p>
    <div class="flex justify-center gap-6 flex-wrap">
      <button id="againBtn" class="big-btn bg-green-700 hover:bg-green-600">Play Another 10</button>
      <button id="chooseBtn" class="big-btn pf-blue">Choose Level</button>
    </div>
  </div>
</div>

<script>
const SETS=[
  ["🔴","🔵"],["⭐","🌙"],["🍎","🍌"],["🐶","🐱"],["🌹","🌻"],
  ["❤️","💛"],["🟡","🟢"],["🐦","🐟"],["☀️","☁️"],["🍪","🧁"],
  ["🦆","🐰"],["⚾","🏀"],["🎈","🎁"],["🌷","🍀"],["🚗","🚂"]
];
const THIRDS=["🟣","🍇","🐢","🌈","💙","🍊","🦋","⭐"];
const EASY_TEMPLATES=[[0,1],[0,0,1]];
const MIXED_TEMPLATES=[[0,1],[0,0,1],[0,1,1],[0,1,2]];

let level="easy",round=0,answer=null,choices=[],revealed=false;
const ROUND_SIZE=10;

let audioCtx=null;
function getCtx(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq,start,dur,type,vol){
  try{
    const ctx=getCtx(),o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type||"triangle";o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,ctx.currentTime+start);
    g.gain.exponentialRampToValueAtTime(vol||.2,ctx.currentTime+start+.02);
    g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+start+dur);
    o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+start);o.stop(ctx.currentTime+start+dur+.05);
  }catch(e){}
}
function popSound(){tone(520,0,.12,"triangle",.18)}
function softNote(){tone(330,0,.18,"sine",.13)}
function fanfare(){tone(523,0,.18,"triangle",.22);tone(659,.14,.18,"triangle",.22);tone(784,.28,.18,"triangle",.22)}

function speakText(text){
  if(!document.getElementById("voiceToggle").checked)return;
  if(!("speechSynthesis" in window))return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.rate=.9;window.speechSynthesis.speak(u);
}
function show(screen){
  document.getElementById("startScreen").classList.toggle("hidden",screen!=="start");
  document.getElementById("gameScreen").classList.toggle("hidden",screen!=="game");
  document.getElementById("doneScreen").classList.toggle("hidden",screen!=="done");
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function startGame(lvl){
  level=lvl;round=0;show("game");nextRound();
}
function buildRound(){
  const templates=level==="easy"?EASY_TEMPLATES:MIXED_TEMPLATES;
  const template=templates[Math.floor(Math.random()*templates.length)];
  const pair=SETS[Math.floor(Math.random()*SETS.length)];
  let items=pair.slice();
  if(template.indexOf(2)!==-1){
    let third;
    do{third=THIRDS[Math.floor(Math.random()*THIRDS.length)]}while(items.indexOf(third)!==-1);
    items.push(third);
  }
  const unitLen=template.length,repeats=unitLen===2?3:2,full=[];
  for(let r=0;r<=repeats;r++)for(const idx of template)full.push(items[idx]);
  const visibleCount=unitLen*repeats;
  return{visible:full.slice(0,visibleCount),answer:full[visibleCount],options:shuffle(items.slice())};
}
function nextRound(){
  if(round>=ROUND_SIZE){show("done");return}
  if(window.speechSynthesis)window.speechSynthesis.cancel();
  revealed=false;round++;
  const data=buildRound();answer=data.answer;choices=data.options;
  document.getElementById("hostLine").textContent="What comes next in the pattern?";
  document.getElementById("status").textContent="Pattern "+round+" of "+ROUND_SIZE+" • "+(level==="easy"?"Easy Patterns":"Mixed Patterns");
  const pat=document.getElementById("pattern");pat.innerHTML="";
  data.visible.forEach(it=>{const s=document.createElement("span");s.className="pat-item";s.textContent=it;pat.appendChild(s)});
  const q=document.createElement("span");q.className="mystery";q.id="mystery";q.textContent="?";pat.appendChild(q);
  const ch=document.getElementById("choices");ch.innerHTML="";
  choices.forEach((item,i)=>{
    const b=document.createElement("button");b.type="button";b.className="choice-btn";b.id="opt"+i;b.textContent=item;
    b.addEventListener("click",()=>pick(i));ch.appendChild(b);
  });
  document.getElementById("revealBtn").classList.remove("hidden");
  document.getElementById("nextBtn").classList.add("hidden");
  popSound();speakText("What comes next in the pattern?");
}
function pick(i){
  if(revealed)return;
  if(choices[i]===answer){reveal()}
  else{
    const el=document.getElementById("opt"+i);
    el.classList.remove("wobble");void el.offsetWidth;el.classList.add("wobble");softNote();
  }
}
function reveal(){
  if(revealed)return;revealed=true;
  const m=document.getElementById("mystery");m.textContent=answer;m.classList.add("solved");
  choices.forEach((c,i)=>{
    const el=document.getElementById("opt"+i);
    if(c===answer)el.classList.add("winner");else el.classList.add("dimmed");
  });
  document.getElementById("hostLine").textContent="That's it! Great pattern spotting!";
  document.getElementById("revealBtn").classList.add("hidden");
  document.getElementById("nextBtn").classList.remove("hidden");
  fanfare();throwConfetti(10);speakText("That's it! Great job!");
}
function throwConfetti(count){
  const icons=["🎉","✨","⭐","🎊"];
  for(let i=0;i<count;i++){
    const el=document.createElement("div");el.className="confetti";el.textContent=icons[Math.floor(Math.random()*icons.length)];
    el.style.left=Math.random()*100+"vw";el.style.animationDuration=(1.7+Math.random()*1.4)+"s";
    document.body.appendChild(el);setTimeout(()=>el.remove(),3300);
  }
}
function full(){
  if(document.fullscreenElement){document.exitFullscreen()}else{document.documentElement.requestFullscreen()}
}

document.getElementById("easyBtn").addEventListener("click",()=>startGame("easy"));
document.getElementById("mixedBtn").addEventListener("click",()=>startGame("mixed"));
document.getElementById("levelsBtn").addEventListener("click",()=>{if(window.speechSynthesis)window.speechSynthesis.cancel();show("start")});
document.getElementById("chooseBtn").addEventListener("click",()=>show("start"));
document.getElementById("newRoundBtn").addEventListener("click",()=>startGame(level));
document.getElementById("againBtn").addEventListener("click",()=>startGame(level));
document.getElementById("revealBtn").addEventListener("click",reveal);
document.getElementById("nextBtn").addEventListener("click",nextRound);
document.getElementById("fullscreenBtn").addEventListener("click",full);

document.addEventListener("keydown",ev=>{
  if((ev.code!=="Space"&&ev.key!==" ")||document.getElementById("gameScreen").classList.contains("hidden"))return;
  ev.preventDefault();if(!revealed)reveal();else nextRound();
});
</script>
</body>
</html>
