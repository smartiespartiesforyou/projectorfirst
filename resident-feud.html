<style>
:root{--navy:#17324d;--blue:#3f7898;--blue2:#2f607a;--coral:#d97961;--coral2:#bc5e4b;--sage:#6e9d8b;--sage2:#557e70;--cream:#fff8e8;--ivory:#fffdf6;--gold:#d5c49d}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  margin:0;color:var(--navy);font-family:Arial,sans-serif;min-height:100vh;
  background:
    radial-gradient(circle at 12% 10%,rgba(242,184,75,.30),transparent 24%),
    radial-gradient(circle at 88% 18%,rgba(110,157,139,.25),transparent 26%),
    linear-gradient(145deg,#fff8e8,#f3ede2 52%,#e6f0ed);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;
  background-image:
    linear-gradient(90deg,transparent 49%,rgba(23,50,77,.08) 50%,transparent 51%),
    linear-gradient(transparent 49%,rgba(23,50,77,.06) 50%,transparent 51%);
  background-size:48px 48px
}
.page{max-width:1320px;margin:0 auto;padding:0 18px 30px;position:relative}
.header{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding:22px 0;border-bottom:1px solid rgba(23,50,77,.12)
}
.eyebrow{font-weight:900;letter-spacing:.18em;color:#80694e;text-align:center;font-size:.92rem}
.header h1{
  margin:4px 0 0;font-family:Georgia,serif;font-size:clamp(2.3rem,5vw,4.5rem);
  font-weight:900;color:var(--navy);text-shadow:0 3px 0 white;text-align:center
}
.nav-btn,.btn{
  border:0;border-radius:16px;font-weight:900;cursor:pointer;text-decoration:none;
  box-shadow:0 6px 0 rgba(23,50,77,.24);transition:transform .08s ease;
  display:inline-flex;align-items:center;justify-content:center
}
.nav-btn{background:#1e3a8a;color:white;padding:12px 18px;font-size:clamp(1rem,1.8vw,1.2rem)}
.nav-btn:active,.btn:active,.team-btn:active{transform:translateY(3px)}
.game-shell{
  background:rgba(255,253,246,.9);border:3px solid rgba(23,50,77,.12);
  border-radius:34px;padding:22px;margin-top:24px;box-shadow:0 20px 50px rgba(23,50,77,.15)
}
.score-row{
  display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch;margin-bottom:18px
}
.score-card{
  background:linear-gradient(145deg,#fffdf6,#efe3c7);border:4px solid #d5c49d;
  border-radius:22px;box-shadow:0 7px 0 #b99d69;padding:14px 18px;text-align:center
}
.score-label{font-weight:900;letter-spacing:.08em;color:#80694e;font-size:.9rem}
.score{
  font-family:Georgia,serif;font-size:clamp(2.2rem,5vw,4rem);font-weight:900;color:var(--navy)
}
.center-controls{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  min-width:240px
}
.team-wrap{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.team-btn{
  border:4px solid rgba(255,255,255,.75);border-radius:18px;padding:10px 16px;
  font-size:clamp(1rem,1.8vw,1.2rem);font-weight:900;color:white;cursor:pointer;
  background:linear-gradient(145deg,var(--blue),var(--blue2));
  box-shadow:0 6px 0 #244d63
}
.team-btn:nth-child(2){
  background:linear-gradient(145deg,var(--coral),var(--coral2));box-shadow:0 6px 0 #934738
}
.team-btn.active{outline:5px solid #f2c45d;outline-offset:2px}
.strikes{
  min-height:46px;font-size:clamp(1.8rem,3.5vw,3rem);font-weight:900;
  letter-spacing:5px;text-align:center
}
.question{
  background:linear-gradient(145deg,#fffdf6,#efe3c7);border:4px solid #d5c49d;
  border-radius:26px;box-shadow:0 8px 0 #b99d69,0 12px 18px rgba(23,50,77,.15);
  padding:22px 26px;margin-bottom:20px;text-align:center;
  font-family:Georgia,serif;font-size:clamp(1.8rem,4vw,3.5rem);line-height:1.15;font-weight:900;color:var(--navy)
}
.board{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.answer-card{
  min-height:92px;padding:14px 18px;border:4px solid rgba(255,255,255,.78);
  border-radius:22px;background:linear-gradient(145deg,var(--blue),var(--blue2));
  box-shadow:0 7px 0 #244d63,0 12px 22px rgba(23,50,77,.16);
  color:white;font-size:clamp(1.15rem,2.2vw,1.8rem);font-weight:900;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:16px;user-select:none
}
.answer-card:nth-child(3n+2){
  background:linear-gradient(145deg,var(--coral),var(--coral2));box-shadow:0 7px 0 #934738,0 12px 22px rgba(23,50,77,.16)
}
.answer-card:nth-child(3n){
  background:linear-gradient(145deg,var(--sage),var(--sage2));box-shadow:0 7px 0 #42675a,0 12px 22px rgba(23,50,77,.16)
}
.answer-card .num{
  width:56px;height:56px;flex:0 0 56px;border-radius:50%;
  background:var(--ivory);color:var(--navy);display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;font-size:1.55rem;font-weight:900;
  box-shadow:0 4px 0 rgba(23,50,77,.2)
}
.answer-card.revealed{
  background:linear-gradient(145deg,#fffdf6,#efe3c7)!important;color:var(--navy);
  border-color:#d5c49d;box-shadow:0 7px 0 #b99d69;cursor:default;
  justify-content:space-between;text-align:left
}
.answer-card.revealed>div:first-child{flex:1}
.answer-score{
  min-width:72px;padding:8px 10px;border-radius:14px;background:#e9f4e8;
  border:3px solid #7aa17a;color:#245b3b;font-family:Georgia,serif;
  font-size:clamp(1.4rem,2.8vw,2.2rem);font-weight:900;text-align:center
}
.peek{
  display:none;margin:18px auto 0;max-width:1100px;padding:11px 14px;
  border:2px dashed #b8aa8b;border-radius:14px;background:#fff8e8;
  color:#64748b;font-size:.9rem;text-align:center
}
.peek.show{display:block}
.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px}
.btn{
  padding:13px 18px;font-size:clamp(1rem,1.8vw,1.2rem);color:var(--navy);
  background:#fff;border:3px solid rgba(23,50,77,.14)
}
.btn-blue{background:#1e3a8a;color:white;border-color:#1e3a8a}
.btn-red{background:linear-gradient(145deg,var(--coral),var(--coral2));color:white;border-color:#bc5e4b}
.progress{
  text-align:center;margin-top:15px;font-size:1.05rem;font-weight:800;color:#64748b
}
#bigX{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(23,50,77,.45);z-index:50;font-size:clamp(9rem,28vw,22rem);
  font-weight:900;color:#d95454;text-shadow:0 6px 0 white
}
.nav-btn:focus-visible,.btn:focus-visible,.team-btn:focus-visible,.answer-card:focus-visible{
  outline:5px solid #f2c45d;outline-offset:3px
}
@media(max-width:850px){
  .score-row{grid-template-columns:1fr 1fr}.center-controls{grid-column:1/-1;grid-row:2;order:3}
  .board{grid-template-columns:1fr}.game-shell{padding:14px}.answer-card{min-height:82px}
}
</style>
</head>

<body>
<div class="page">
  <div class="header">
    <a href="apps.html" class="nav-btn">← Back to Apps</a>
    <div>
      <div class="eyebrow">RESIDENT FEUD</div>
      <h1>Survey Says!</h1>
    </div>
    <button class="nav-btn" onclick="toggleFullScreen()">⛶ Fullscreen</button>
  </div>

  <main class="game-shell">
    <div class="score-row">
      <div class="score-card">
        <div class="score-label">TABLE A</div>
        <div class="score" id="scoreA">TABLE A: 0</div>
      </div>

      <div class="center-controls">
        <div class="score-label">ACTIVE TABLE</div>
        <div class="team-wrap">
          <button class="team-btn" id="btnA" onclick="setTeam('A')">Table A</button>
          <button class="team-btn" id="btnB" onclick="setTeam('B')">Table B</button>
        </div>
        <div class="strikes" id="strikes"></div>
      </div>

      <div class="score-card">
        <div class="score-label">TABLE B</div>
        <div class="score" id="scoreB">TABLE B: 0</div>
      </div>
    </div>

    <div class="question" id="question"></div>
    <div class="board" id="board"></div>
    <div id="peek" class="peek"></div>

    <div class="controls">
      <button class="btn btn-red" onclick="strike()">❌ Strike</button>
      <button class="btn" onclick="togglePeek()">👁 Host Peek</button>
      <a class="btn" href="resident-feud-host-key.html" target="_blank">🖨 Host Key</a>
      <button class="btn" onclick="revealAll()">Show Remaining</button>
      <button class="btn btn-blue" onclick="nextQuestion()">Next Question →</button>
    </div>

    <div class="progress" id="progress"></div>
  </main>
</div>

<div id="bigX">❌</div>
<script>
"use strict";

/* 30 survey questions written for the folks in the room.
   Tap the active table, tap a card when they guess it — points go to that table. */
const QUESTIONS = [
  { q:"Name something you'd find in Grandma's purse", a:[["TISSUES",34],["HARD CANDY",26],["COIN PURSE",15],["LIPSTICK",11],["PHOTOS",8],["PRAYER CARD",6]]},
  { q:"Name a chore kids did on the farm", a:[["FEEDING CHICKENS",30],["MILKING COWS",25],["COLLECTING EGGS",18],["WEEDING THE GARDEN",13],["HAULING WATER",9],["SLOPPING HOGS",5]]},
  { q:"Name something people did on Sunday after church", a:[["BIG FAMILY DINNER",38],["VISITED RELATIVES",24],["TOOK A NAP",17],["WENT FOR A DRIVE",12],["LISTENED TO THE RADIO",9]]},
  { q:"Name a famous crooner", a:[["FRANK SINATRA",36],["BING CROSBY",27],["DEAN MARTIN",16],["PERRY COMO",12],["NAT KING COLE",9]]},
  { q:"Name something you'd see at a drive-in movie", a:[["THE BIG SCREEN",28],["WINDOW SPEAKERS",24],["POPCORN",18],["TEENAGERS",14],["THE SNACK BAR",10],["MOSQUITOES",6]]},
  { q:"Name a food you'd find at a church potluck", a:[["FRIED CHICKEN",32],["CASSEROLE",25],["DEVILED EGGS",17],["JELLO SALAD",13],["HOMEMADE PIE",9],["DINNER ROLLS",4]]},
  { q:"Name something families did before television", a:[["LISTENED TO THE RADIO",35],["PLAYED CARDS",23],["READ BOOKS",16],["PLAYED BOARD GAMES",12],["SANG AROUND THE PIANO",9],["TOLD STORIES",5]]},
  { q:"Name a place you went on a first date", a:[["THE MOVIES",33],["THE SODA FOUNTAIN",24],["A DANCE",18],["THE DINER",13],["THE DRIVE-IN",12]]},
  { q:"Name something in a 1950s kitchen", a:[["COFFEE PERCOLATOR",27],["COOKIE JAR",23],["BREAD BOX",19],["APRON",14],["ICEBOX",10],["FLOUR SIFTER",7]]},
  { q:"Name a game kids played outside", a:[["HIDE AND SEEK",30],["HOPSCOTCH",22],["TAG",17],["JUMP ROPE",14],["MARBLES",10],["KICK THE CAN",7]]},
  { q:"Name something the milkman delivered", a:[["MILK",42],["BUTTER",22],["EGGS",16],["CREAM",12],["CHEESE",8]]},
  { q:"Name a reason kids got sent to the principal's office", a:[["TALKING IN CLASS",31],["CHEWING GUM",25],["PASSING NOTES",18],["FIGHTING",14],["BEING TARDY",12]]},
  { q:"Name something you could win at the county fair", a:[["BLUE RIBBON",33],["STUFFED ANIMAL",26],["GOLDFISH",18],["KEWPIE DOLL",13],["CAKE PRIZE",10]]},
  { q:"Name a famous TV western", a:[["GUNSMOKE",34],["BONANZA",28],["THE LONE RANGER",16],["RAWHIDE",12],["WAGON TRAIN",10]]},
  { q:"Name something Mom made from scratch", a:[["BREAD",29],["PIE",24],["OUR CLOTHES",17],["JAM",13],["BISCUITS",10],["BIRTHDAY CAKES",7]]},
  { q:"Name a way kids earned pocket money", a:[["PAPER ROUTE",32],["BABYSITTING",25],["MOWING LAWNS",19],["SHOVELING SNOW",13],["RETURNING BOTTLES",11]]},
  { q:"Name something found in Dad's garage", a:[["TOOLS",36],["WORKBENCH",22],["JARS OF NAILS",15],["FISHING GEAR",13],["OIL CANS",9],["THE GOOD FLASHLIGHT",5]]},
  { q:"Name a dance from back in the day", a:[["THE JITTERBUG",30],["THE WALTZ",23],["THE TWIST",19],["THE FOXTROT",15],["SWING",13]]},
  { q:"Name something people put on their Christmas tree", a:[["TINSEL",31],["GLASS ORNAMENTS",25],["POPCORN STRINGS",17],["AN ANGEL ON TOP",14],["COLORED LIGHTS",13]]},
  { q:"Name a flavor at the old soda fountain", a:[["CHOCOLATE",33],["VANILLA",26],["STRAWBERRY",17],["CHERRY",14],["ROOT BEER",10]]},
  { q:"Name something you did at a sock hop", a:[["DANCED",40],["DRANK PUNCH",21],["LISTENED TO RECORDS",16],["MET A SWEETHEART",13],["STOOD BY THE WALL",10]]},
  { q:"Name something you could order from the Sears catalog", a:[["CLOTHES",30],["TOOLS",22],["APPLIANCES",18],["TOYS",15],["A WHOLE HOUSE!",15]]},
  { q:"Name something people canned or preserved", a:[["TOMATOES",29],["GREEN BEANS",24],["PEACHES",18],["PICKLES",16],["JAM",13]]},
  { q:"Name a classic TV funny man", a:[["JACKIE GLEASON",28],["RED SKELTON",24],["BOB HOPE",20],["MILTON BERLE",15],["JACK BENNY",13]]},
  { q:"Name something in a one-room schoolhouse", a:[["CHALKBOARD",33],["WOOD STOVE",23],["SCHOOL BELL",18],["INKWELLS",14],["McGUFFEY READERS",12]]},
  { q:"Name something you needed for a picnic", a:[["PICNIC BASKET",31],["BLANKET",24],["FRIED CHICKEN",19],["LEMONADE",14],["WATERMELON",12]]},
  { q:"Name a way people kept cool before air conditioning", a:[["ELECTRIC FAN",29],["SAT ON THE PORCH",24],["THE SWIMMING HOLE",18],["SHADE TREE",15],["BLOCK OF ICE",14]]},
  { q:"Name something a 1950s teenager saved up for", a:[["A CAR",34],["RECORD PLAYER",23],["RECORDS",17],["TRANSISTOR RADIO",14],["PROM CLOTHES",12]]},
  { q:"Name a sound you'd hear on an old farm", a:[["ROOSTER CROWING",34],["COWS MOOING",24],["THE TRACTOR",16],["SCREEN DOOR SLAM",14],["THE WINDMILL",12]]},
  { q:"Name something people did by hand before machines", a:[["WASHED CLOTHES",30],["SEWED CLOTHES",23],["CHURNED BUTTER",18],["KNEADED BREAD",15],["WROTE LETTERS",14]]}
];

let deck = [];
let qIdx = 0;
let team = "A";
let scoreA = 0, scoreB = 0;
let strikeCount = 0;
let audioCtx = null;

const $ = id => document.getElementById(id);

function shuffle(arr){
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Tiny built-in sounds — no audio files to break */
function tone(freq, dur, type){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.25, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
const ding = () => { tone(880, .35, "sine"); setTimeout(() => tone(1320, .4, "sine"), 90); };
const buzzer = () => tone(110, .8, "sawtooth");

function loadQuestion(){
  const q = deck[qIdx];
  strikeCount = 0;
  $("strikes").textContent = "";
  $("question").textContent = q.q;
  $("peek").classList.remove("show");
  $("peek").textContent = "Answers: " + q.a.map(x => x[0]).join("  •  ");
  $("progress").textContent = "Question " + (qIdx + 1) + " of " + deck.length;

  const board = $("board");
  board.innerHTML = "";
  q.a.forEach((ans, i) => {
    const card = document.createElement("div");
    card.className = "answer-card";
    card.innerHTML = '<div class="num">' + (i + 1) + '</div>';
    card.onclick = () => reveal(card, i);
    board.appendChild(card);
  });
}

function reveal(card, i){
  if (card.classList.contains("revealed")) return;
  const [text, points] = deck[qIdx].a[i];
  card.classList.add("revealed");
  card.innerHTML = '<div>' + (i + 1) + '. ' + text + '</div><div class="answer-score">' + points + '</div>';
  if (team === "A") scoreA += points; else scoreB += points;
  updateScores();
  ding();
}

function revealAll(){
  /* end of round — show what's left WITHOUT giving points */
  const q = deck[qIdx];
  document.querySelectorAll(".answer-card").forEach((card, i) => {
    if (!card.classList.contains("revealed")) {
      const [text, points] = q.a[i];
      card.classList.add("revealed");
      card.innerHTML = '<div>' + (i + 1) + '. ' + text + '</div><div class="answer-score">' + points + '</div>';
    }
  });
}

function strike(){
  if (strikeCount >= 3) return;
  strikeCount++;
  $("strikes").textContent = "❌".repeat(strikeCount);
  buzzer();
  const x = $("bigX");
  x.style.display = "flex";
  setTimeout(() => { x.style.display = "none"; }, 900);
}

function setTeam(t){
  team = t;
  $("btnA").classList.toggle("active", t === "A");
  $("btnB").classList.toggle("active", t === "B");
}

function updateScores(){
  $("scoreA").textContent = "TABLE A: " + scoreA;
  $("scoreB").textContent = "TABLE B: " + scoreB;
}

function togglePeek(){
  $("peek").classList.toggle("show");
}

function nextQuestion(){
  qIdx++;
  if (qIdx >= deck.length) { deck = shuffle(QUESTIONS); qIdx = 0; }
  loadQuestion();
}

function toggleFullScreen(){
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

deck = shuffle(QUESTIONS);
qIdx = 0;
setTeam("A");
updateScores();
loadQuestion();
</script>
</body>
