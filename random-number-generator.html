<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Random Number Generator — ProjectorFirst</title>

<script data-memberstack-app="app_cmgnwpg8y00x10suih4pua785" src="https://static.memberstack.com/scripts/v2/memberstack.js" type="text/javascript"></script>
<script src="/guard.js"></script>

<meta name="description" content="Pick a random number in any range — great for raffles, prize draws, and picking a winner, with big high-contrast numbers for senior care."/>
<meta name="theme-color" content="#17324d"/>
<link rel="icon" href="/logo.svg" type="image/svg+xml"/>

<style>
:root{
  --navy:#17324d;--blue:#3f7898;--blue2:#2f607a;--coral:#d97961;--coral2:#bc5e4b;
  --sage:#6e9d8b;--sage2:#557e70;--cream:#fff8e8;--ivory:#fffdf6;--gold:#d5c49d;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;color:var(--navy);font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 12% 10%,rgba(242,184,75,.30),transparent 24%),
    radial-gradient(circle at 88% 18%,rgba(110,157,139,.25),transparent 26%),
    linear-gradient(145deg,#fff8e8,#f3ede2 52%,#e6f0ed);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;
  background-image:
    linear-gradient(90deg,transparent 49%,rgba(23,50,77,.08) 50%,transparent 51%),
    linear-gradient(transparent 49%,rgba(23,50,77,.06) 50%,transparent 51%);
  background-size:48px 48px
}
.topbar{
  max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;
  gap:12px;padding:22px 18px;border-bottom:1px solid rgba(23,50,77,.12);flex-wrap:wrap
}
.back-btn,.top-btn{
  background:#1e3a8a;color:#fff;border:0;text-decoration:none;font-weight:900;
  font-size:clamp(1rem,1.8vw,1.2rem);padding:12px 18px;border-radius:16px;
  box-shadow:0 6px 0 rgba(23,50,77,.24);cursor:pointer
}
.brand{font-weight:900;letter-spacing:.18em;color:#80694e}
.wrap{max-width:1180px;margin:0 auto;padding:30px 18px 34px;position:relative}
.eyebrow{text-align:center;font-weight:900;letter-spacing:.18em;color:#80694e}
h1{
  margin:6px 0 8px;text-align:center;font-family:Georgia,serif;
  font-size:clamp(2.7rem,6vw,5rem);font-weight:900;color:var(--navy);text-shadow:0 3px 0 #fff
}
.subtitle{
  margin:0 auto 24px;text-align:center;max-width:850px;color:#5e6a75;
  font-size:clamp(1.05rem,2vw,1.35rem);font-weight:800
}
.game-shell{
  background:rgba(255,253,246,.92);border:3px solid rgba(23,50,77,.12);
  border-radius:34px;padding:22px;box-shadow:0 20px 50px rgba(23,50,77,.15)
}
.range-panel{
  background:linear-gradient(145deg,#fffdf6,#efe3c7);border:4px solid #d5c49d;
  border-radius:24px;box-shadow:0 7px 0 #b99d69;padding:16px 18px;
  display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:22px
}
.range-panel label{font-size:1.05rem;font-weight:900;color:#5e6a75}
.range-panel input[type="number"]{
  width:95px;padding:10px;border:3px solid #c8b995;border-radius:14px;background:#fff;
  color:var(--navy);font-family:Georgia,serif;font-size:1.35rem;font-weight:900;text-align:center
}
.repeat-toggle{
  display:flex;align-items:center;gap:8px;font-weight:900;color:var(--navy);padding-left:6px
}
.repeat-toggle input{width:20px;height:20px}
.stage{
  display:grid;grid-template-columns:220px minmax(300px,1fr) 220px;gap:22px;align-items:center
}
.controls{display:flex;flex-direction:column;gap:14px}
.btn{
  min-height:64px;border:4px solid rgba(255,255,255,.78);border-radius:20px;
  color:#fff;font-size:clamp(1.15rem,2.3vw,1.5rem);font-weight:900;cursor:pointer;
  box-shadow:0 7px 0 rgba(23,50,77,.25);padding:12px 16px
}
.btn-generate{background:linear-gradient(145deg,var(--blue),var(--blue2));box-shadow:0 7px 0 #244d63}
.btn-reset{background:linear-gradient(145deg,var(--coral),var(--coral2));box-shadow:0 7px 0 #934738}
.btn-sound{background:linear-gradient(145deg,var(--sage),var(--sage2));box-shadow:0 7px 0 #42675a}
.btn:disabled{opacity:.5;cursor:not-allowed}
.number-card{
  min-height:420px;background:linear-gradient(145deg,#fffdf6,#efe3c7);
  border:4px solid #d5c49d;border-radius:30px;
  box-shadow:0 10px 0 #b99d69,0 15px 28px rgba(23,50,77,.16);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px
}
.caller-number{
  font-family:Georgia,serif;font-weight:900;color:var(--navy);line-height:.9;
  white-space:nowrap;text-align:center
}
.caller-sub{
  min-height:1.5em;margin-top:18px;font-size:clamp(1.1rem,2.3vw,1.45rem);
  font-weight:900;color:#6b756f;text-align:center
}
.tray-wrap{
  margin-top:24px;background:#fff8e8;border:3px solid rgba(23,50,77,.10);
  border-radius:22px;padding:16px
}
.tray-label{font-weight:900;color:#5e6a75;font-size:1.05rem;margin-bottom:10px}
.recent-calls{
  display:flex;align-items:center;gap:10px;overflow-x:auto;padding:3px 2px 10px
}
.recent-calls span{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  min-width:68px;height:68px;padding:0 10px;border-radius:50%;
  background:linear-gradient(145deg,var(--blue),var(--blue2));color:#fff;
  font-family:Georgia,serif;font-size:1.55rem;font-weight:900;box-shadow:0 5px 0 #244d63
}
.recent-calls span:first-child{
  background:linear-gradient(145deg,var(--sage),var(--sage2));box-shadow:0 5px 0 #42675a;
  outline:4px solid #f2c45d;outline-offset:3px
}
.hint{text-align:center;margin-top:13px;color:#7a7167;font-size:.95rem;font-weight:700}
@media(max-width:900px){
  .stage{grid-template-columns:1fr}.controls{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .controls .btn{min-width:180px}.number-card{min-height:320px}
}
</style>
</head>

<body>
<div class="topbar">
  <a href="apps.html" class="back-btn">← Back to Apps</a>
  <div class="brand">PROJECTOR FIRST</div>
  <button id="fsBtn" class="top-btn">⛶ Fullscreen</button>
</div>

<main class="wrap">
  <div class="eyebrow">RANDOM NUMBER GENERATOR</div>
  <h1>Pick a Number</h1>
  <p class="subtitle">Choose any range, then generate large random numbers for raffles, prizes, games, and drawings.</p>

  <section class="game-shell">
    <div class="range-panel">
      <label for="minInput">From</label>
      <input type="number" id="minInput" value="1"/>
      <label for="maxInput">to</label>
      <input type="number" id="maxInput" value="100"/>
      <label class="repeat-toggle">
        <input type="checkbox" id="repeatToggle" checked/>
        Avoid repeats
      </label>
    </div>

    <div class="stage">
      <div class="controls">
        <button id="nextBtn" class="btn btn-generate">Generate Number</button>
      </div>

      <div id="callerBox" class="number-card">
        <div id="callerText" class="caller-number">—</div>
        <div id="callerSub" class="caller-sub">Ready when you are.</div>
      </div>

      <div class="controls">
        <button id="resetBtn" class="btn btn-reset">Reset</button>
        <button id="soundBtn" class="btn btn-sound">🔊 Sound On</button>
      </div>
    </div>

    <div class="tray-wrap">
      <div class="tray-label">Generated so far: <span id="callCount">0</span> <span style="font-weight:700">(newest first)</span></div>
      <div id="recentCalls" class="recent-calls"></div>
    </div>

    <div class="hint">Space = Generate • R = Reset • F = Fullscreen • S = Sound</div>
  </section>
</main>

<script>
let pool=[],history=[],soundOn=true;

const callerText=document.getElementById("callerText");
const callerSub=document.getElementById("callerSub");
const recentDiv=document.getElementById("recentCalls");
const callCount=document.getElementById("callCount");
const minInput=document.getElementById("minInput");
const maxInput=document.getElementById("maxInput");
const repeatToggle=document.getElementById("repeatToggle");
const nextBtn=document.getElementById("nextBtn");

function getRange(){
  let min=parseInt(minInput.value,10);
  let max=parseInt(maxInput.value,10);
  if(isNaN(min))min=1;
  if(isNaN(max))max=100;
  if(min>max)[min,max]=[max,min];
  return{min,max};
}
function shuffle(arr){
  const randomValues=new Uint32Array(arr.length);
  crypto.getRandomValues(randomValues);
  for(let i=arr.length-1;i>0;i--){
    const j=randomValues[i]%(i+1);
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}
function initGame(){
  const{min,max}=getRange();
  pool=[];
  for(let n=min;n<=max;n++)pool.push(n);
  shuffle(pool);
  history=[];
  callerText.textContent="—";
  callerSub.textContent="Ready when you are.";
  recentDiv.innerHTML="";
  callCount.textContent="0";
  nextBtn.disabled=false;
  fitCaller();
}
function generateNext(){
  const{min,max}=getRange();
  if(repeatToggle.checked){
    if(pool.length===0){
      callerSub.textContent="All numbers used — tap Reset";
      nextBtn.disabled=true;
      return;
    }
    showNumber(pool.pop(),min,max);
  }else{
    showNumber(Math.floor(Math.random()*(max-min+1))+min,min,max);
  }
}
function showNumber(pick,min,max){
  history.push(pick);
  callerText.textContent=pick;
  callerSub.textContent=repeatToggle.checked?pool.length+" left of "+(max-min+1):"Repeats allowed";
  fitCaller();
  addRecent(pick);
  callCount.textContent=history.length;
  if(soundOn)speak(String(pick));
}
function addRecent(n){
  const el=document.createElement("span");
  el.textContent=n;
  recentDiv.prepend(el);
  recentDiv.scrollLeft=0;
  if(recentDiv.children.length>100)recentDiv.lastChild.remove();
}
function resetGame(){initGame()}
function toggleSound(){
  soundOn=!soundOn;
  document.getElementById("soundBtn").textContent=soundOn?"🔊 Sound On":"🔇 Sound Off";
  if(!soundOn&&"speechSynthesis" in window)speechSynthesis.cancel();
}
function toggleFullscreen(){
  if(!document.fullscreenElement)document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}
function speak(text){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const utter=new SpeechSynthesisUtterance(text);
  utter.rate=1;
  speechSynthesis.speak(utter);
}
function fitCaller(){
  const box=document.getElementById("callerBox");
  const text=callerText.textContent||"—";
  let size=Math.min(box.clientHeight*.55,(box.clientWidth*.88)/(.62*Math.max(text.length,1)));
  callerText.style.fontSize=size+"px";
  let guard=20;
  while(callerText.scrollWidth>box.clientWidth*.9&&guard-->0){
    size*=.94;
    callerText.style.fontSize=size+"px";
  }
}

window.addEventListener("resize",fitCaller);
document.addEventListener("fullscreenchange",fitCaller);
nextBtn.addEventListener("click",generateNext);
document.getElementById("resetBtn").addEventListener("click",resetGame);
document.getElementById("soundBtn").addEventListener("click",toggleSound);
document.getElementById("fsBtn").addEventListener("click",toggleFullscreen);
document.addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();generateNext()}
  if(e.code==="KeyR")resetGame();
  if(e.code==="KeyF")toggleFullscreen();
  if(e.code==="KeyS")toggleSound();
});
minInput.addEventListener("change",initGame);
maxInput.addEventListener("change",initGame);
repeatToggle.addEventListener("change",initGame);

initGame();
</script>
</body>
</html>
