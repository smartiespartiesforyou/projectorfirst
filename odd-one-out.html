let deck=[];
let deckIndex=0;
let current=null;
let revealed=false;

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildDeck(){
  deck=shuffle(ROUNDS.map((r,i)=>i));
  deckIndex=0;
}

function renderRound(){
  if(!deck.length||deckIndex>=deck.length)buildDeck();
  current=ROUNDS[deck[deckIndex]];
  revealed=false;

  document.getElementById("hostLine").textContent="Which one doesn't fit with the other three?";
  document.getElementById("roundLabel").textContent=
    "Round "+(deckIndex+1)+" of "+deck.length+" • no repeats until the deck reshuffles";

  const grid=document.getElementById("grid");
  grid.innerHTML="";

  current.items.forEach((item,i)=>{
    const b=document.createElement("button");
    b.className="choice";
    b.id="choice"+i;
    b.innerHTML="<div class='picture'>"+item[0]+"</div><div class='name'>"+item[1]+"</div>";
    b.onclick=()=>choose(i);
    grid.appendChild(b);
  });

  document.getElementById("answerBanner").classList.add("hidden");
  document.getElementById("answerBanner").innerHTML="";
  document.getElementById("revealBtn").classList.remove("hidden");
}

function choose(i){
  if(revealed)return;
  if(i===current.odd){
    reveal();
    return;
  }

  const el=document.getElementById("choice"+i);
  el.classList.add("try-again");
  setTimeout(()=>el.classList.remove("try-again"),500);
  softNote();
  document.getElementById("hostLine").textContent="That one still fits. Look for a different connection.";
  setTimeout(()=>{
    if(!revealed)document.getElementById("hostLine").textContent="Which one doesn't fit with the other three?";
  },1600);
}

function reveal(){
  if(revealed)return;
  revealed=true;

  current.items.forEach((_,i)=>{
    const el=document.getElementById("choice"+i);
    if(i===current.odd)el.classList.add("correct");
    else el.classList.add("dimmed");
  });

  const answer=current.items[current.odd][1];
  const banner=document.getElementById("answerBanner");
  banner.innerHTML="<strong>"+answer+"</strong> doesn't fit.<br>"+current.reason;
  banner.classList.remove("hidden");

  document.getElementById("hostLine").textContent="Here's the connection.";
  document.getElementById("revealBtn").classList.add("hidden");
  chime();
  speakText(answer+" doesn't fit. "+current.reason);
}

function nextRound(){
  if(window.speechSynthesis)window.speechSynthesis.cancel();
  deckIndex++;
  if(deckIndex>=deck.length)buildDeck();
  renderRound();
}

let audioCtx=null;
function getCtx(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  return audioCtx;
}
function tone(freq,start,dur,type,vol){
  const ctx=getCtx(),o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||"sine";o.frequency.value=freq;
  g.gain.setValueAtTime(.0001,ctx.currentTime+start);
  g.gain.exponentialRampToValueAtTime(vol||.14,ctx.currentTime+start+.02);
  g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+start+dur);
  o.connect(g).connect(ctx.destination);
  o.start(ctx.currentTime+start);o.stop(ctx.currentTime+start+dur+.05);
}
function softNote(){tone(300,0,.16,"sine",.09)}
function chime(){tone(523,0,.18,"triangle",.14);tone(659,.12,.2,"triangle",.14)}

function speakText(text){
  if(!document.getElementById("voiceToggle").checked)return;
  if(!("speechSynthesis" in window))return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=.9;
  window.speechSynthesis.speak(u);
}

function toggleFullscreen(){
  if(!document.fullscreenElement)document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

document.addEventListener("keydown",ev=>{
  if(ev.code==="KeyF"){toggleFullscreen();return}
  if(ev.code!=="Space"&&ev.key!==" ")return;
  ev.preventDefault();
  if(!revealed)reveal();
  else nextRound();
});

buildDeck();
renderRound();
