<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Casino Night — ProjectorFirst</title>

<script data-memberstack-app="app_cmgnwpg8y00x10suih4pua785" src="https://static.memberstack.com/scripts/v2/memberstack.js" type="text/javascript"></script>
<script src="/guard.js"></script>

<meta name="description" content="Large-screen Casino Night with Higher or Lower and Blackjack 21 for group activities."/>
<link rel="icon" href="/logo.svg" type="image/svg+xml"/>

<style>
:root{
  --navy:#17324d;--blue:#3f7898;--blue2:#2f607a;--coral:#d97961;--coral2:#bc5e4b;
  --sage:#6e9d8b;--sage2:#557e70;--cream:#fff8e8;--ivory:#fffdf6;--gold:#d5c49d;
  --felt:#17623b;--felt2:#0f4a2d;--wood:#8a5d32;--wood2:#68421f;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;color:var(--navy);font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 12% 10%,rgba(242,184,75,.26),transparent 24%),
    radial-gradient(circle at 88% 18%,rgba(110,157,139,.22),transparent 26%),
    linear-gradient(145deg,#fff8e8,#f3ede2 52%,#e6f0ed);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;
  background-image:
    linear-gradient(90deg,transparent 49%,rgba(23,50,77,.07) 50%,transparent 51%),
    linear-gradient(transparent 49%,rgba(23,50,77,.05) 50%,transparent 51%);
  background-size:48px 48px
}
button,a{font:inherit}
.topbar{
  max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:14px;padding:18px;border-bottom:1px solid rgba(23,50,77,.12);flex-wrap:wrap
}
.back-btn,.top-btn{
  border:0;border-radius:14px;background:#1e3a8a;color:#fff;text-decoration:none;
  font-weight:900;padding:11px 17px;cursor:pointer;box-shadow:0 5px 0 rgba(23,50,77,.22)
}
.title-block{text-align:center;flex:1;min-width:260px}
.eyebrow{font-size:.8rem;font-weight:900;letter-spacing:.18em;color:#80694e}
h1{
  margin:3px 0 0;font-family:Georgia,serif;font-size:clamp(2.2rem,5vw,4rem);
  color:var(--navy);line-height:1;text-shadow:0 2px 0 #fff
}
.wrap{max-width:1240px;margin:0 auto;padding:20px 18px 34px;position:relative;text-align:center}
.subtitle{
  margin:0 auto 18px;max-width:800px;color:#5f6c72;
  font-size:clamp(1.05rem,2vw,1.3rem);font-weight:800
}
.mode-picker{
  display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:18px
}
.mode-btn{
  min-width:250px;border:4px solid rgba(255,255,255,.85);border-radius:20px;
  color:#fff;font-size:clamp(1.15rem,2.2vw,1.55rem);font-weight:900;
  padding:14px 20px;cursor:pointer;box-shadow:0 7px 0 rgba(23,50,77,.22)
}
.mode-btn:first-child{background:linear-gradient(145deg,var(--blue),var(--blue2));box-shadow:0 7px 0 #244d63}
.mode-btn:last-child{background:linear-gradient(145deg,var(--sage),var(--sage2));box-shadow:0 7px 0 #42665b}
.mode-btn[aria-pressed="true"]{outline:5px solid #e8b74f;outline-offset:3px}
.table-frame{
  padding:10px;background:linear-gradient(145deg,var(--wood),var(--wood2));
  border-radius:34px;box-shadow:0 12px 0 #4d3017,0 20px 40px rgba(23,50,77,.18)
}
.felt{
  min-height:610px;background:
    radial-gradient(circle at 50% 35%,rgba(255,255,255,.07),transparent 28%),
    radial-gradient(ellipse at center,var(--felt),var(--felt2));
  border:4px solid rgba(255,255,255,.2);border-radius:26px;
  color:#fff;padding:clamp(22px,3vw,36px);
  box-shadow:inset 0 0 45px rgba(0,0,0,.28)
}
.game-title{
  margin:0 0 8px;font-family:Georgia,serif;
  font-size:clamp(1.8rem,3.8vw,3rem);font-weight:900
}
.game-sub{
  margin:0 0 16px;font-size:clamp(1.15rem,2.2vw,1.5rem);font-weight:800
}
.stat-line{
  display:flex;justify-content:center;gap:18px;flex-wrap:wrap;
  font-size:clamp(1.05rem,2vw,1.35rem);font-weight:800;margin-bottom:18px
}
.stat{
  background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.28);
  border-radius:14px;padding:9px 14px
}
.stat strong{font-family:"Arial Black",Arial,sans-serif;font-size:1.35em;color:#ffe08a}
.cards-row{
  display:flex;justify-content:center;align-items:center;gap:clamp(18px,3vw,34px);
  flex-wrap:wrap;margin:16px 0
}
.playing-card{
  background:#fff;border-radius:18px;border:5px solid #ece8df;
  box-shadow:0 8px 0 rgba(0,0,0,.28),0 14px 22px rgba(0,0,0,.2);
  width:clamp(150px,16vw,220px);height:clamp(210px,22.4vw,308px);
  display:flex;flex-direction:column;justify-content:space-between;
  padding:.5em .58em;font-weight:900;line-height:1
}
.playing-card .corner{
  font-family:"Arial Black",Arial,sans-serif;
  font-size:clamp(2.3rem,4.3vw,4.3rem);letter-spacing:-.05em
}
.playing-card .pip{
  font-size:clamp(5.5rem,10vw,9rem);text-align:center;line-height:.85
}
.card-red{color:#c93f35}.card-black{color:#102d46}
.card-back{
  background:
    linear-gradient(45deg,rgba(255,255,255,.14) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.14) 75%),
    linear-gradient(45deg,rgba(255,255,255,.14) 25%,#264f6a 25%,#264f6a 75%,rgba(255,255,255,.14) 75%);
  background-position:0 0,14px 14px;background-size:28px 28px;
  border:8px solid #fff
}
.banner{
  min-height:1.4em;margin:14px 0 18px;
  font-family:"Arial Black",Arial,sans-serif;
  font-size:clamp(1.6rem,3.4vw,2.8rem);font-weight:900;color:#ffe08a
}
.action-row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.action-btn{
  min-width:180px;border:4px solid rgba(255,255,255,.76);border-radius:18px;color:#fff;
  font-size:clamp(1.2rem,2.4vw,1.65rem);font-weight:900;padding:13px 20px;cursor:pointer;
  box-shadow:0 7px 0 rgba(0,0,0,.25)
}
.higher{background:linear-gradient(145deg,var(--blue),var(--blue2))}
.lower{background:linear-gradient(145deg,var(--coral),var(--coral2))}
.hit{background:linear-gradient(145deg,var(--blue),var(--blue2))}
.stand{background:linear-gradient(145deg,var(--coral),var(--coral2))}
.newhand{background:linear-gradient(145deg,var(--sage),var(--sage2))}
.hand-block{margin:6px 0 20px}
.hand-label{
  font-size:clamp(1.25rem,2.4vw,1.7rem);font-weight:900;margin-bottom:10px
}
.hand-total{
  display:inline-block;min-width:70px;margin-left:8px;
  font-family:"Arial Black",Arial,sans-serif;font-size:1.35em;color:#ffe08a
}
#bjDealerCards,#bjPlayerCards{
  display:flex;justify-content:center;gap:12px;flex-wrap:wrap
}
#bjGame .playing-card{
  width:clamp(105px,11vw,155px);height:clamp(147px,15.4vw,217px);
  border-radius:14px;border-width:4px
}
#bjGame .playing-card .corner{font-size:clamp(1.55rem,2.8vw,2.6rem)}
#bjGame .playing-card .pip{font-size:clamp(3.6rem,6.5vw,5.7rem)}
.helper{margin-top:13px;color:#7a7167;font-size:.95rem;font-weight:700}
[hidden]{display:none!important}
@media(max-width:760px){
  .title-block{order:-1;flex-basis:100%}
  .felt{min-height:560px}
  .mode-btn{min-width:min(90vw,300px)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<body>
<div class="topbar">
  <a href="apps.html" class="back-btn">← Back to Apps</a>
  <div class="title-block">
    <div class="eyebrow">CASINO NIGHT</div>
    <h1>Choose a Game</h1>
  </div>
  <button id="fsBtn" class="top-btn">⛶ Fullscreen</button>
</div>

<main class="wrap">
  <p class="subtitle">Two simple card games built for the whole room to play together.</p>

  <div class="mode-picker">
    <button id="modeHL" class="mode-btn" aria-pressed="true">🔺 Higher or Lower</button>
    <button id="modeBJ" class="mode-btn" aria-pressed="false">♠ Blackjack 21</button>
  </div>

  <div class="table-frame">
    <div class="felt">

      <section id="hlGame">
        <h2 class="game-title">Higher or Lower</h2>
        <p class="game-sub">Will the next card be higher or lower?</p>

        <div class="stat-line">
          <div class="stat">Winning streak: <strong id="hlStreak">0</strong></div>
          <div class="stat">Best today: <strong id="hlBest">0</strong></div>
        </div>

        <div class="cards-row">
          <div id="hlCard"></div>
          <div id="hlNextCard"></div>
        </div>

        <div id="hlBanner" class="banner" aria-live="polite">&nbsp;</div>

        <div class="action-row">
          <button id="hlHigher" class="action-btn higher">⬆ Higher</button>
          <button id="hlLower" class="action-btn lower">⬇ Lower</button>
        </div>
      </section>

      <section id="bjGame" hidden>
        <h2 class="game-title">Blackjack 21</h2>

        <div class="hand-block">
          <div class="hand-label">Dealer <span id="bjDealerTotal" class="hand-total"></span></div>
          <div id="bjDealerCards"></div>
        </div>

        <div id="bjBanner" class="banner" aria-live="polite">&nbsp;</div>

        <div class="hand-block">
          <div class="hand-label">Our Hand <span id="bjPlayerTotal" class="hand-total"></span></div>
          <div id="bjPlayerCards"></div>
        </div>

        <div class="action-row">
          <button id="bjHit" class="action-btn hit">🃏 Hit</button>
          <button id="bjStand" class="action-btn stand">✋ Stand</button>
          <button id="bjNew" class="action-btn newhand">🔄 New Hand</button>
        </div>
      </section>

    </div>
  </div>

  <div class="helper">F = Fullscreen</div>
</main>

<script>
(function(){
  "use strict";
  const $=id=>document.getElementById(id);

  const SUITS=[
    {s:"♥",red:true},{s:"♦",red:true},
    {s:"♠",red:false},{s:"♣",red:false}
  ];
  const RANKS=[
    {r:"A",v:11,hl:14},{r:"2",v:2,hl:2},{r:"3",v:3,hl:3},
    {r:"4",v:4,hl:4},{r:"5",v:5,hl:5},{r:"6",v:6,hl:6},
    {r:"7",v:7,hl:7},{r:"8",v:8,hl:8},{r:"9",v:9,hl:9},
    {r:"10",v:10,hl:10},{r:"J",v:10,hl:11},{r:"Q",v:10,hl:12},
    {r:"K",v:10,hl:13}
  ];

  let deck=[];
  function shuffle(){
    deck=[];
    for(const su of SUITS)for(const ra of RANKS)deck.push({...ra,suit:su.s,red:su.red});
    for(let i=deck.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [deck[i],deck[j]]=[deck[j],deck[i]];
    }
  }
  function draw(){if(deck.length<10)shuffle();return deck.pop()}

  function cardHTML(c,faceDown){
    if(faceDown)return '<div class="playing-card card-back" aria-label="Face-down card"></div>';
    const color=c.red?"card-red":"card-black";
    return '<div class="playing-card '+color+'" aria-label="'+c.r+' of '+c.suit+'">'+
      '<div class="corner" style="text-align:left">'+c.r+c.suit+'</div>'+
      '<div class="pip">'+c.suit+'</div>'+
      '<div class="corner" style="text-align:right;transform:rotate(180deg)">'+c.r+c.suit+'</div></div>';
  }

  function setMode(mode){
    const hl=mode==="hl";
    $("hlGame").hidden=!hl;
    $("bjGame").hidden=hl;
    $("modeHL").setAttribute("aria-pressed",hl);
    $("modeBJ").setAttribute("aria-pressed",!hl);
    if(hl)hlStart();else bjNewHand();
  }
  $("modeHL").addEventListener("click",()=>setMode("hl"));
  $("modeBJ").addEventListener("click",()=>setMode("bj"));

  let hlCurrent=null,streak=0,best=0,hlBusy=false;

  function hlStart(){
    shuffle();
    hlCurrent=draw();
    streak=0;
    $("hlStreak").textContent="0";
    $("hlBanner").innerHTML="&nbsp;";
    $("hlCard").innerHTML=cardHTML(hlCurrent);
    $("hlNextCard").innerHTML=cardHTML(null,true);
  }

  function hlGuess(higher){
    if(hlBusy)return;
    hlBusy=true;
    const next=draw();
    $("hlNextCard").innerHTML=cardHTML(next);
    let msg,win;
    if(next.hl===hlCurrent.hl){
      win=true;msg="A tie — everybody wins! 🎉";
    }else{
      win=higher?next.hl>hlCurrent.hl:next.hl<hlCurrent.hl;
      msg=win?"That's right! 🎉":"Oh no — the streak ends!";
    }
    if(win){streak++;if(streak>best)best=streak}else streak=0;
    $("hlStreak").textContent=streak;
    $("hlBest").textContent=best;
    $("hlBanner").textContent=msg;
    setTimeout(()=>{
      hlCurrent=next;
      $("hlCard").innerHTML=cardHTML(hlCurrent);
      $("hlNextCard").innerHTML=cardHTML(null,true);
      $("hlBanner").innerHTML=streak>0?streak+" in a row — keep going!":"&nbsp;";
      hlBusy=false;
    },2200);
  }

  $("hlHigher").addEventListener("click",()=>hlGuess(true));
  $("hlLower").addEventListener("click",()=>hlGuess(false));

  let pHand=[],dHand=[],bjOver=false;

  function total(hand){
    let t=hand.reduce((a,c)=>a+c.v,0);
    let aces=hand.filter(c=>c.r==="A").length;
    while(t>21&&aces>0){t-=10;aces--}
    return t;
  }

  function bjRender(revealDealer){
    $("bjPlayerCards").innerHTML=pHand.map(c=>cardHTML(c)).join("");
    $("bjPlayerTotal").textContent=total(pHand);

    if(revealDealer){
      $("bjDealerCards").innerHTML=dHand.map(c=>cardHTML(c)).join("");
      $("bjDealerTotal").textContent=total(dHand);
    }else{
      $("bjDealerCards").innerHTML=cardHTML(dHand[0])+cardHTML(null,true);
      $("bjDealerTotal").textContent="shows "+total([dHand[0]]);
    }
  }

  function bjNewHand(){
    shuffle();
    pHand=[draw(),draw()];
    dHand=[draw(),draw()];
    bjOver=false;
    $("bjBanner").innerHTML="&nbsp;";
    bjRender(false);
    if(total(pHand)===21)bjStand();
  }

  function bjEnd(msg){
    bjOver=true;
    $("bjBanner").textContent=msg;
    bjRender(true);
  }

  $("bjHit").addEventListener("click",()=>{
    if(bjOver)return;
    pHand.push(draw());
    bjRender(false);
    if(total(pHand)>21)bjEnd("Bust! Over 21 — dealer wins this one.");
    else if(total(pHand)===21)bjStand();
  });

  function bjStand(){
    if(bjOver)return;
    while(total(dHand)<17)dHand.push(draw());
    const p=total(pHand),d=total(dHand);
    if(p===21&&pHand.length===2)bjEnd("BLACKJACK! 🎉 We win!");
    else if(d>21)bjEnd("Dealer busts — WE WIN! 🎉");
    else if(p>d)bjEnd("We win, "+p+" beats "+d+"! 🎉");
    else if(p<d)bjEnd("Dealer wins, "+d+" beats "+p+".");
    else bjEnd("It's a push — a tie at "+p+"!");
  }

  $("bjStand").addEventListener("click",bjStand);
  $("bjNew").addEventListener("click",bjNewHand);

  function toggleFullscreen(){
    if(!document.fullscreenElement)document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
  $("fsBtn").addEventListener("click",toggleFullscreen);
  document.addEventListener("keydown",e=>{
    if(e.code==="KeyF")toggleFullscreen();
  });

  shuffle();
  hlStart();
})();
</script>
</body>
</html>
