<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Activity Calendar Maker — ProjectorFirst</title>

  <!-- Membership gate -->
  <script
    data-memberstack-app="app_cmgnwpg8y00x10suih4pua785"
    src="https://static.memberstack.com/scripts/v2/memberstack.js"
    type="text/javascript">
  </script>
  <script src="/guard.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PDF & Canvas -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <style>
    body { background:#f1f5f9; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }

    .btn-big {
      font-weight: 900;
      border-radius: 1.25rem;
      border: 4px solid #0f265f;
      box-shadow: 0 6px 0 #0f265f;
      transition: transform .08s ease, box-shadow .08s ease;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .btn-big:active { transform: translateY(4px); box-shadow: 0 2px 0 #0f265f; }

    @media print {
      @page { size: landscape; margin: 0.5in; }
      #toolbar, #topbar, #graphics-panel, #instructions { display: none !important; }
      body { margin: 0; background:#fff; }
    }

    /* Printable area */
    #print-area {
      position: relative;
      background:#fff;
      box-shadow: 0 0 0 1px #cbd5e1;
      overflow: hidden;
    }

    #bgTheme {
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit:cover;
      opacity:0;
      pointer-events:none;
      z-index:0;
    }

    .weekday {
      background:#1e3a8a;
      color:#fff;
      font-weight:700;
      text-align:center;
      padding:0.5rem;
    }

    .day-grid { position:relative; z-index:1; }

    .day-box {
      position: relative;
      min-height: 9rem;
      border: 1px solid #d1d5db;
      border-radius: 0.25rem;
      padding: 0.25rem;
      overflow: hidden;
      background-clip: padding-box;
      background:#fff;
    }

    .day-box.selected { outline: 3px solid #facc15; outline-offset: -2px; }
    .inactive { opacity:0.25; }

    .day-num {
      position: absolute;
      top: 0.35rem;
      right: 0.45rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: #374151;
    }

    .day-content {
      margin-top: 1rem;
      padding: 0.25rem;
      line-height: 1.25rem;
      font-size: 0.9rem;
      outline: none;
      min-height: 7rem;
      white-space: pre-wrap;
    }

    .day-content:empty::before {
      content: "Type here…";
      color: #9ca3af;
      white-space: pre-wrap;
    }

    .chip {
      display: flex; align-items: center; gap: 0.4rem;
      width: 100%; text-align: left;
      padding: 0.4rem 0.5rem;
      font-size: 0.85rem;
      border-radius: 0.5rem;
      border: 1px solid #e2e8f0;
      background: #fff;
      cursor: pointer;
    }
    .chip:hover { background:#eff6ff; border-color:#93c5fd; }
    .chip:active { background:#dbeafe; }
  </style>
</head>

<body>
  <!-- Top bar: Back to Apps -->
  <div id="topbar" class="max-w-screen-2xl mx-auto px-4 pt-4">
    <a href="apps.html" class="btn-big bg-blue-900 text-white text-sm px-4 py-2 no-underline inline-block">← Back to Apps</a>
  </div>

  <div class="p-4 md:p-6">
    <!-- Toolbar -->
    <div id="toolbar" class="max-w-screen-2xl mx-auto mb-4 flex flex-wrap gap-2 items-center">
      <div class="flex flex-wrap items-center gap-2">
        <label class="text-sm text-slate-700 font-semibold">Month</label>
        <select id="monthSel" class="border rounded px-2 py-1"></select>
        <label class="text-sm text-slate-700 font-semibold">Year</label>
        <select id="yearSel" class="border rounded px-2 py-1"></select>
      </div>

      <div class="flex flex-wrap items-center gap-2 ml-auto">
        <input type="file" id="bgUpload" accept="image/*" class="hidden">
        <button id="bgUploadBtn" class="px-3 py-2 rounded bg-gray-200 hover:bg-gray-300 text-sm font-semibold">Upload Background Image</button>
        <button id="bgRemoveBtn" class="px-3 py-2 rounded bg-gray-200 hover:bg-gray-300 text-sm font-semibold hidden">Remove Background</button>
        <label class="flex items-center gap-1 text-sm text-slate-700">
          <input type="checkbox" id="hiContrast" checked>
          Fade background (easier to read)
        </label>

        <button id="clearBtn" class="px-4 py-2 rounded-lg font-semibold bg-gray-200 hover:bg-gray-300 text-sm">Clear Calendar</button>
        <label class="text-sm text-slate-700 font-semibold">Print size</label>
        <select id="paperSel" class="border rounded px-2 py-1 text-sm">
          <option value="tabloid">11 × 17 (poster / common area)</option>
          <option value="letter">8.5 × 11 (letter, resident rooms)</option>
          <option value="legal">8.5 × 14 (legal)</option>
        </select>
        <button id="exportBtn" class="px-4 py-2 rounded-lg font-semibold bg-blue-600 text-white hover:bg-blue-700 text-sm">Export PDF</button>
      </div>
    </div>

    <p id="instructions" class="max-w-screen-2xl mx-auto text-sm text-slate-600 mb-3">
      Click into a day, then click a game or activity on the right to add it. You can also type directly into any day.
    </p>

    <!-- Layout -->
    <div class="flex flex-col lg:flex-row gap-4 max-w-screen-2xl mx-auto">
      <!-- Calendar -->
      <div id="print-area" class="flex-1 p-4 border border-slate-300 rounded-xl order-2 lg:order-1">
        <img id="bgTheme" alt="Background"/>

        <div class="mb-3 flex flex-col items-center relative z-10">
          <div class="text-2xl md:text-3xl font-bold text-center">
            <span id="facility" class="editable-header" contenteditable="true">Facility Name</span>
          </div>
          <div class="text-xl md:text-2xl font-semibold text-center text-slate-700">
            <span id="monthYear" class="editable-header" contenteditable="true">Month YYYY Activity Calendar</span>
          </div>
        </div>

        <div class="grid grid-cols-7 border border-gray-300 relative z-10">
          <div class="weekday">Sunday</div>
          <div class="weekday">Monday</div>
          <div class="weekday">Tuesday</div>
          <div class="weekday">Wednesday</div>
          <div class="weekday">Thursday</div>
          <div class="weekday">Friday</div>
          <div class="weekday">Saturday</div>
        </div>

        <div id="calendar" class="day-grid grid grid-cols-7 gap-1 border border-gray-300 relative z-10"></div>
      </div>

      <!-- Sidebar -->
      <aside id="graphics-panel" class="w-full lg:w-72 bg-white p-3 rounded-lg border border-gray-300 order-1 lg:order-2 lg:max-h-[85vh] lg:overflow-y-auto">
        <h2 class="text-lg font-bold mb-2 text-blue-900">Your Games</h2>
        <div id="gameChips" class="flex flex-col gap-1 mb-4"></div>

        <h2 class="text-lg font-bold mb-2 text-blue-900">Other Activities</h2>
        <div id="otherChips" class="flex flex-col gap-1"></div>
      </aside>
    </div>
  </div>

  <script>
    // ===== GAME LIST (matches apps.html) =====
    const games = [
      ["💰","Then vs Now (Prices)"], ["🙏","Daily Devotional"], ["🎱","Bingo Caller"],
      ["🎤","Resident Feud"], ["🎴","Pokeno"], ["💃","Move & Groove"],
      ["📝","Finish the Phrase"], ["🎲","Dice Roller"], ["❓","Trivia (True/False)"],
      ["💬","Let's Chat"], ["🎰","Casino Night"], ["🧩","Memory Match"],
      ["🎈","Pop the Balloon"], ["🔤","Word Scramble"], ["🗺️","Guess the State"],
      ["🎡","Fortune Spin"], ["📞","Guess the Caller"], ["🏇","Derby Day Horse Race"],
      ["🤔","Emoji Guess"], ["😀","What's That Emoji?"], ["🍎","Count It Up"],
      ["🕰️","Which Decade?"], ["🎡","Wheel of Words"], ["🚪","Let's Make a Deal"],
      ["🔍","Odd One Out"], ["🔗","Connect Words"], ["🎶","Rhyme Time"],
      ["❓","What Comes Next?"], ["🎤","Sing-Along"], ["📖","Silly Stories"],
      ["🔍","Mystery Pictures"]
    ];

    const otherActivities = [
      ["⛪","Church Service"], ["🍽️","Meal / Dining"], ["🏃","Exercise Class"],
      ["🚐","Van Outing"], ["🎂","Birthday Party"], ["👪","Family Visit"],
      ["💅","Manicures"], ["☕","Coffee & Newspaper"], ["😴","Quiet / Rest Time"],
      ["📋","Staff Meeting"]
    ];

    function buildChips(container, items) {
      items.forEach(([emoji, label]) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chip';
        btn.innerHTML = `<span>${emoji}</span><span>${label}</span>`;
        btn.addEventListener('click', () => insertIntoSelectedDay(`${emoji} ${label}`));
        container.appendChild(btn);
      });
    }
    buildChips(document.getElementById('gameChips'), games);
    buildChips(document.getElementById('otherChips'), otherActivities);

    // ===== UTIL =====
    const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    function daysIn(m,y){ return new Date(y,m+1,0).getDate(); }
    function firstWeekday(m,y){ return new Date(y,m,1).getDay(); }

    const monthSel=document.getElementById('monthSel');
    const yearSel=document.getElementById('yearSel');
    const now=new Date();
    months.forEach((m,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=m; monthSel.appendChild(o); });
    for(let y=now.getFullYear()-1;y<=now.getFullYear()+2;y++){ const o=document.createElement('option'); o.value=y; o.textContent=y; yearSel.appendChild(o); }
    monthSel.value=now.getMonth(); yearSel.value=now.getFullYear();

    // ===== BUILD GRID =====
    const calendar=document.getElementById("calendar");
    const boxes=[];
    for(let i=0;i<42;i++){
      const box=document.createElement("div");
      box.className="day-box";
      box.innerHTML=`<div class="day-num"></div><div class="day-content" contenteditable="true"></div>`;
      calendar.appendChild(box);
      boxes.push(box);

      const content = box.querySelector('.day-content');
      content.addEventListener('focus', () => {
        boxes.forEach(b => b.classList.remove('selected'));
        box.classList.add('selected');
        selectedDayContent = content;
      });
    }

    let selectedDayContent = null;

    function insertIntoSelectedDay(text){
      if (!selectedDayContent) {
        // Fall back to the first active day if nothing is selected yet.
        const firstActive = boxes.find(b => !b.classList.contains('inactive'));
        if (!firstActive) return;
        selectedDayContent = firstActive.querySelector('.day-content');
        boxes.forEach(b => b.classList.remove('selected'));
        firstActive.classList.add('selected');
      }
      const existing = selectedDayContent.textContent.trim();
      selectedDayContent.textContent = existing ? existing + "\n" + text : text;
    }

    function renumberGrid(){
      const m=parseInt(monthSel.value,10);
      const y=parseInt(yearSel.value,10);
      document.getElementById('monthYear').textContent=`${months[m]} ${y} Activity Calendar`;
      const start=firstWeekday(m,y);
      const total=daysIn(m,y);
      let d=1;
      for(let i=0;i<42;i++){
        const n=boxes[i].querySelector('.day-num');
        const content=boxes[i].querySelector('.day-content');
        const active=i>=start&&i<start+total;
        boxes[i].classList.toggle('inactive',!active);
        content.setAttribute('contenteditable', active ? 'true' : 'false');
        n.textContent=active?d++:'';
      }
    }
    monthSel.addEventListener('change', renumberGrid);
    yearSel.addEventListener('change', renumberGrid);
    renumberGrid();

    // ===== CLEAR CALENDAR =====
    document.getElementById('clearBtn').addEventListener('click', () => {
      if (!confirm("Clear all activities from every day? Your facility name, month, and background image will stay.")) return;
      document.querySelectorAll('.day-content').forEach(el => el.textContent = "");
    });

    // ===== BACKGROUND UPLOAD (local file, no external assets) =====
    const bgUpload = document.getElementById('bgUpload');
    const bgUploadBtn = document.getElementById('bgUploadBtn');
    const bgRemoveBtn = document.getElementById('bgRemoveBtn');
    const bgTheme = document.getElementById('bgTheme');
    const hiContrast = document.getElementById('hiContrast');

    bgUploadBtn.addEventListener('click', () => bgUpload.click());
    bgUpload.addEventListener('change', () => {
      const file = bgUpload.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        bgTheme.src = e.target.result;
        applyBgOpacity();
        bgRemoveBtn.classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    });
    bgRemoveBtn.addEventListener('click', () => {
      bgTheme.src = '';
      bgTheme.style.opacity = 0;
      bgRemoveBtn.classList.add('hidden');
      bgUpload.value = '';
    });
    function applyBgOpacity(){
      if (!bgTheme.src) { bgTheme.style.opacity = 0; return; }
      bgTheme.style.opacity = hiContrast.checked ? 0.15 : 0.5;
    }
    hiContrast.addEventListener('change', applyBgOpacity);

    // ===== EXPORT TO PDF =====
    // Paper sizes below are landscape (wide side first) since the calendar
    // grid is always 7 columns wide. Letter/legal print on any normal
    // office or home printer; tabloid needs a large-format printer or
    // print shop.
    const paperSizes = {
      tabloid: { w: 17,  h: 11,   label: "11x17" },
      letter:  { w: 11,  h: 8.5,  label: "8.5x11" },
      legal:   { w: 14,  h: 8.5,  label: "8.5x14" }
    };

    document.getElementById("exportBtn").addEventListener("click", async ()=>{
      const { jsPDF }=window.jspdf;
      const node=document.getElementById("print-area");
      const size = paperSizes[document.getElementById('paperSel').value];

      const canvas=await html2canvas(node,{scale:2,useCORS:true,backgroundColor:"#ffffff"});
      const imgData=canvas.toDataURL("image/png");
      const pdf=new jsPDF({orientation:"landscape",unit:"in",format:[size.w,size.h]});

      const pdfW=size.w, pdfH=size.h;
      const imgW=canvas.width/96, imgH=canvas.height/96;
      const imgRatio=imgW/imgH, pageRatio=pdfW/pdfH;

      let w,h,x,y;
      if(imgRatio>pageRatio){ w=pdfW; h=pdfW/imgRatio; x=0; y=(pdfH-h)/2; }
      else{ h=pdfH; w=pdfH*imgRatio; x=(pdfW-w)/2; y=0; }

      pdf.addImage(imgData,"PNG",x-0.05,y-0.05,w+0.1,h+0.1);
      const title=document.getElementById("monthYear").innerText.replace(/\s+/g,"_");
      pdf.save(`${title}_${size.label}.pdf`);
    });
  </script>
</body>
</html>
