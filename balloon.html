/* 🎈 Balloon pop animation */
@keyframes pop {
  0%   { transform: scale(1);   opacity: 1; }
  60%  { transform: scale(1.4); opacity: 1; }
  100% { transform: scale(0.6); opacity: 0; }
}

.balloon-pop {
  animation: pop 0.35s ease-out forwards;
}

<body class="bg-white text-gray-900 min-h-screen">

  <!-- Header -->
  <div class="max-w-6xl mx-auto flex justify-between items-center p-6 border-b border-gray-200">
    <a href="apps.html"
       class="pf-blue text-white text-xl font-bold px-5 py-3 rounded-xl hover:pf-blue">
      ← Back to Apps
    </a>

    <button onclick="document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()" class="bg-blue-700 text-white text-xl font-bold px-6 py-3 rounded-xl hover:bg-blue-600">⛶ Fullscreen</button>
  </div>

  <!-- Category Screen -->
  <div id="categoryScreen" class="text-center mt-10 px-6 max-w-6xl mx-auto">
    <h1 class="text-4xl md:text-6xl font-extrabold text-blue-800 mb-10">
      Balloon Word Pop
    </h1>
    <p class="text-xl text-gray-700 mb-6">
      Choose a category, call out letters, and try to solve the word before the balloons are gone.
    </p>

    <div id="categoryButtons"
         class="grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-4xl mx-auto">
    </div>
  </div>

  <!-- Game Screen -->
  <div id="gameScreen" class="text-center mt-10 px-4 hidden max-w-6xl mx-auto">
    <h2 id="categoryTitle" class="text-3xl md:text-5xl font-extrabold text-blue-800 mb-6">
      Category
    </h2>

    <!-- Balloons row -->
    <div id="balloons"
         class="flex items-center justify-center gap-4 mb-10 h-24"
         aria-label="Remaining balloons">
    </div>

    <!-- Word display -->
    <div id="word"
         class="flex flex-wrap items-center justify-center gap-3 md:gap-5 mb-10 min-h-28"
         aria-label="Hidden word">
    </div>

    <!-- Status text -->
    <div id="status"
         class="text-center text-3xl font-bold pf-blue-text mb-10 h-10"
         aria-live="polite">
    </div>

    <div id="alphabet" aria-label="Choose a letter"></div>

    <!-- Used letters -->
    <div class="text-center text-xl font-bold text-gray-700 mb-4">
      Used Letters
    </div>
    <div id="usedLetters"
         class="flex flex-wrap justify-center gap-x-6 gap-y-3 font-extrabold border-t-2 border-gray-200 pt-6 mb-10">
    </div>

    <div class="flex justify-center gap-4 flex-wrap mb-10">
      <button id="newWordBtn" class="big-btn pf-blue hover:pf-blue">
        Next Word
      </button>
      <button id="revealBtn" class="big-btn bg-green-700 hover:bg-green-600">
        Show Answer
      </button>
      <button id="backBtn" class="big-btn bg-gray-600 hover:bg-gray-500">
        ⬅ Back
      </button>
    </div>
  </div>

  <script>
    // =========================
    // DATA: READY-TO-PLAY CATEGORIES + WORDS
    // =========================

    const DEFAULT_BANK = {
      Animals: ["ELEPHANT","KANGAROO","ALLIGATOR","PORCUPINE","CHAMELEON","ARMADILLO","RHINOCEROS","HIPPOPOTAMUS","FLAMINGO","BUTTERFLY","DOLPHIN","PENGUIN"],
      Foods: ["SPAGHETTI","PINEAPPLE","CHOCOLATE","BLUEBERRY","WATERMELON","LASAGNA","MARSHMALLOW","ARTICHOKE","PANCAKES","MEATLOAF","POPCORN","STRAWBERRY"],
      "Around the House": ["TELEPHONE","REFRIGERATOR","ROCKING CHAIR","TELEVISION","PILLOWCASE","WASHING MACHINE","TOOTHBRUSH","FLASHLIGHT","UMBRELLA","CALENDAR","VACUUM","CURTAINS"],
      "Old-Time Favorites": ["JUKEBOX","DRIVE IN","MILKSHAKE","POODLE SKIRT","RECORD PLAYER","SODA FOUNTAIN","TYPEWRITER","ROLLER SKATES","HULA HOOP","PHONE BOOTH","PAPER DOLL","MALT SHOP"],
      "Louisiana": ["CRAWFISH","MAGNOLIA","PELICAN","BAYOU","JAMBALAYA","GUMBO","BEIGNET","ZYDECO","ALLIGATOR","MISSISSIPPI","BATON ROUGE","MARDI GRAS"],
      "Music": ["PIANO","TRUMPET","SAXOPHONE","HARMONICA","GUITAR","VIOLIN","DRUMMER","MELODY","CHORUS","DANCING","CONCERT","SINGING"],
      "Holidays": ["CHRISTMAS","THANKSGIVING","VALENTINE","FIREWORKS","HALLOWEEN","EASTER BUNNY","MISTLETOE","PUMPKIN","ORNAMENT","BIRTHDAY","PARADE","STOCKING"],
      "Garden & Outdoors": ["SUNFLOWER","BUTTERFLY","DAFFODIL","VEGETABLE","BIRDHOUSE","WATERING CAN","TOMATO","MAGNOLIA","ROSEBUSH","PICNIC","HUMMINGBIRD","GARDEN"],
      "Travel": ["SUITCASE","AIRPLANE","VACATION","HIGHWAY","PASSPORT","MOTEL","POSTCARD","ROAD TRIP","TRAIN STATION","MAP","BEACH","MOUNTAINS"],
      "Occupations": ["TEACHER","CARPENTER","NURSE","FIREMAN","SECRETARY","FARMER","BARBER","MECHANIC","WAITRESS","MAILMAN","PLUMBER","CASHIER"],
      "Movies & TV": ["COWBOY","COMEDY","WESTERN","CARTOON","MOVIE STAR","TELEVISION","THEATER","CAMERA","COMMERCIAL","NEWSCAST","ACTRESS","POPCORN"],
      "Sayings": ["PIECE OF CAKE","BREAK A LEG","HOLD YOUR HORSES","EASY DOES IT","BETTER LATE THAN NEVER","COSTS AN ARM AND A LEG","UNDER THE WEATHER","THE EARLY BIRD","TIME FLIES","ON CLOUD NINE"]
    };

    const categories = Object.keys(DEFAULT_BANK);
    const words = [];
    categories.forEach(cat => DEFAULT_BANK[cat].forEach(w => words.push({word:w, category:cat})));

    // =========================
    // DOM ELEMENTS
    // =========================

    const categoryScreen = document.getElementById("categoryScreen");
    const gameScreen = document.getElementById("gameScreen");
    const categoryButtons = document.getElementById("categoryButtons");
    const categoryTitle = document.getElementById("categoryTitle");
    const balloonsEl = document.getElementById("balloons");
    const wordEl = document.getElementById("word");
    const statusEl = document.getElementById("status");
    const usedLettersEl = document.getElementById("usedLetters");

    const newWordBtn = document.getElementById("newWordBtn");
    const revealBtn = document.getElementById("revealBtn");
    const backBtn = document.getElementById("backBtn");

    // =========================
    // GAME STATE
    // =========================

    const MAX_MISSES = 6;
    let currentCategory = null;
    let filteredWords = [];
    let word = "";
    let revealed = [];
    let used = new Set();
    let misses = 0;
    let finished = false;

    // =========================
    // RENDER HELPERS
    // =========================

    function setStatus(msg, colorClass = "pf-blue-text") {
      statusEl.className = `text-center text-3xl font-bold ${colorClass} mb-10 h-10`;
      statusEl.textContent = msg;
    }

    function renderCategories() {
      categoryButtons.innerHTML = "";
      categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className =
          "pf-blue hover:pf-blue text-white text-2xl md:text-3xl font-bold py-6 rounded-2xl transition-all transform hover:scale-[1.01]";
        btn.textContent = cat;
        btn.onclick = () => startCategory(cat);
        categoryButtons.appendChild(btn);
      });
    }

    function renderBalloons() {
      balloonsEl.innerHTML = "";
      const remaining = MAX_MISSES - misses;
      for (let i = 0; i < remaining; i++) {
        const balloon = document.createElement("div");
        balloon.className = "pf-balloon";
        balloon.setAttribute("aria-label","balloon");
        balloonsEl.appendChild(balloon);
      }
    }

    function renderAlphabet() {
      const alphabetEl = document.getElementById("alphabet");
      alphabetEl.innerHTML = "";
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(letter => {
        const btn = document.createElement("button");
        btn.className = "letter-key" + (used.has(letter) ? " used" : "");
        btn.textContent = letter;
        btn.disabled = used.has(letter) || finished;
        btn.onclick = () => handleGuess(letter);
        alphabetEl.appendChild(btn);
      });
    }

    function renderWord() {
      wordEl.innerHTML = "";
      Array.from(word).forEach((ch, i) => {
        const box = document.createElement("div");
        if (ch === " ") {
          box.className = "w-10 h-20";
        } else if (ch === "-") {
          box.className = "text-5xl font-bold text-gray-700 pt-4";
          box.textContent = "-";
        } else {
          const shown = revealed[i];
          box.className =
            "word-box-base transition duration-150 " +
            (shown ? "word-box-revealed" : "word-box-hidden");

          const span = document.createElement("span");
          span.className = shown ? "leading-none" : "leading-none text-5xl";
          span.textContent = shown ? ch : "_";
          box.appendChild(span);
        }
        wordEl.appendChild(box);
      });
    }

    function renderUsedLetters() {
      usedLettersEl.innerHTML = "";
      [...used].sort().forEach(letter => {
        const isCorrect = word.includes(letter);
        const colorClass = isCorrect ? "text-green-600" : "text-red-600";
        usedLettersEl.innerHTML += `<span class="used-letter ${colorClass}">${letter}</span>`;
      });
    }

    function renderAll() {
      renderBalloons();
      renderWord();
      renderUsedLetters();
      renderAlphabet();
    }

    // =========================
    // GAME LOGIC
    // =========================

    function startCategory(cat) {
      currentCategory = cat;
      filteredWords = words.filter(w => w.category === cat);
      categoryTitle.textContent = cat;

      if (filteredWords.length === 0) {
        alert("No words in this category yet. Add some using the Word Editor.");
        return;
      }

      categoryScreen.classList.add("hidden");
      gameScreen.classList.remove("hidden");
      newRound();
    }

    function pickRandomWord() {
      const rand = filteredWords[Math.floor(Math.random() * filteredWords.length)];
      return rand.word.toUpperCase();
    }

    function newRound() {
      word = pickRandomWord();
      revealed = Array.from(word, ch => (ch === " " || ch === "-" ? true : false));
      used.clear();
      misses = 0;
      finished = false;
      setStatus("Guess a letter to begin!");
      renderAll();
    }

    function handleGuess(letter) {
      if (finished || used.has(letter)) return;
      let correct = false;

      if (word.includes(letter)) {
        for (let i = 0; i < word.length; i++) {
          if (word[i] === letter) revealed[i] = true;
        }
        correct = true;
      } else {
        const lastBalloon = balloonsEl.lastElementChild;
        if (lastBalloon) lastBalloon.classList.add("popping");
        misses++;
      }
      used.add(letter);

      if (correct) {
        setStatus(`✅ ${letter} is in the word.`, "text-green-700");
      } else {
        setStatus(`💥 Not there. Balloon popped! (${MAX_MISSES - misses} left)`, "text-red-700");
      }

      if (revealed.every(v => v)) {
        finished = true;
        setStatus("🎉 You saved the balloons! Word solved!", "text-green-700");
      } else if (misses >= MAX_MISSES) {
        finished = true;
        setStatus(`💥 All balloons popped! The word was ${word}.`, "text-red-700");
      }

      if (correct) {
        renderAll();
      } else {
        renderWord();
        renderUsedLetters();
        renderAlphabet();
        setTimeout(renderBalloons, 330);
      }
    }

    function revealAnswer() {
      if (!word) return;
      revealed = Array.from(word, () => true);
      finished = true;
      setStatus(`Answer: ${word}`, "text-green-700");
      renderAll();
    }

    function backToCategories() {
      gameScreen.classList.add("hidden");
      categoryScreen.classList.remove("hidden");
      setStatus("");
    }

    // Keyboard guesses
    document.addEventListener("keydown", e => {
      const letter = e.key.toUpperCase();
      if (letter.length === 1 && letter >= "A" && letter <= "Z") {
        handleGuess(letter);
      }
    });

    newWordBtn.onclick = newRound;
    revealBtn.onclick = revealAnswer;
    backBtn.onclick = backToCategories;

    // =========================
    // Init
    renderCategories();
  </script>
</body>
