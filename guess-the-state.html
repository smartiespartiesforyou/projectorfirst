<style>
:root{
  --navy:#17324d;--blue:#3f7898;--blue2:#2f607a;--coral:#d97961;--coral2:#bc5e4b;
  --sage:#6e9d8b;--sage2:#557e70;--cream:#fff8e8;--ivory:#fffdf6;--gold:#d5c49d;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;color:var(--navy);font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 12% 10%,rgba(242,184,75,.26),transparent 24%),
    radial-gradient(circle at 88% 18%,rgba(110,157,139,.22),transparent 26%),
    linear-gradient(145deg,#fff8e8,#f3ede2 52%,#e6f0ed);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;
  background-image:
    linear-gradient(90deg,transparent 49%,rgba(23,50,77,.07) 50%,transparent 51%),
    linear-gradient(transparent 49%,rgba(23,50,77,.05) 50%,transparent 51%);

}
button,a{font:inherit}
.topbar{
  max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:14px;padding:18px;border-bottom:1px solid rgba(23,50,77,.12);flex-wrap:wrap
}
.back-btn,.top-btn{

}

.eyebrow{font-size:.8rem;font-weight:900;letter-spacing:.18em;color:#80694e}
h1{

  color:var(--navy);line-height:1;text-shadow:0 2px 0 #fff

.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 34px;position:relative;text-align:center}
.subtitle{
  margin:0 auto 18px;max-width:820px;color:#5f6c72;
  font-size:clamp(1.05rem,2vw,1.3rem);font-weight:800

.stage{
  min-height:470px;background:linear-gradient(145deg,#fffdf6,#f1e6d0);

}
.panel{width:100%}
.clue-label,.reveal-label{

}
.clue-list{display:grid;gap:14px;max-width:1000px;margin:0 auto}
.clue-line{

  padding:18px 22px;text-align:left;color:#102d46;
  font-family:"Arial Black",Arial,sans-serif;
  font-size:clamp(1.7rem,3.6vw,3rem);line-height:1.2;font-weight:900;
  box-shadow:0 4px 0 rgba(23,50,77,.08)
}
.clue-number{color:var(--coral2);margin-right:.3em}
.answer{
  font-family:"Arial Black",Arial,sans-serif;
  font-size:clamp(4rem,10vw,8rem);line-height:.95;
  letter-spacing:-.04em;color:#102d46;font-weight:900;
  overflow-wrap:anywhere
}
.capital{
  margin-top:22px;font-family:Georgia,serif;
  font-size:clamp(1.8rem,4vw,3.2rem);font-weight:900;color:#5d6a70
}
.controls{
  display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:22px
}
.btn{
  min-width:210px;border:4px solid rgba(255,255,255,.80);border-radius:20px;
  color:#fff;font-size:clamp(1.15rem,2.3vw,1.6rem);font-weight:900;
  padding:15px 20px;cursor:pointer;box-shadow:0 7px 0 rgba(23,50,77,.22)
}
.clue-btn{background:linear-gradient(145deg,var(--blue),var(--blue2));box-shadow:0 7px 0 #244d63}
.reveal-btn{background:linear-gradient(145deg,var(--coral),var(--coral2));box-shadow:0 7px 0 #934738}
.next-btn{background:linear-gradient(145deg,var(--sage),var(--sage2));box-shadow:0 7px 0 #42665b}
.progress{
  display:inline-block;margin-top:16px;background:#fff8e8;border:3px solid #d5c49d;
  border-radius:15px;padding:9px 15px;color:#5f6c72;font-weight:900
}
.helper{margin-top:11px;color:#7a7167;font-size:.95rem;font-weight:700}
.hidden{display:none!important}
@keyframes popIn{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.pop{animation:popIn .28s ease-out both}
@media(max-width:760px){
  .title-block{order:-1;flex-basis:100%}
  .stage{min-height:400px;padding:24px 16px}
  .clue-line{text-align:center}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<body>
<div class="topbar">
  <a href="apps.html" class="back-btn">← Back to Apps</a>
  <div class="title-block">
    <div class="eyebrow">GUESS THE STATE</div>
    <h1>Three Clues. One State.</h1>
  </div>
  <button id="fsBtn" class="top-btn">⛶ Fullscreen</button>
</div>

<main class="wrap">
  <p class="subtitle">The clues get easier as you go. How quickly can the room guess it?</p>

  <section class="stage">
    <div id="cluePanel" class="panel">
      <div id="clueLabel" class="clue-label">CLUE 1</div>
      <div id="clueList" class="clue-list"></div>
    </div>

    <div id="answerPanel" class="panel hidden" aria-live="polite">
      <div class="reveal-label">STATE REVEALED</div>
      <div id="answer" class="answer"></div>
      <div id="capital" class="capital"></div>
    </div>
  </section>

  <div class="controls">
    <button id="clueBtn" class="btn clue-btn">Another Clue</button>
    <button id="revealBtn" class="btn reveal-btn">Reveal State</button>
    <button id="nextBtn" class="btn next-btn hidden">Next State →</button>
  </div>

  <div id="progress" class="progress"></div>
  <div class="helper">Space = Clue → Clue → Reveal → Next • F = Fullscreen</div>
</main>

<script>
"use strict";

const STATES = [
  { name:"ALABAMA", capital:"Montgomery", clues:["The Saturn V moon rocket was built in its 'Rocket City' of Huntsville.","Rosa Parks made history on a city bus in its capital.","It's known as the Heart of Dixie — 'Sweet Home…'"]},
  { name:"ALASKA", capital:"Juneau", clues:["The U.S. bought it from Russia in 1867 — critics called it a 'folly.'","It has the tallest mountain in North America, Denali.","It's the biggest state of all — the Last Frontier."]},
  { name:"ARIZONA", capital:"Phoenix", clues:["The giant saguaro cactus grows almost nowhere else on Earth.","Its capital city is named after a mythical bird that rises from ashes.","It's home to the Grand Canyon."]},
  { name:"ARKANSAS", capital:"Little Rock", clues:["It has the only diamond mine in America where visitors can keep what they find.","President Bill Clinton was born and raised here.","It's called the Natural State, famous for Hot Springs."]},
  { name:"CALIFORNIA", capital:"Sacramento", clues:["The world's tallest trees, the coastal redwoods, grow here.","In 1849, thousands rushed here hoping to strike gold.","It's home to Hollywood and the Golden Gate Bridge."]},
  { name:"COLORADO", capital:"Denver", clues:["The song 'America the Beautiful' was inspired by the view from its Pikes Peak.","Its capital city sits exactly one mile above sea level.","It's the heart of the Rocky Mountains."]},
  { name:"CONNECTICUT", capital:"Hartford", clues:["Mark Twain wrote Tom Sawyer while living in its capital city.","Yale University has called it home since 1701.","It's the Constitution State, just south of Massachusetts."]},
  { name:"DELAWARE", capital:"Dover", clues:["The DuPont company started here making gunpowder in 1802.","It's the second-smallest state in the country.","It's called the First State — first to ratify the Constitution."]},
  { name:"FLORIDA", capital:"Tallahassee", clues:["Spanish explorer Ponce de León landed here in 1513; later legend linked him to the Fountain of Youth.","Alligators roam its famous Everglades.","It's the Sunshine State, home of Disney World."]},
  { name:"GEORGIA", capital:"Atlanta", clues:["Coca-Cola was invented in its capital city in 1886.","'Gone with the Wind' is set here.","It's the Peach State."]},
  { name:"HAWAII", capital:"Honolulu", clues:["Its Kona region is famous around the world for coffee.","Pearl Harbor is located here.","It's our only island state — home of the hula."]},
  { name:"IDAHO", capital:"Boise", clues:["Lewis and Clark crossed its rugged Bitterroot Mountains in 1805.","Evel Knievel tried to jump its Snake River Canyon on a rocket cycle.","It's world-famous for its potatoes."]},
  { name:"ILLINOIS", capital:"Springfield", clues:["Historic Route 66 begins in its biggest city.","Abraham Lincoln practiced law in its capital.","Its biggest city is Chicago, the Windy City."]},
  { name:"INDIANA", capital:"Indianapolis", clues:["Its people have been called 'Hoosiers' for nearly 200 years — and nobody's sure why!","High school basketball is practically a religion here.","Every May, race cars run 500 miles in its capital city."]},
  { name:"IOWA", capital:"Des Moines", clues:["Its caucuses became famous for playing an early role in presidential campaigns.","The movie 'Field of Dreams' was set and filmed here.","It grows more corn than any other state."]},
  { name:"KANSAS", capital:"Topeka", clues:["Cowboys drove cattle to its wild frontier town of Dodge City.","Amelia Earhart was born here.","Dorothy and Toto were from here — 'we're not in ___ anymore!'"]},
  { name:"KENTUCKY", capital:"Frankfort", clues:["Nearly all of the world's bourbon is made here.","Colonel Sanders started frying chicken here.","Every May, it hosts the most famous horse race in America."]},
  { name:"LOUISIANA", capital:"Baton Rouge", clues:["Its counties aren't called counties — they're called parishes.","Jazz music was born in its most famous city.","It's home to Mardi Gras and gumbo."]},
  { name:"MAINE", capital:"Augusta", clues:["It's the easternmost state, and parts of it are among the first in the U.S. to see sunrise.","Author Stephen King lives here and sets many stories here.","It's famous for lobster and lighthouses."]},
  { name:"MARYLAND", capital:"Annapolis", clues:["Francis Scott Key wrote 'The Star-Spangled Banner' watching a battle here.","The U.S. Naval Academy is in its capital.","It's famous for Chesapeake Bay blue crabs."]},
  { name:"MASSACHUSETTS", capital:"Boston", clues:["The Pilgrims established Plymouth Colony here in 1620.","Colonists dumped British tea into its harbor in 1773.","The Red Sox play at its famous Fenway Park."]},
  { name:"MICHIGAN", capital:"Lansing", clues:["It touches four of the five Great Lakes.","Motown music was born in its biggest city.","It's shaped like a mitten and famous for making cars."]},
  { name:"MINNESOTA", capital:"St. Paul", clues:["Legend says the lumberjack giant Paul Bunyan roamed its north woods.","The Mississippi River begins here as a small stream.","It's the Land of 10,000 Lakes."]},
  { name:"MISSISSIPPI", capital:"Jackson", clues:["Elvis Presley was born here in a two-room house in Tupelo.","Teddy Roosevelt's hunting trip here inspired the teddy bear.","It shares its name with America's mightiest river."]},
  { name:"MISSOURI", capital:"Jefferson City", clues:["Mark Twain grew up here along the Mississippi in Hannibal.","The ice cream cone became famous at its 1904 World's Fair.","The Gateway Arch stands in its city of St. Louis."]},
  { name:"MONTANA", capital:"Helena", clues:["Custer made his last stand here at Little Bighorn.","Grizzly bears roam its Glacier National Park.","It's called Big Sky Country."]},
  { name:"NEBRASKA", capital:"Lincoln", clues:["Pioneers on the Oregon Trail steered by its Chimney Rock.","Billionaire Warren Buffett has lived in the same house here since 1958.","Its college football team is the Cornhuskers."]},
  { name:"NEVADA", capital:"Carson City", clues:["A silver strike in 1859 put it on the map.","The Hoover Dam was built here during the Depression.","What happens in its most famous city stays there."]},
  { name:"NEW HAMPSHIRE", capital:"Concord", clues:["Its state motto is 'Live Free or Die.'","Every four years it holds the first presidential primary.","It's the Granite State, in northern New England."]},
  { name:"NEW JERSEY", capital:"Trenton", clues:["The street names in Monopoly come from its Atlantic City.","Frank Sinatra was born in its city of Hoboken.","It's called the Garden State."]},
  { name:"NEW MEXICO", capital:"Santa Fe", clues:["Something mysterious supposedly crashed near its town of Roswell in 1947.","Hundreds of hot air balloons fill its skies every October.","It's the Land of Enchantment."]},
  { name:"NEW YORK", capital:"Albany", clues:["Niagara Falls thunders on its border with Canada.","The Statue of Liberty stands in its harbor.","It's the Empire State — home of Broadway."]},
  { name:"NORTH CAROLINA", capital:"Raleigh", clues:["The Lost Colony of Roanoke vanished from its shores in the 1580s.","The Wright brothers made the first airplane flight here.","It's the Tar Heel State."]},
  { name:"NORTH DAKOTA", capital:"Bismarck", clues:["Teddy Roosevelt ranched here as a young man and loved it forever.","Its capital is named after a German leader.","It sits above South Dakota, on the Canadian border."]},
  { name:"OHIO", capital:"Columbus", clues:["Both Neil Armstrong and John Glenn were born here.","Seven presidents were born here — more than almost any state.","It's the Buckeye State, home of the Rock and Roll Hall of Fame."]},
  { name:"OKLAHOMA", capital:"Oklahoma City", clues:["In 1889, settlers raced to claim free land here — some snuck in 'sooner.'","Cowboy humorist Will Rogers was its favorite son.","A famous musical says the wind comes sweepin' down its plain."]},
  { name:"OREGON", capital:"Salem", clues:["Crater Lake, the deepest lake in America, fills one of its old volcanoes.","Pioneers walked 2,000 miles on a famous trail to get here.","It's the Beaver State, home to Portland's rose gardens."]},
  { name:"PENNSYLVANIA", capital:"Harrisburg", clues:["A groundhog named Phil predicts the weather here every February.","Hershey built his chocolate empire here.","The Liberty Bell rings — well, sits — in its biggest city."]},
  { name:"RHODE ISLAND", capital:"Providence", clues:["Roger Williams founded it seeking religious freedom in 1636.","The Gilded Age rich built summer 'cottages' — really mansions — in its Newport.","It's the smallest state in the country."]},
  { name:"SOUTH CAROLINA", capital:"Columbia", clues:["The first shots of the Civil War were fired at its Fort Sumter.","Its historic city of Charleston is famous for charm and cobblestones.","A palmetto tree stands on its state flag."]},
  { name:"SOUTH DAKOTA", capital:"Pierre", clues:["Wild Bill Hickok was playing poker in its town of Deadwood when his luck ran out.","Its Badlands look like the surface of the moon.","Four presidents' faces are carved into its Mount Rushmore."]},
  { name:"TENNESSEE", capital:"Nashville", clues:["The Great Smoky Mountains rise along its eastern border.","Elvis called its Graceland mansion home.","Country music's Grand Ole Opry plays in its capital."]},
  { name:"TEXAS", capital:"Austin", clues:["It was its own independent country for nine years.","'Remember the Alamo!' was shouted here.","Everything's bigger in the Lone Star State."]},
  { name:"UTAH", capital:"Salt Lake City", clues:["The golden spike joining the transcontinental railroad was driven here in 1869.","Mormon pioneers pulled handcarts a thousand miles to settle here.","Its capital is named for a giant salty lake."]},
  { name:"VERMONT", capital:"Montpelier", clues:["Ben & Jerry started their ice cream empire in an old gas station here.","It makes more maple syrup than any other state.","It's the Green Mountain State."]},
  { name:"VIRGINIA", capital:"Richmond", clues:["Jamestown, the first permanent English colony, was founded here in 1607.","Eight presidents were born here — the most of any state.","Its slogan says it's 'for lovers.'"]},
  { name:"WASHINGTON", capital:"Olympia", clues:["It grows more apples than any other state.","The Space Needle rises over its biggest city.","It's the Evergreen State — the only one named for a president."]},
  { name:"WEST VIRGINIA", capital:"Charleston", clues:["It split away from its neighbor during the Civil War.","Coal mining shaped its history and its people.","John Denver sang 'Country Roads' about it — 'almost heaven.'"]},
  { name:"WISCONSIN", capital:"Madison", clues:["Harley-Davidson motorcycles have been built here since 1903.","Its football fans proudly wear foam cheese on their heads.","It's America's Dairyland, home of the Green Bay Packers."]},
  { name:"WYOMING", capital:"Cheyenne", clues:["In 1869, its territory became the first to grant women equal voting rights.","Old Faithful erupts here in the world's first national park.","It has the fewest people of any state — pure cowboy country."]}
];

let deck=[];
let idx=0;
let clueCount=1;
let revealed=false;

const $=id=>document.getElementById(id);

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function renderClues(){
  const s=deck[idx];
  $("clueList").innerHTML="";
  for(let i=0;i<clueCount;i++){
    const div=document.createElement("div");
    div.className="clue-line"+(i===clueCount-1?" pop":"");
    div.innerHTML='<span class="clue-number">'+(i+1)+'.</span> '+s.clues[i];
    $("clueList").appendChild(div);
  }
  $("clueLabel").textContent=clueCount<3?"CLUE "+clueCount:"FINAL CLUE";
  $("clueBtn").classList.toggle("hidden",clueCount>=3);
}

function loadState(){
  clueCount=1;
  revealed=false;
  $("cluePanel").classList.remove("hidden");
  $("answerPanel").classList.add("hidden");
  $("revealBtn").classList.remove("hidden");
  $("nextBtn").classList.add("hidden");
  renderClues();
  $("progress").textContent="State "+(idx+1)+" of "+deck.length;
}

function nextClue(){
  if(revealed)return;
  if(clueCount<3){
    clueCount++;
    renderClues();
  }
}

function revealState(){
  if(revealed)return;
  const s=deck[idx];
  revealed=true;
  $("answer").textContent=s.name;
  $("capital").textContent="Capital: "+s.capital;
  $("cluePanel").classList.add("hidden");
  $("answerPanel").classList.remove("hidden");
  $("answerPanel").classList.remove("pop");
  void $("answerPanel").offsetWidth;
  $("answerPanel").classList.add("pop");
  $("clueBtn").classList.add("hidden");
  $("revealBtn").classList.add("hidden");
  $("nextBtn").classList.remove("hidden");
}

function nextState(){
  idx++;
  if(idx>=deck.length){
    deck=shuffle(STATES);
    idx=0;
  }
  loadState();
}

function toggleFullScreen(){
  if(!document.fullscreenElement)document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

$("clueBtn").addEventListener("click",nextClue);
$("revealBtn").addEventListener("click",revealState);
$("nextBtn").addEventListener("click",nextState);
$("fsBtn").addEventListener("click",toggleFullScreen);

document.addEventListener("keydown",e=>{
  if(e.code==="KeyF"){toggleFullScreen();return}
  if(e.code!=="Space")return;
  if(e.target.tagName==="BUTTON"||e.target.tagName==="A")return;
  e.preventDefault();
  if(revealed)nextState();
  else if(clueCount<3)nextClue();
  else revealState();
});

deck=shuffle(STATES);
loadState();
</script>
</body>
</html>
