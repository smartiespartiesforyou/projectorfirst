<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Guess the Price — ProjectorFirst</title>
<script data-memberstack-app="app_cmgnwpg8y00x10suih4pua785" src="https://static.memberstack.com/scripts/v2/memberstack.js" type="text/javascript"></script>
<script src="/guard.js"></script>
<style>
:root{--navy:#17324d;--blue:#3f7898;--blue2:#2f607a;--coral:#d97961;--coral2:#bc5e4b;--sage:#6e9d8b;--sage2:#557e70;--cream:#fff8e8;--ivory:#fffdf6;--gold:#d5c49d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;color:var(--navy);font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 12% 10%,rgba(242,184,75,.30),transparent 24%),
    radial-gradient(circle at 88% 18%,rgba(110,157,139,.25),transparent 26%),
    linear-gradient(145deg,#fff8e8,#f3ede2 52%,#e6f0ed);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;
  background-image:
    linear-gradient(90deg,transparent 49%,rgba(23,50,77,.08) 50%,transparent 51%),
    linear-gradient(transparent 49%,rgba(23,50,77,.06) 50%,transparent 51%);
  background-size:48px 48px
}
.hidden{display:none!important}
.topbar{
  max-width:1150px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;
  gap:12px;padding:22px 18px;border-bottom:1px solid rgba(23,50,77,.12);flex-wrap:wrap
}
.brand{font-weight:900;letter-spacing:.18em;color:#80694e}
.btn{
  border:0;border-radius:16px;font-weight:900;cursor:pointer;box-shadow:0 6px 0 rgba(23,50,77,.24);
  padding:12px 18px;font-size:clamp(1rem,1.8vw,1.2rem);text-decoration:none;display:inline-flex;
  align-items:center;justify-content:center;transition:transform .08s ease
}
.btn:active,.category-btn:active,.choice:active{transform:translateY(3px)}
.btn-blue{background:#1e3a8a;color:#fff}.btn-gray{background:#687582;color:#fff}
.screen{max-width:1150px;margin:0 auto;padding:34px 18px 40px;text-align:center;position:relative}
.screen-title{
  font-family:Georgia,serif;font-size:clamp(2.8rem,7vw,5.4rem);font-weight:900;
  color:var(--navy);text-shadow:0 3px 0 white;margin:5px 0 10px
}
.eyebrow{font-weight:900;letter-spacing:.18em;color:#80694e;margin-top:4px}
.sub{font-size:clamp(1.1rem,2.3vw,1.45rem);font-weight:800;color:#5e6a75;margin:0 auto 26px;max-width:900px}
.category-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:900px;margin:30px auto 0
}
.category-btn{
  min-height:112px;border:4px solid rgba(255,255,255,.78);border-radius:26px;color:#fff;
  font-size:clamp(1.35rem,3vw,2rem);font-weight:900;cursor:pointer;padding:18px;
  box-shadow:0 9px 0 #244d63,0 14px 28px rgba(23,50,77,.18);
  background:linear-gradient(145deg,var(--blue),var(--blue2))
}
.category-btn:nth-child(3n+2){
  background:linear-gradient(145deg,var(--coral),var(--coral2));
  box-shadow:0 9px 0 #934738,0 14px 28px rgba(23,50,77,.18)
}
.category-btn:nth-child(3n){
  background:linear-gradient(145deg,var(--sage),var(--sage2));
  box-shadow:0 9px 0 #42675a,0 14px 28px rgba(23,50,77,.18)
}
.category-btn.mix{grid-column:1/-1}
.category-btn span{display:block;font-size:.98rem;margin-top:7px;font-weight:800;opacity:.92}
.game-shell{
  background:rgba(255,253,246,.9);border:3px solid rgba(23,50,77,.12);
  border-radius:34px;padding:22px;box-shadow:0 20px 50px rgba(23,50,77,.15)
}
.game-head{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px
}
.game-category{
  font-family:Georgia,serif;font-size:clamp(1.7rem,3.4vw,2.8rem);font-weight:900;color:var(--navy)
}
.game-grid{
  display:grid;grid-template-columns:minmax(390px,1.2fr) minmax(300px,.8fr);
  gap:24px;align-items:center
}
.photo-card{
  background:linear-gradient(145deg,#fffdf6,#efe3c7);border:4px solid #d5c49d;
  border-radius:26px;box-shadow:0 8px 0 #b99d69,0 12px 18px rgba(23,50,77,.15);
  padding:18px
}
.photo-wrap{
  background:#fff;border-radius:18px;overflow:hidden;min-height:360px;display:flex;
  align-items:center;justify-content:center;border:3px solid rgba(23,50,77,.08)
}
.photo-wrap img{width:100%;height:420px;object-fit:contain;display:block;background:#fff}
.item-name{
  font-family:Georgia,serif;font-size:clamp(1.8rem,3.8vw,3rem);font-weight:900;
  margin:18px 0 2px;color:var(--navy)
}
.side{display:flex;flex-direction:column;gap:16px}
.question-card{
  background:linear-gradient(145deg,#fffdf6,#efe3c7);border:4px solid #d5c49d;
  border-radius:24px;box-shadow:0 8px 0 #b99d69;padding:24px 18px
}
.prompt{font-size:clamp(1.1rem,2.4vw,1.45rem);font-weight:900;color:#5e6a75}
.fake-price{
  font-family:Georgia,serif;font-size:clamp(3.2rem,7vw,5.7rem);font-weight:900;
  color:var(--navy);margin:5px 0 8px
}
.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choice{
  min-height:90px;border:4px solid rgba(255,255,255,.78);border-radius:22px;color:#fff;
  font-size:clamp(1.5rem,3vw,2.1rem);font-weight:900;cursor:pointer
}
.choice.higher{background:linear-gradient(145deg,var(--sage),var(--sage2));box-shadow:0 8px 0 #42675a}
.choice.lower{background:linear-gradient(145deg,var(--coral),var(--coral2));box-shadow:0 8px 0 #934738}
.answer-box{
  border-radius:22px;padding:18px 20px;font-weight:900;background:#e9f4e8;
  border:4px solid #7aa17a;box-shadow:0 7px 0 #648c64;color:#245b3b
}
.answer-main{font-family:Georgia,serif;font-size:clamp(2rem,4.5vw,3.8rem)}
.answer-note{font-size:clamp(1.05rem,2.2vw,1.3rem);margin-top:6px}
.status{
  background:#fff8e8;border-radius:16px;padding:10px 18px;font-size:1.05rem;
  font-weight:800;color:#5e6a75
}
.next{
  background:#1e3a8a;color:#fff;min-height:62px;border:0;border-radius:16px;
  box-shadow:0 6px 0 rgba(23,50,77,.25);font-size:1.25rem;font-weight:900;cursor:pointer
}
.note{font-size:.95rem;color:#7a7167;font-weight:700;margin-top:18px}
.done-card{
  max-width:760px;margin:40px auto 0;background:rgba(255,253,246,.92);
  border:4px solid white;border-radius:34px;padding:42px 28px;box-shadow:0 20px 50px rgba(23,50,77,.15)
}
@media(max-width:850px){
  .game-grid{grid-template-columns:1fr}.photo-wrap img{height:330px}.photo-wrap{min-height:280px}
}
@media(max-width:650px){
  .category-grid{grid-template-columns:1fr}.category-btn.mix{grid-column:auto}
}
</style>
</head>
<body>
<div class="topbar">
  <a href="apps.html" class="btn btn-blue">← Back to Apps</a>
  <div class="brand">PROJECTOR FIRST</div>
  <button id="fullscreenBtn" class="btn btn-blue">⛶ Fullscreen</button>
</div>

<section id="categoryScreen" class="screen">
  <div class="eyebrow">GUESS THE PRICE</div>
  <h1 class="screen-title">Choose a Category</h1>
  <p class="sub">10 items per round • 40 items built in • a new order every game</p>
  <div id="categoryButtons" class="category-grid"></div>
  <p class="note">Game prices are approximate everyday prices and may vary by store or location.</p>
</section>

<section id="gameScreen" class="screen hidden">
  <div class="game-shell">
    <div class="game-head">
      <button id="categoriesBtn" class="btn btn-gray">← Categories</button>
      <div id="gameCategory" class="game-category"></div>
      <button id="newRoundBtn" class="btn btn-blue">New Round</button>
    </div>

    <div class="game-grid">
      <div class="photo-card">
        <div class="photo-wrap"><img id="itemImage" alt=""></div>
        <div id="itemName" class="item-name"></div>
      </div>

      <div class="side">
        <div class="question-card">
          <div class="prompt">Is the item's price HIGHER or LOWER than...</div>
          <div id="fakePrice" class="fake-price"></div>
          <div id="choiceRow" class="choice-row">
            <button id="higherBtn" class="choice higher">↑ HIGHER</button>
            <button id="lowerBtn" class="choice lower">↓ LOWER</button>
          </div>
          <div id="answerBox" class="answer-box hidden">
            <div id="answerMain" class="answer-main"></div>
            <div id="answerNote" class="answer-note"></div>
          </div>
        </div>

        <div id="status" class="status"></div>
        <button id="nextBtn" class="next hidden">Next Item →</button>
      </div>
    </div>
  </div>
</section>

<section id="doneScreen" class="screen hidden">
  <div class="done-card">
    <div style="font-size:6rem">👏🛒</div>
    <div class="eyebrow">GUESS THE PRICE</div>
    <h1 class="screen-title" style="font-size:clamp(2.5rem,6vw,4.6rem)">Round Complete!</h1>
    <p id="doneText" class="sub"></p>
    <div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center">
      <button id="againBtn" class="btn btn-blue">Play Another 10</button>
      <button id="chooseBtn" class="btn btn-gray">Choose Category</button>
    </div>
  </div>
</section>

<script>
let items=[],deck=[],pos=0,currentItem=null,comparisonPrice=0,answered=false,currentCategory="Mix Everything";
const CATEGORY_ORDER=["Grocery Store","Snacks & Treats","Personal Care","Household Items","Mix Everything"];
const CATEGORY_LABELS={
  "Grocery Store":"Grocery Store 🛒",
  "Snacks & Treats":"Snacks & Treats 🍪",
  "Personal Care":"Personal Care 🧴",
  "Household Items":"Household Items 🏠",
  "Mix Everything":"Mix Everything ✨"
};

function shuffle(a){
  a=a.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
async function loadItems(){
  const response=await fetch("/price-items/items.json");
  if(!response.ok) throw new Error("Could not load price items");
  items=await response.json();
}
function show(screen){
  document.getElementById("categoryScreen").classList.toggle("hidden",screen!=="categories");
  document.getElementById("gameScreen").classList.toggle("hidden",screen!=="game");
  document.getElementById("doneScreen").classList.toggle("hidden",screen!=="done");
}
function makeComparison(real){
  const direction=Math.random()<.5?-1:1;
  const change=Math.max(.35,real*(.18+Math.random()*.22));
  let value=Math.max(.49,real+(direction*change));
  value=Math.round(value*100)/100;
  if(Math.abs(value-real)<.15)value=Math.round((real+(direction*.5))*100)/100;
  return value;
}
function startGame(category){
  currentCategory=category||currentCategory;
  const pool=currentCategory==="Mix Everything"
    ?items
    :items.filter(x=>x.category===currentCategory);
  deck=shuffle(pool).slice(0,10);
  pos=0;
  document.getElementById("gameCategory").textContent=CATEGORY_LABELS[currentCategory]||currentCategory;
  show("game");
  renderItem();
}
function renderItem(){
  currentItem=deck[pos];
  answered=false;
  comparisonPrice=makeComparison(Number(currentItem.price));
  const img=document.getElementById("itemImage");
  img.src=currentItem.image;
  img.alt=currentItem.name;
  document.getElementById("itemName").textContent=currentItem.name;
  document.getElementById("fakePrice").textContent="$"+comparisonPrice.toFixed(2);
  document.getElementById("choiceRow").classList.remove("hidden");
  document.getElementById("answerBox").classList.add("hidden");
  document.getElementById("nextBtn").classList.add("hidden");
  document.getElementById("status").textContent=
    "Item "+(pos+1)+" of "+deck.length+" • "+currentCategory+" • Let the group decide together.";
}
function guess(choice){
  if(answered)return;
  answered=true;
  const real=Number(currentItem.price);
  const correct=real>comparisonPrice?"higher":"lower";
  document.getElementById("choiceRow").classList.add("hidden");
  document.getElementById("answerMain").textContent="$"+real.toFixed(2);
  document.getElementById("answerNote").textContent=
    choice===correct
      ?"Correct — the price is "+correct+"."
      :"The price is "+correct+" than the amount shown.";
  document.getElementById("answerBox").classList.remove("hidden");
  document.getElementById("nextBtn").classList.remove("hidden");
}
function next(){
  pos++;
  if(pos>=deck.length){
    document.getElementById("doneText").textContent="You finished 10 items from "+currentCategory+".";
    show("done");
    return;
  }
  renderItem();
}
function full(){
  if(document.fullscreenElement)document.exitFullscreen();
  else document.documentElement.requestFullscreen();
}
function renderCategories(){
  const wrap=document.getElementById("categoryButtons");
  wrap.innerHTML="";
  CATEGORY_ORDER.forEach(cat=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="category-btn"+(cat==="Mix Everything"?" mix":"");
    const count=cat==="Mix Everything"?items.length:items.filter(x=>x.category===cat).length;
    b.innerHTML=(CATEGORY_LABELS[cat]||cat)+"<span>"+count+" items</span>";
    b.addEventListener("click",()=>startGame(cat));
    wrap.appendChild(b);
  });
}

document.getElementById("higherBtn").addEventListener("click",()=>guess("higher"));
document.getElementById("lowerBtn").addEventListener("click",()=>guess("lower"));
document.getElementById("nextBtn").addEventListener("click",next);
document.getElementById("againBtn").addEventListener("click",()=>startGame(currentCategory));
document.getElementById("chooseBtn").addEventListener("click",()=>show("categories"));
document.getElementById("categoriesBtn").addEventListener("click",()=>show("categories"));
document.getElementById("newRoundBtn").addEventListener("click",()=>startGame(currentCategory));
document.getElementById("fullscreenBtn").addEventListener("click",full);

loadItems().then(renderCategories).catch(()=>{
  document.getElementById("categoryButtons").innerHTML="<p class='sub'>The item bank could not be loaded. Please refresh the page.</p>";
});
</script>
</body>
</html>
