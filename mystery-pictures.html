<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mystery Pictures — Projector First</title>
<script data-memberstack-app="app_cmgnwpg8y00x10suih4pua785" src="https://static.memberstack.com/scripts/v2/memberstack.js"></script>
<script src="/guard.js"></script>
<style>
:root{--red:#b92d31;--red2:#8c1d22;--navy:#07375f;--gold:#f4bd35;--cream:#fff4d8;--teal:#138fa7;--ink:#08345a;--brown:#75431d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:linear-gradient(135deg,#7d281c,#d77b31 45%,#9c3420);color:var(--ink)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 12%,#ffd66b44,transparent 22%),radial-gradient(circle at 88% 74%,#ffd66b33,transparent 26%)}
.screen{min-height:100vh;display:flex;flex-direction:column;position:relative}.hidden{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 16px;background:#74231e;color:#fff;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.08em}
.btn{border:3px solid #8d5b20;border-radius:14px;box-shadow:0 5px 0 #623c16;padding:10px 15px;font-size:clamp(1rem,2vw,1.2rem);font-weight:900;cursor:pointer;background:var(--cream);color:var(--ink);touch-action:manipulation}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #623c16}.btn-red{background:#e33e43;color:white}.btn-gold{background:#ffc83e}.btn-teal{background:var(--teal);color:white}
.start{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.marquee{font-family:Georgia,serif;font-size:clamp(2.55rem,7vw,5.25rem);color:#fff0bc;background:linear-gradient(#ca3437,var(--red2));border:6px solid var(--gold);border-radius:30px;padding:.12em .55em;box-shadow:0 0 0 5px #fff0bc,0 9px 0 #612119;text-shadow:0 4px 0 #68231b;margin:.2em}.sub{background:var(--cream);border:4px solid #dea429;border-radius:17px;padding:11px 22px;font-size:clamp(1.05rem,2.4vw,1.5rem);font-weight:900;max-width:940px}.sets{display:grid;grid-template-columns:repeat(3,minmax(210px,1fr));gap:14px;width:min(940px,95vw);margin-top:22px}.set{border:4px solid #f6d16d;border-radius:18px;box-shadow:0 6px 0 var(--brown);padding:22px 14px;font-size:clamp(1.15rem,2.6vw,1.65rem);font-weight:900;cursor:pointer;color:var(--navy)}.set:nth-child(1){background:#ef655e}.set:nth-child(2){background:#f7c33c}.set:nth-child(3){background:#55c3cb}
.game{flex:1;display:grid;grid-template-columns:minmax(450px,760px) minmax(290px,410px);gap:18px;align-items:center;justify-content:center;padding:15px 20px 25px}.panel{background:var(--cream);border:6px solid #e4a82d;border-radius:24px;box-shadow:0 8px 0 #6e3a1a;padding:12px}.picture{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;border:5px solid #092f52;background:#111}.picture img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.cover{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);gap:3px;padding:3px}.tile{border:2px solid #efbd35;border-radius:5px;background:linear-gradient(145deg,#0b487b,#062c51);color:#fff1ca;font-family:Georgia,serif;font-size:clamp(1.2rem,4vw,2.35rem);font-weight:900;cursor:pointer;transition:.28s}.tile.gone{opacity:0;transform:scale(.75);pointer-events:none}.side{display:flex;flex-direction:column;gap:11px}.progress{text-align:center;font-size:clamp(1.1rem,2.4vw,1.5rem);font-weight:900}.hint{background:#ffd052;border:3px solid #df9f1f;border-radius:14px;padding:12px;text-align:center;font-size:clamp(1rem,2.2vw,1.28rem);font-weight:900}.answer{background:var(--teal);color:white;border-radius:14px;padding:14px;text-align:center;font-family:Georgia,serif;font-size:clamp(1.55rem,4vw,2.4rem);font-weight:900}.note{text-align:center;font-weight:800;line-height:1.35}.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
@media(max-width:900px){.game{grid-template-columns:1fr}.sets{grid-template-columns:1fr}.side{width:min(760px,100%);margin:auto}}
</style>
</head>
<body>
<div id="start" class="screen">
<header class="top"><a class="btn" href="apps.html">← Apps</a><div class="brand">PROJECTOR FIRST</div><button id="fs1" class="btn">⛶ Fullscreen</button></header>
<main class="start">
<div class="marquee">MYSTERY PICTURES</div>
<div class="sub">Take a look, take a guess! Reveal the picture one square at a time.<br><small>Real Projector First picture scenes • no giant giveaway symbols</small></div>
<div id="sets" class="sets"></div>
</main></div>
<div id="play" class="screen hidden">
<header class="top"><button id="back" class="btn">← Picture Sets</button><div class="brand">MYSTERY PICTURES</div><button id="fs2" class="btn">⛶ Fullscreen</button></header>
<main class="game">
<section class="panel"><div class="picture"><img id="photo" alt=""><div id="cover" class="cover"></div></div></section>
<aside class="panel side">
<div id="progress" class="progress"></div>
<button id="random" class="btn btn-red">🔎 Reveal a Square</button>
<button id="hintBtn" class="btn btn-gold">💡 Hint</button>
<button id="answerBtn" class="btn btn-teal">👁 Show Answer</button>
<div id="hint" class="hint hidden"></div>
<div id="answer" class="answer hidden"></div>
<button id="nextBtn" class="btn">Next Picture ➜</button>
<div class="note">The picture begins completely covered. Tap any numbered square—or reveal them one at a time.</div>
</aside>
</main></div>
<div id="done" class="screen hidden"><main class="done"><div class="marquee">MYSTERIES SOLVED!</div><div class="sub" id="doneText"></div><p><button id="again" class="btn btn-gold">Play Again</button> <button id="choose" class="btn">Choose Another Set</button></p></main></div>
<script>
const pictures=[
{group:"At Home",name:"1950s Kitchen",src:"1950-kitchen-i-spy.jpg",hint:"Meals, coffee, dishes, and family routines happened in this room."},
{group:"At Home",name:"1950s Living Room",src:"1950-living-room-i-spy.png",hint:"Families gathered here to visit, listen, relax, and watch television."},
{group:"Around Town",name:"1950s Beauty Shop",src:"1950-beauty-shop-i-spy.png",hint:"People came here for a shampoo, set, trim, and style."},
{group:"Around Town",name:"1950s General Store",src:"1950-general-store-i-spy.png",hint:"You could buy a little bit of almost everything in a place like this."},
{group:"Around Town",name:"1950s Train Station",src:"1950-train-station-i-spy.png",hint:"Tickets, luggage, arrivals, and departures were all part of this place."},
{group:"School Days",name:"1950s Classroom",src:"1950-classroom-i-spy.png",hint:"Desks, lessons, chalkboards, and schoolwork filled this room."}
];
const setDefs=[
{name:"🏡 At Home",filter:p=>p.group==="At Home"},
{name:"🏙 Around Town",filter:p=>p.group==="Around Town"},
{name:"🎞 Mix Everything",filter:p=>true}
];
let deck=[],pos=0,currentSet="";
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){["start","play","done"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id))}
function startGame(def){currentSet=def.name;deck=shuffle(pictures.filter(def.filter));pos=0;show("play");render()}
function render(){const p=deck[pos];const img=document.getElementById("photo");img.src=p.src;img.alt=p.name;document.getElementById("progress").textContent="Picture "+(pos+1)+" of "+deck.length+" • "+currentSet.replace(/^[^ ]+ /,"");document.getElementById("hint").classList.add("hidden");document.getElementById("answer").classList.add("hidden");const c=document.getElementById("cover");c.innerHTML="";for(let i=0;i<20;i++){const b=document.createElement("button");b.className="tile";b.type="button";b.textContent=i+1;b.setAttribute("aria-label","Reveal square "+(i+1));b.addEventListener("click",()=>b.classList.add("gone"));c.appendChild(b)}}
function revealRandom(){const left=[...document.querySelectorAll(".tile:not(.gone)")];if(left.length)left[Math.floor(Math.random()*left.length)].classList.add("gone")}
function showHint(){const e=document.getElementById("hint");e.textContent="💡 "+deck[pos].hint;e.classList.remove("hidden")}
function showAnswer(){document.querySelectorAll(".tile").forEach(x=>x.classList.add("gone"));const e=document.getElementById("answer");e.textContent=deck[pos].name;e.classList.remove("hidden")}
function next(){pos++;if(pos>=deck.length){document.getElementById("doneText").textContent="You finished "+deck.length+" real picture mysteries.";show("done")}else render()}
function full(){if(document.fullscreenElement){document.exitFullscreen()}else{document.documentElement.requestFullscreen()}}
setDefs.forEach(def=>{const b=document.createElement("button");b.className="set";b.type="button";b.innerHTML=def.name+"<br><small>"+pictures.filter(def.filter).length+" pictures</small>";b.addEventListener("click",()=>startGame(def));document.getElementById("sets").appendChild(b)});
document.getElementById("random").addEventListener("click",revealRandom);
document.getElementById("hintBtn").addEventListener("click",showHint);
document.getElementById("answerBtn").addEventListener("click",showAnswer);
document.getElementById("nextBtn").addEventListener("click",next);
document.getElementById("back").addEventListener("click",()=>show("start"));
document.getElementById("choose").addEventListener("click",()=>show("start"));
document.getElementById("again").addEventListener("click",()=>{const def=setDefs.find(x=>x.name===currentSet)||setDefs[2];startGame(def)});
document.getElementById("fs1").addEventListener("click",full);
document.getElementById("fs2").addEventListener("click",full);
</script>
</body></html>
