<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>I Spy: 1950s Train Station — ProjectorFirst</title>

  <!-- Membership gate -->
  <script
    data-memberstack-app="app_cmgnwpg8y00x10suih4pua785"
    src="https://static.memberstack.com/scripts/v2/memberstack.js"
    type="text/javascript">
  </script>
  <script src="/guard.js"></script>

  <meta name="description" content="A large-screen 1950s train station I Spy game with hints and reveals for senior groups." />
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: #f4f7fb;
      color: #172554;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, a { font: inherit; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .75rem 1rem;
      background: #fff;
      border-bottom: 3px solid #1e3a8a;
    }
    .back {
      color: #fff;
      background: #1e3a8a;
      text-decoration: none;
      font-weight: 800;
      padding: .65rem 1rem;
      border-radius: .8rem;
      white-space: nowrap;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 3vw, 2.25rem);
      text-align: center;
    }
    .progress {
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: 800;
      white-space: nowrap;
    }
    main { padding: .8rem 1rem 1.2rem; }
    .prompt {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 3.5rem;
      margin: 0 auto .75rem;
      padding: .5rem 1rem;
      color: #fff;
      background: #1e3a8a;
      border-radius: 1rem;
      font-size: clamp(1.65rem, 4vw, 3.4rem);
      font-weight: 900;
      text-align: center;
    }
    .poster-frame {
      position: relative;
      width: min(100%, 1500px);
      margin: 0 auto;
      border: 5px solid #1e3a8a;
      border-radius: 1rem;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 8px 28px rgb(15 23 42 / .22);
    }
    .poster-frame img {
      display: block;
      width: 100%;
      height: auto;
    }
    .reveal-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 7%;
      aspect-ratio: 1;
      border: clamp(5px, .65vw, 11px) solid #ffea00;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 5px #dc2626, 0 0 28px 12px rgb(255 234 0 / .85);
      pointer-events: none;
      display: none;
      animation: pulse 1s ease-in-out infinite alternate;
    }
    .reveal-ring.show { display: block; }
    @keyframes pulse {
      from { scale: .92; }
      to { scale: 1.12; }
    }
    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: .75rem;
      margin-top: .8rem;
    }
    .btn {
      border: 0;
      border-radius: 1rem;
      color: #fff;
      cursor: pointer;
      font-size: clamp(1.15rem, 2.5vw, 1.65rem);
      font-weight: 900;
      padding: .85rem 1.5rem;
      min-width: 165px;
    }
    .btn:focus-visible, .back:focus-visible { outline: 5px solid #facc15; outline-offset: 3px; }
    .hint { background: #7c3aed; }
    .reveal { background: #dc2626; }
    .next { background: #15803d; }
    .fullscreen { background: #334155; }
    dialog {
      width: min(92vw, 900px);
      border: 5px solid #7c3aed;
      border-radius: 1.25rem;
      padding: 1rem;
      color: #172554;
      box-shadow: 0 20px 70px rgb(0 0 0 / .45);
    }
    dialog::backdrop { background: rgb(15 23 42 / .8); }
    dialog h2 {
      margin: 0 0 .7rem;
      font-size: clamp(1.5rem, 4vw, 2.6rem);
      text-align: center;
    }
    .hint-crop {
      width: 100%;
      aspect-ratio: 16 / 8;
      border-radius: .85rem;
      border: 4px solid #1e3a8a;
      background-image: url("1950-train-station-i-spy.png");
      background-repeat: no-repeat;
      background-size: 230%;
    }
    .dialog-actions { display: flex; justify-content: center; margin-top: .75rem; }
    .close { background: #1e3a8a; }
    .finished {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: rgb(30 58 138 / .94);
      color: #fff;
      font-size: clamp(2.4rem, 7vw, 6rem);
      font-weight: 900;
      text-align: center;
    }
    .finished.show { display: flex; }
    @media (max-width: 700px) {
      .topbar { flex-wrap: wrap; justify-content: center; }
      main { padding-inline: .4rem; }
      .poster-frame { border-width: 3px; }
      .btn { min-width: 135px; padding-inline: 1rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal-ring { animation: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="back" href="i-spy.html">← I Spy Games</a>
    <h1>I Spy: 1950s Train Station</h1>
    <div class="progress" aria-live="polite"><span id="currentNumber">1</span> of <span id="totalNumber">10</span></div>
  </header>

  <main>
    <div id="prompt" class="prompt" aria-live="polite">Can you find the red scarf?</div>

    <div class="poster-frame" id="posterFrame">
      <img src="1950-train-station-i-spy.png" alt="A nostalgic 1950s train station containing ten search objects" />
      <div id="revealRing" class="reveal-ring" aria-hidden="true"></div>
      <div id="finished" class="finished">Wonderful work!<br />You found all 10!</div>
    </div>

    <div class="controls">
      <button class="btn hint" id="hintBtn" type="button">🔍 Hint</button>
      <button class="btn reveal" id="revealBtn" type="button">⭕ Reveal</button>
      <button class="btn next" id="nextBtn" type="button">Next Object →</button>
      <button class="btn fullscreen" id="fullscreenBtn" type="button">Fullscreen</button>
    </div>
  </main>

  <dialog id="hintDialog">
    <h2 id="hintTitle">Look in this part of the train station</h2>
    <div id="hintCrop" class="hint-crop" role="img" aria-label="A closer view of the correct area"></div>
    <div class="dialog-actions">
      <button class="btn close" id="closeHintBtn" type="button">Back to Picture</button>
    </div>
  </dialog>

  <script>
    const objects = [
      { name: "red scarf", x: 9.0, y: 19.2, size: 6.0 },
      { name: "blue suitcase", x: 10.8, y: 34.0, size: 8.0 },
      { name: "yellow umbrella", x: 75.5, y: 48.0, size: 5.0 },
      { name: "green thermos", x: 5.9, y: 71.8, size: 5.0 },
      { name: "silver pocket watch", x: 36.1, y: 38.2, size: 4.5 },
      { name: "small red toy train", x: 62.7, y: 37.7, size: 5.0 },
      { name: "pair of white gloves", x: 17.2, y: 83.5, size: 6.0 },
      { name: "orange hardcover book", x: 48.4, y: 63.5, size: 6.0 },
      { name: "brass key", x: 92.2, y: 74.8, size: 5.0 },
      { name: "black cat-eye glasses", x: 94.2, y: 89.8, size: 6.0 }
    ];

    let index = 0;
    const prompt = document.getElementById("prompt");
    const currentNumber = document.getElementById("currentNumber");
    const totalNumber = document.getElementById("totalNumber");
    const revealRing = document.getElementById("revealRing");
    const hintDialog = document.getElementById("hintDialog");
    const hintCrop = document.getElementById("hintCrop");
    const hintTitle = document.getElementById("hintTitle");
    const finished = document.getElementById("finished");

    totalNumber.textContent = objects.length;

    function currentObject() { return objects[index]; }

    function updateRound() {
      const item = currentObject();
      prompt.textContent = `Can you find the ${item.name}?`;
      currentNumber.textContent = index + 1;
      revealRing.classList.remove("show");
      finished.classList.remove("show");
    }

    function showHint() {
      const item = currentObject();
      hintTitle.textContent = `Look in this area for the ${item.name}`;
      hintCrop.style.backgroundPosition = `${item.x}% ${item.y}%`;
      hintDialog.showModal();
    }

    function revealObject() {
      const item = currentObject();
      revealRing.style.left = `${item.x}%`;
      revealRing.style.top = `${item.y}%`;
      revealRing.style.width = `${item.size}%`;
      revealRing.classList.add("show");
    }

    function nextObject() {
      if (index === objects.length - 1) {
        revealRing.classList.remove("show");
        finished.classList.add("show");
        prompt.textContent = "You found all 10 hidden objects!";
        document.getElementById("nextBtn").textContent = "Play Again";
        index = -1;
        return;
      }
      index += 1;
      document.getElementById("nextBtn").textContent = "Next Object →";
      updateRound();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }

    document.getElementById("hintBtn").addEventListener("click", showHint);
    document.getElementById("revealBtn").addEventListener("click", revealObject);
    document.getElementById("nextBtn").addEventListener("click", nextObject);
    document.getElementById("fullscreenBtn").addEventListener("click", toggleFullscreen);
    document.getElementById("closeHintBtn").addEventListener("click", () => hintDialog.close());
    hintDialog.addEventListener("click", event => {
      if (event.target === hintDialog) hintDialog.close();
    });
    document.addEventListener("keydown", event => {
      if (event.code === "Space") { event.preventDefault(); nextObject(); }
      if (event.code === "KeyH") showHint();
      if (event.code === "KeyR") revealObject();
      if (event.code === "KeyF") toggleFullscreen();
    });

    updateRound();
  </script>
</body>
</html>
