<style>
:root{--navy:#17324d;--blue:#3f7898;--blue2:#2f607a;--coral:#d97961;--coral2:#bc5e4b;--sage:#6e9d8b;--sage2:#557e70;--cream:#fff8e8;--ivory:#fffdf6;--gold:#d5c49d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;color:var(--navy);font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 12% 10%,rgba(242,184,75,.30),transparent 24%),
    radial-gradient(circle at 88% 18%,rgba(110,157,139,.25),transparent 26%),
    linear-gradient(145deg,#fff8e8,#f3ede2 52%,#e6f0ed);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;
  background-image:
    linear-gradient(90deg,transparent 49%,rgba(23,50,77,.07) 50%,transparent 51%),
    linear-gradient(transparent 49%,rgba(23,50,77,.05) 50%,transparent 51%);
  background-size:48px 48px
}
button,a{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.topbar{
  max-width:1220px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:18px;border-bottom:1px solid rgba(23,50,77,.12);flex-wrap:wrap
}
.back-btn,.top-btn{
  border:0;border-radius:14px;background:#1e3a8a;color:#fff;text-decoration:none;
  font-weight:900;padding:11px 17px;box-shadow:0 5px 0 rgba(23,50,77,.22)
}
.title-block{text-align:center;flex:1;min-width:270px}
.eyebrow{font-size:.8rem;font-weight:900;letter-spacing:.18em;color:#80694e}
h1{
  margin:3px 0 0;font-family:Georgia,serif;font-size:clamp(2.1rem,4.8vw,3.8rem);
  color:var(--navy);line-height:1;text-shadow:0 2px 0 #fff
}
.voice{
  display:flex;align-items:center;gap:8px;background:#fffdf6;color:#17324d;
  border:3px solid #d5c49d;border-radius:14px;padding:8px 12px;font-weight:900
}
.voice input{width:20px;height:20px}
.category-wrap{max-width:1050px;margin:0 auto;padding:28px 18px 40px}
.intro{text-align:center;color:#5f6c72;font-size:clamp(1.05rem,2.1vw,1.3rem);font-weight:800;margin:0 auto 20px;max-width:780px}
.category-grid{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:14px}
.category-btn{
  min-height:105px;border:3px solid #d5c49d;border-radius:20px;background:#fffdf6;color:#17324d;
  box-shadow:0 6px 0 #b99d69;padding:16px;text-align:left
}
.category-btn .name{font-family:Georgia,serif;font-weight:900;font-size:clamp(1.35rem,2.5vw,1.8rem)}
.category-btn .count{display:block;color:#80694e;font-weight:900;margin-top:4px}
.category-btn.mix{grid-column:1/-1;background:linear-gradient(145deg,#e7eef2,#f8f1df)}
.game-wrap{max-width:1120px;margin:0 auto;padding:14px 18px 28px}
.game-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.category-label{font-family:Georgia,serif;font-weight:900;font-size:clamp(1.25rem,2.5vw,1.8rem)}
.progress{text-align:center;color:#80694e;font-weight:900;margin-bottom:10px}
.stage{
  min-height:560px;background:linear-gradient(145deg,#fffdf6,#f1e6d0);
  border:4px solid #d5c49d;border-radius:30px;padding:clamp(18px,3vw,30px);
  box-shadow:0 10px 0 #b99d69,0 17px 32px rgba(23,50,77,.14);
  display:flex;flex-direction:column;justify-content:center
}
.prompt{text-align:center;font-family:"Arial Black",Arial,sans-serif;font-size:clamp(1.55rem,3.2vw,2.4rem);margin-bottom:16px}
.clues{display:grid;gap:12px;max-width:860px;width:100%;margin:0 auto}
.clue{
  background:#fff;border:3px solid #d8cdbc;border-radius:18px;padding:15px 18px;
  font-size:clamp(1.25rem,2.8vw,1.9rem);font-weight:900;color:#17324d;

.clue .label{display:block;font-size:.76em;letter-spacing:.08em;color:#80694e;margin-bottom:4px}
.answer{
  max-width:860px;width:100%;margin:16px auto 0;background:#e3efe8;border:4px solid #6e9d8b;
  border-radius:20px;padding:17px;text-align:center;color:#17324d;box-shadow:0 7px 0 #9eb8ae
}
.answer .song{font-family:Georgia,serif;font-weight:900;font-size:clamp(2rem,4.5vw,3.4rem);line-height:1}
.answer .artist{font-weight:900;font-size:clamp(1.15rem,2.5vw,1.7rem);margin-top:8px}

.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}
.action{

}

.listen{background:linear-gradient(145deg,var(--blue),var(--blue2));box-shadow:0 7px 0 #244d63}
.reveal{background:linear-gradient(145deg,var(--coral),var(--coral2));box-shadow:0 7px 0 #934738}
.next{background:linear-gradient(145deg,var(--sage),var(--sage2));box-shadow:0 7px 0 #42665b}
.helper{text-align:center;margin-top:12px;color:#7a7167;font-size:.92rem;font-weight:700}
#ytHolder{
  position:fixed;right:8px;bottom:8px;width:2px;height:2px;overflow:hidden;opacity:.01;pointer-events:none
}
#ytHolder iframe{width:100%;height:100%}
@media(max-width:680px){
  .title-block{order:-1;flex-basis:100%}
  .category-grid{grid-template-columns:1fr}
  .category-btn.mix{grid-column:auto}
  .stage{min-height:500px}
}
</style>
</head>

<section id="gameScreen" class="hidden">

        <div id="answerArtist" class="artist"></div>

      <div class="actions">

      <div class="helper">10 songs per round • Space = Another Clue / Reveal / Next • F = Fullscreen</div>
    </main>
  </div>
</section>

const ROUND_SIZE=10;
let currentKey="oldies";
let deck=[];
let index=0;
let clueCount=1;
let revealed=false;
let player=null;
let playerReady=false;
let pendingId=null;
let clipTimer=null;

const TALK_PROMPTS=[
  "Do you remember hearing this one on the radio?",
  "Did this song ever make you want to sing along?",
  "Does this song remind you of a particular person or place?",
  "Would you have danced to this one?",
  "Do you remember who in your family liked this song?"

function shuffle(a){
  const x=a.slice();
  for(let i=x.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [x[i],x[j]]=[x[j],x[i]];
  }
  return x;
}

function allSongs(){
  return Object.values(CATEGORIES).flatMap(c=>c.songs.map(s=>({s,c:c.label,emoji:c.emoji})));
}

function normalizedSong(raw,catLabel,emoji){
  return {
    title:raw[0],artist:raw[1],era:raw[2],hint:raw[3],id:raw[4]||"",
    catLabel,emoji
  };
}

function categorySongs(key){
  if(key==="mix"){
    return allSongs().map(x=>normalizedSong(x.s,x.c,x.emoji));
  }
  const c=CATEGORIES[key];
  return c.songs.map(s=>normalizedSong(s,c.label,c.emoji));
}

function renderCategories(){
  const grid=document.getElementById("categoryGrid");
  grid.innerHTML="";
  Object.entries(CATEGORIES).forEach(([key,c])=>{
    const b=document.createElement("button");
    b.className="category-btn";
    b.innerHTML="<div class='name'>"+c.emoji+" "+c.label+"</div><span class='count'>"+c.songs.length+" songs</span>";
    b.onclick=()=>startCategory(key);
    grid.appendChild(b);
  });
  const total=allSongs().length;
  const mix=document.createElement("button");
  mix.className="category-btn mix";
  mix.innerHTML="<div class='name'>🎶 Mix It Up</div><span class='count'>"+total+" songs across every set</span>";
  mix.onclick=()=>startCategory("mix");
  grid.appendChild(mix);
}

function startCategory(key){
  currentKey=key;
  const pool=shuffle(categorySongs(key));
  deck=pool.slice(0,Math.min(ROUND_SIZE,pool.length));
  index=0;
  document.getElementById("categoryScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");
  renderSong();
}

function showCategories(){
  stopClip();
  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("categoryScreen").classList.remove("hidden");
}

function renderSong(){
  stopClip();
  clueCount=1;
  revealed=false;
  const song=deck[index];

  document.getElementById("categoryLabel").textContent=
    currentKey==="mix"?"🎶 Mix It Up":song.emoji+" "+song.catLabel;
  document.getElementById("progress").textContent="Song "+(index+1)+" of "+deck.length;
  document.getElementById("prompt").textContent="Can you name this song?";
  document.getElementById("answer").classList.add("hidden");
  document.getElementById("moreBtn").classList.remove("hidden");
  document.getElementById("revealBtn").classList.remove("hidden");
  document.getElementById("nextBtn").classList.add("hidden");
  document.getElementById("listenBtn").classList.toggle("hidden",!song.id);
  renderClues();
}

function clueText(song,n){
  if(n===1)return "Era: "+song.era;
  if(n===2)return "Performer: "+song.artist;
  return "Title Hint: "+song.hint;
}

function renderClues(){
  const song=deck[index];
  const wrap=document.getElementById("clues");
  wrap.innerHTML="";
  for(let n=1;n<=clueCount;n++){
    const div=document.createElement("div");
    div.className="clue";
    div.innerHTML="<span class='label'>CLUE "+n+"</span>"+clueText(song,n);
    wrap.appendChild(div);
  }
  if(clueCount>=3)document.getElementById("moreBtn").classList.add("hidden");
}

function anotherClue(){
  if(revealed)return;
  if(clueCount<3){
    clueCount++;
    renderClues();
    speakText(clueText(deck[index],clueCount));
  }else{
    revealSong();
  }
}

function revealSong(){
  if(revealed)return;
  revealed=true;
  stopClip();
  const song=deck[index];

  document.getElementById("prompt").textContent="The song is…";
  document.getElementById("answerSong").textContent=song.title;
  document.getElementById("answerArtist").textContent=song.artist+" • "+song.era;
  document.getElementById("talkPrompt").textContent=TALK_PROMPTS[index%TALK_PROMPTS.length];
  document.getElementById("answer").classList.remove("hidden");

  document.getElementById("moreBtn").classList.add("hidden");
  document.getElementById("revealBtn").classList.add("hidden");
  document.getElementById("nextBtn").classList.remove("hidden");

  speakText(song.title+" by "+song.artist);
}

function nextSong(){
  index++;
  if(index>=deck.length){
    const pool=shuffle(categorySongs(currentKey));
    deck=pool.slice(0,Math.min(ROUND_SIZE,pool.length));
    index=0;
  }
  renderSong();
}

function speakText(text){
  if(!document.getElementById("voiceToggle").checked)return;
  if(!("speechSynthesis" in window))return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=.9;
  window.speechSynthesis.speak(u);
}

function ensurePlayer(id){
  if(player)return true;
  if(!(window.YT&&YT.Player))return false;
  player=new YT.Player("ytPlayer",{
    videoId:id,
    playerVars:{autoplay:1,rel:0,modestbranding:1},
    events:{onReady:function(e){
      playerReady=true;
      e.target.playVideo();
      if(pendingId&&pendingId!==id)e.target.loadVideoById(pendingId);
      pendingId=null;
    }}
  });
  return true;
}

function playClip(){
  const song=deck[index];
  if(!song.id)return;
  clearTimeout(clipTimer);
  if(!ensurePlayer(song.id)){
    pendingId=song.id;
    document.getElementById("prompt").textContent="Loading the music…";
    setTimeout(playClip,400);
    return;
  }
  if(playerReady)player.loadVideoById(song.id);
  else pendingId=song.id;
  document.getElementById("prompt").textContent="Listen closely…";
  clipTimer=setTimeout(()=>{if(player&&playerReady&&player.pauseVideo)player.pauseVideo()},18000);
}

function stopClip(){
  clearTimeout(clipTimer);
  if(player&&playerReady&&player.stopVideo)player.stopVideo();
}

function toggleFullscreen(){
  if(!document.fullscreenElement)document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

document.addEventListener("keydown",ev=>{
  if(ev.code==="KeyF"){toggleFullscreen();return}
  if(ev.code!=="Space"&&ev.key!==" ")return;
  ev.preventDefault();
  if(document.getElementById("gameScreen").classList.contains("hidden"))return;
  if(revealed)nextSong();
  else if(clueCount<3)anotherClue();
  else revealSong();
});

renderCategories();
</script>
</body>
</html>
