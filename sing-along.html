<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sing-Along — ProjectorFirst</title>

<!-- Membership gate (paywall-test) -->
<script

<script src="/guard.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      height: 100vh;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #1e3a8a;
      font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .screen { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
    .btn-big {
      font-weight: 900;
      border-radius: 1.25rem;
      border: 4px solid #0f265f;
      box-shadow: 0 6px 0 #0f265f;
      transition: transform .08s ease, box-shadow .08s ease;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .btn-big:active { transform: translateY(4px); box-shadow: 0 2px 0 #0f265f; }
    .btn-big:disabled { opacity: .5; cursor: default; }
    .answer-card {
      background: #facc15;
      color: #1e3a8a;
      font-weight: 900;
      border: 4px solid #fff;
      border-radius: 1.5rem;
      padding: 1rem 1.5rem;
      animation: popIn .4s cubic-bezier(.2,1.6,.4,1) both;
      box-shadow: 0 6px 0 #b45309;
      text-align: center;
    }
    @keyframes popIn {
      0% { transform: scale(.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .confetti {
      position: fixed;
      top: -20px;
      pointer-events: none;
      z-index: 50;
      font-size: clamp(1.2rem, 3vw, 2rem);
      animation: fall linear forwards;
    }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .9; } }
    @media (prefers-reduced-motion: reduce) {
      .answer-card { animation: none; }
      .confetti { display: none; }
    }
    .note-pulse {
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    /* Player hidden by default (audio-only). The Show Video toggle
       reveals it as a small corner player as a manual fallback. */
    #ytHolder {
      position: fixed;
      bottom: 8px;
      right: 8px;
      width: 3px;
      height: 3px;
      overflow: hidden;
      opacity: 0.01;
      pointer-events: none;
      z-index: 40;
    }
    #ytHolder.visible {
      width: 320px;
      height: 200px;
      opacity: 1;
      pointer-events: auto;
      border: 3px solid #facc15;
      border-radius: .5rem;
      background: #000;
    }
    #ytHolder iframe {
      width: 100%;
      height: 100%;
      min-width: 300px;
      min-height: 180px;
    }
  </style>
</head>
<body>

  <div id="gameScreen" class="screen">
    <header class="flex items-center justify-between px-4 pt-4 pb-1 gap-2 flex-wrap">
      <a href="apps.html" class="btn-big bg-white text-blue-900 text-base md:text-xl px-3 py-2 no-underline">← Back to Apps</a>
      <h1 class="text-yellow-300 font-black" style="font-size: clamp(1.3rem, 4.5vw, 2.4rem); text-shadow: 3px 3px 0 #0f265f;">🎤 SING-ALONG</h1>
      <label class="flex items-center gap-2 text-white font-bold text-sm md:text-lg cursor-pointer select-none">
        <input type="checkbox" id="videoToggle" class="w-5 h-5 md:w-6 md:h-6 accent-yellow-400" onchange="toggleVideo()">
        🎬 Show Video
      </label>
    </header>

    <div class="text-center text-blue-200 font-bold" style="font-size: clamp(.9rem, 2.4vw, 1.2rem);" id="progressLabel"></div>

    <main class="flex-1 flex flex-col items-center justify-center px-4 min-h-0 gap-5">
      <div id="notePulse" class="note-pulse text-center" style="font-size: clamp(4rem, 16vw, 9rem); line-height: 1;">🎵</div>
      <div id="statusLine" class="text-white font-black text-center" style="font-size: clamp(1.3rem, 4.5vw, 2.2rem);">Listen closely... can you guess the artist?</div>
      <div id="answerWrap" class="flex justify-center px-2 max-w-3xl"></div>
    </main>

    <footer class="px-4 pb-5 pt-1">
      <div class="flex justify-center gap-3 md:gap-5 flex-wrap max-w-2xl mx-auto">
        <button id="playBtn" class="btn-big bg-green-400 text-blue-900 px-5 py-4 flex-1 min-w-[10rem]" style="font-size: clamp(1.2rem, 3.8vw, 2rem); border-color:#14532d; box-shadow: 0 6px 0 #14532d;" onclick="playClip()">▶️ Play Clip</button>
        <button id="revealBtn" class="btn-big bg-yellow-400 text-blue-900 px-5 py-4 flex-1 min-w-[10rem]" style="font-size: clamp(1.2rem, 3.8vw, 2rem); border-color:#b45309; box-shadow: 0 6px 0 #b45309;" onclick="reveal()" disabled>✨ Reveal Answer</button>
        <button id="nextBtn" class="btn-big bg-white text-blue-900 px-5 py-4 flex-1 min-w-[10rem]" style="font-size: clamp(1.2rem, 3.8vw, 2rem);" onclick="nextSong()">Next Song ➡️</button>
      </div>
      <div class="text-center text-blue-300 font-semibold mt-2 hidden md:block" style="font-size: clamp(.85rem, 2vw, 1.05rem);">Play the clip, let everyone guess out loud, then reveal!</div>
    </footer>
  </div>

  <div id="ytHolder"><div id="ytPlayer"></div></div>

<script>
// ============ SONGS ============
// Each song has its own dedicated YouTube video, so each clip just loads
// and autoplays from the start — no seeking to a mid-video timestamp,
// which was unreliable. Fill in "id" with the real YouTube video ID
// (the part after watch?v= in a normal youtube.com/watch link) for each.
const SONGS = [
  { title: "Oh, Pretty Woman", artist: "Roy Orbison", id: "3KFvoDDs0XM" },
  { title: "Can't Take My Eyes Off You", artist: "Frankie Valli", id: "LcJm1pOswfM" },
  { title: "Ain't No Mountain High Enough", artist: "Marvin Gaye & Tammi Terrell", id: "2Hlhi8AZf6k" },
  { title: "Dreams", artist: "Fleetwood Mac", id: "mrZRURcb1cM" },
  { title: "Don't Worry Baby", artist: "The Beach Boys", id: "Qt6oiHHbmT8" },
  { title: "Suspicious Minds", artist: "Elvis Presley", id: "FU722OCH-wo" },
  { title: "I Just Want to Be Your Everything", artist: "Andy Gibb", id: "tA6L8-lxaA8" },
  { title: "Unchained Melody", artist: "The Righteous Brothers", id: "pm2Z9yAp_CE" },
  { title: "Have You Ever Seen the Rain", artist: "Creedence Clearwater Revival", id: "Gu2pVPWGYMQ" },
  { title: "Let It Be", artist: "The Beatles", id: "85u7my78ng0" },
  { title: "A Horse With No Name", artist: "America", id: "zSAJ0l4OBHM" },
  { title: "My Girl", artist: "The Temptations", id: "y3KJ7d2qBoA" },
  { title: "Return to Sender", artist: "Elvis Presley", id: "Z54-QHEZN6E" },
  { title: "Dancing Queen", artist: "ABBA", id: "3ij_pUtJJrw" },
  { title: "California Dreamin'", artist: "The Mamas & the Papas", id: "qhZULM69DIw" },
  { title: "Sweet Caroline", artist: "Neil Diamond", id: "0iN-hemcKc8" },
  { title: "Jolene", artist: "Dolly Parton", id: "irnTlxdJghM" },
  { title: "Fortunate Son", artist: "Creedence Clearwater Revival", id: "I1cF9YwGjJ8" },
  { title: "Put Your Head on My Shoulder", artist: "Paul Anka", id: "kvazBqAlx58" },
  { title: "Stop! In the Name of Love", artist: "The Supremes", id: "une981B7Q4Y" },
  { title: "Wouldn't It Be Nice", artist: "The Beach Boys", id: "5lP8BZcyoEQ" },
];

// ============ STATE ============
let deck = [];
let deckIndex = 0;
let revealed = false;
let clipTimer = null;
const CLIP_SECONDS = 25; // auto-stop the clip after this many seconds

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============ YOUTUBE PLAYER (official IFrame API) ============
// One persistent player, created on the first Play click (a user gesture,
// which satisfies browser autoplay rules). Each subsequent song is loaded
// into the SAME player via loadVideoById(differentVideoId) — the standard,
// well-supported way to switch videos, unlike recreating iframes (whose
// autoplay is often blocked after the first) or seeking within one long
// video (which was unreliable).
let player = null;
let playerReady = false;
let pendingVideoId = null;

// Load the API script.
(function () {
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);
})();

window.onYouTubeIframeAPIReady = function () {
  // API is ready; the player itself is created lazily on first Play.
};

function ensurePlayer(videoId) {
  if (player) return true;
  if (!(window.YT && YT.Player)) return false; // API still loading
  player = new YT.Player("ytPlayer", {
    videoId: videoId,
    playerVars: { autoplay: 1, rel: 0, modestbranding: 1 },
    events: {
      onReady: function (e) {
        playerReady = true;
        e.target.playVideo();
        if (pendingVideoId && pendingVideoId !== videoId) {
          e.target.loadVideoById(pendingVideoId);
        }
        pendingVideoId = null;
      }
    }
  });
  return true;
}

function toggleVideo() {
  const on = document.getElementById("videoToggle").checked;
  document.getElementById("ytHolder").classList.toggle("visible", on);
}

// ============ GAME ============
function stopClip() {
  if (player && playerReady && player.stopVideo) player.stopVideo();
}

function renderSong() {
  revealed = false;
  clearTimeout(clipTimer);
  document.getElementById("progressLabel").textContent = "Song " + (deckIndex + 1) + " of " + deck.length;
  document.getElementById("statusLine").textContent = "Listen closely... can you guess the artist?";
  document.getElementById("answerWrap").innerHTML = "";
  document.getElementById("notePulse").textContent = "🎵";
  document.getElementById("revealBtn").disabled = true;
  document.getElementById("playBtn").disabled = false;
  stopClip();
}

function playClip() {
  const song = deck[deckIndex];
  clearTimeout(clipTimer);
  if (!song.id) {
    document.getElementById("statusLine").textContent = "No video linked for this song yet.";
    return;
  }
  if (!ensurePlayer(song.id)) {
    // API script still loading; remember what to play and retry shortly.
    pendingVideoId = song.id;
    document.getElementById("statusLine").textContent = "Loading the music... one moment.";
    setTimeout(playClip, 400);
    return;
  }
  if (playerReady) {
    player.loadVideoById(song.id); // loads AND autoplays the new video
  } else {
    pendingVideoId = song.id; // player object exists but not ready yet
  }
  document.getElementById("statusLine").textContent = "🎶 Now playing... guess out loud!";
  document.getElementById("revealBtn").disabled = false;
  clipTimer = setTimeout(function () {
    if (player && playerReady && player.pauseVideo) player.pauseVideo();
  }, CLIP_SECONDS * 1000);
}

function reveal() {
  if (revealed) return;
  revealed = true;
  clearTimeout(clipTimer);
  stopClip();
  const song = deck[deckIndex];
  document.getElementById("statusLine").textContent = "The answer is...";
  document.getElementById("notePulse").textContent = "🎉";
  const wrap = document.getElementById("answerWrap");
  const card = document.createElement("div");
  card.className = "answer-card";
  card.style.fontSize = "clamp(1.5rem, 5.5vw, 3rem)";
  card.innerHTML = song.title + "<br><span style='font-size:.7em;'>" + song.artist + "</span>";
  wrap.appendChild(card);
  document.getElementById("revealBtn").disabled = true;
  throwConfetti(16);
}

function nextSong() {
  clearTimeout(clipTimer);
  deckIndex++;
  if (deckIndex >= deck.length) {
    deck = shuffle(SONGS);
    deckIndex = 0;
  }
  renderSong();
}

// ============ CONFETTI ============
const CONFETTI_EMOJI = ["🎉", "✨", "⭐", "🎊", "💛", "💙", "🎶"];
function throwConfetti(count) {
  const n = count || 14;
  for (let i = 0; i < n; i++) {
    const el = document.createElement("div");
    el.className = "confetti";
    el.textContent = CONFETTI_EMOJI[Math.floor(Math.random() * CONFETTI_EMOJI.length)];
    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = (1.8 + Math.random() * 1.6) + "s";
    el.style.animationDelay = (Math.random() * 0.4) + "s";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4200);
  }
}

// ============ SPACE BAR ============
document.addEventListener("keydown", function (ev) {
  if (ev.code !== "Space" && ev.key !== " ") return;
  ev.preventDefault();
  if (!revealed && !document.getElementById("revealBtn").disabled) reveal();
  else if (document.getElementById("playBtn").disabled === false && document.getElementById("revealBtn").disabled === true) playClip();
});

deck = shuffle(SONGS);
renderSong();
</script>
</body>
</html>
