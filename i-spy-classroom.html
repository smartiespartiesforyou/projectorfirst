<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>I Spy: 1950s Classroom — ProjectorFirst</title>

  <!-- Membership gate -->
  <script
    data-memberstack-app="app_cmgnwpg8y00x10suih4pua785"
    src="https://static.memberstack.com/scripts/v2/memberstack.js"
    type="text/javascript">
  </script>
  <script src="/guard.js"></script>

  <meta name="description" content="A large-screen 1950s classroom I Spy game with hints and reveals for senior groups." />
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <style>
    :root{
      --navy:#17324d;--blue:#3f7898;--blue2:#2f607a;--coral:#d97961;--coral2:#bc5e4b;
      --sage:#6e9d8b;--sage2:#557e70;--cream:#fff8e8;--ivory:#fffdf6;--gold:#d5c49d;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;color:var(--navy);font-family:Arial,sans-serif;
      background:
        radial-gradient(circle at 10% 8%,rgba(236,207,150,.22),transparent 24%),
        radial-gradient(circle at 92% 12%,rgba(117,157,139,.15),transparent 24%),
        linear-gradient(145deg,#fff8e8,#f3ede2 52%,#e6f0ed);
    }
    body:before{
      content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;
      background-image:
        linear-gradient(90deg,transparent 49%,rgba(23,50,77,.07) 50%,transparent 51%),
        linear-gradient(transparent 49%,rgba(23,50,77,.05) 50%,transparent 51%);
      background-size:48px 48px;
    }
    button,a{font:inherit}
    .topbar{
      position:relative;max-width:1500px;margin:0 auto;display:grid;
      grid-template-columns:auto 1fr auto;align-items:center;gap:18px;
      padding:18px 18px 12px;border-bottom:1px solid rgba(23,50,77,.12)
    }
    .back{
      color:#fff;background:#1e3a8a;text-decoration:none;font-weight:900;
      padding:11px 16px;border-radius:14px;box-shadow:0 5px 0 rgba(23,50,77,.22);white-space:nowrap
    }
    h1{
      margin:0;text-align:center;font-family:Georgia,serif;font-size:clamp(1.8rem,3.6vw,3.1rem);
      font-weight:900;color:var(--navy);text-shadow:0 2px 0 #fff
    }
    .progress{
      background:#fff8e8;border:3px solid #d5c49d;border-radius:14px;
      padding:9px 13px;font-weight:900;color:#5f6c72;white-space:nowrap
    }
    main{position:relative;max-width:1540px;margin:0 auto;padding:18px 18px 28px}
    .prompt{
      width:min(100%,1200px);min-height:64px;margin:0 auto 16px;padding:12px 24px;
      display:flex;align-items:center;justify-content:center;text-align:center;
      background:linear-gradient(145deg,#fffdf6,#efe3c7);
      border:4px solid #d5c49d;border-radius:22px;box-shadow:0 7px 0 #b99d69;
      color:var(--navy);font-family:Georgia,serif;font-size:clamp(1.8rem,4vw,3.4rem);font-weight:900
    }
    .poster-frame{
      position:relative;width:min(100%,1500px);margin:0 auto;overflow:hidden;
      background:#fff;border:5px solid #d5c49d;border-radius:24px;
      box-shadow:0 9px 0 #b99d69,0 18px 38px rgba(23,50,77,.16)
    }
    .poster-frame img{display:block;width:100%;height:auto}
    .reveal-ring{
      position:absolute;left:50%;top:50%;width:7%;aspect-ratio:1;border-radius:50%;
      transform:translate(-50%,-50%);pointer-events:none;display:none;
      border:clamp(5px,.65vw,11px) solid #fff;
      box-shadow:0 0 0 6px #d97961,0 0 26px 12px rgba(242,196,93,.95);
      animation:pulse 1s ease-in-out infinite alternate
    }
    .reveal-ring.show{display:block}
    @keyframes pulse{from{scale:.92}to{scale:1.12}}
    .controls{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:18px}
    .btn{
      min-width:165px;border:4px solid rgba(255,255,255,.78);border-radius:18px;
      color:#fff;cursor:pointer;font-size:clamp(1.05rem,2.2vw,1.35rem);font-weight:900;
      padding:12px 18px;box-shadow:0 6px 0 rgba(23,50,77,.24)
    }
    .hint{background:linear-gradient(145deg,var(--blue),var(--blue2));box-shadow:0 6px 0 #244d63}
    .reveal{background:linear-gradient(145deg,var(--coral),var(--coral2));box-shadow:0 6px 0 #934738}
    .next{background:linear-gradient(145deg,var(--sage),var(--sage2));box-shadow:0 6px 0 #42675a}
    .fullscreen{background:linear-gradient(145deg,#6d7982,#59636b);box-shadow:0 6px 0 #465059}
    .btn:focus-visible,.back:focus-visible{outline:5px solid #f2c45d;outline-offset:3px}
    dialog{
      width:min(92vw,900px);border:4px solid #d5c49d;border-radius:26px;padding:20px;
      color:var(--navy);background:#fffdf6;box-shadow:0 24px 70px rgba(23,50,77,.38)
    }
    dialog::backdrop{background:rgba(23,50,77,.68)}
    dialog h2{
      margin:0 0 14px;text-align:center;font-family:Georgia,serif;
      font-size:clamp(1.7rem,4vw,2.7rem);color:var(--navy)
    }
    .hint-crop{
      width:100%;aspect-ratio:16/8;border-radius:18px;border:4px solid #d5c49d;
      background-image:url("1950-classroom-i-spy.png");background-repeat:no-repeat;background-size:230%;
      box-shadow:0 6px 0 #b99d69
    }
    .dialog-actions{display:flex;justify-content:center;margin-top:16px}
    .close{background:#1e3a8a;box-shadow:0 6px 0 #102d68}
    .finished{
      position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:2rem;
      background:rgba(255,248,232,.95);color:var(--navy);font-family:Georgia,serif;
      font-size:clamp(2.6rem,7vw,6rem);font-weight:900;text-align:center;text-shadow:0 3px 0 #fff
    }
    .finished.show{display:flex}
    @media(max-width:760px){
      .topbar{grid-template-columns:1fr auto}.topbar h1{grid-column:1/-1;grid-row:1;text-align:center}
      .back{grid-column:1;grid-row:2}.progress{grid-column:2;grid-row:2}
      main{padding-inline:8px}.poster-frame{border-width:3px}.btn{min-width:140px;padding-inline:12px}
    }
    @media(prefers-reduced-motion:reduce){.reveal-ring{animation:none}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="back" href="i-spy.html">← I Spy Games</a>
    <h1>I Spy: 1950s Classroom</h1>
    <div class="progress" aria-live="polite"><span id="currentNumber">1</span> of <span id="totalNumber">10</span></div>
  </header>

  <main>
    <div id="prompt" class="prompt" aria-live="polite">Can you find the red apple?</div>

    <div class="poster-frame" id="posterFrame">
      <img src="1950-classroom-i-spy.png" alt="A nostalgic 1950s classroom containing ten search objects" />
      <div id="revealRing" class="reveal-ring" aria-hidden="true"></div>
      <div id="finished" class="finished">Wonderful work!<br />You found all 10!</div>
    </div>

    <div class="controls">
      <button class="btn hint" id="hintBtn" type="button">🔍 Hint</button>
      <button class="btn reveal" id="revealBtn" type="button">⭕ Reveal</button>
      <button class="btn next" id="nextBtn" type="button">Next Object →</button>
      <button class="btn fullscreen" id="fullscreenBtn" type="button">Fullscreen</button>
    </div>
  </main>

  <dialog id="hintDialog">
    <h2 id="hintTitle">Look in this part of the classroom</h2>
    <div id="hintCrop" class="hint-crop" role="img" aria-label="A closer view of the correct area"></div>
    <div class="dialog-actions">
      <button class="btn close" id="closeHintBtn" type="button">Back to Picture</button>
    </div>
  </dialog>

  <script>
    const objects = [
      { name: "red apple", x: 17.2, y: 55.4, size: 5.0 },
      { name: "blue lunchbox", x: 16.5, y: 70.5, size: 9.5 },
      { name: "yellow ruler", x: 64.6, y: 58.0, size: 8.0 },
      { name: "green mitten", x: 94.0, y: 33.1, size: 5.0 },
      { name: "silver school bell", x: 58.2, y: 36.5, size: 4.2 },
      { name: "small red toy car", x: 82.6, y: 36.0, size: 5.0 },
      { name: "white handkerchief", x: 72.3, y: 75.5, size: 7.0 },
      { name: "orange crayon", x: 39.4, y: 57.2, size: 5.0 },
      { name: "brass key", x: 97.2, y: 31.3, size: 4.2 },
      { name: "black cat-eye glasses", x: 94.5, y: 55.2, size: 6.0 }
    ];

    let index = 0;
    const prompt = document.getElementById("prompt");
    const currentNumber = document.getElementById("currentNumber");
    const totalNumber = document.getElementById("totalNumber");
    const revealRing = document.getElementById("revealRing");
    const hintDialog = document.getElementById("hintDialog");
    const hintCrop = document.getElementById("hintCrop");
    const hintTitle = document.getElementById("hintTitle");
    const finished = document.getElementById("finished");

    totalNumber.textContent = objects.length;

    function currentObject() { return objects[index]; }

    function updateRound() {
      const item = currentObject();
      prompt.textContent = `Can you find the ${item.name}?`;
      currentNumber.textContent = index + 1;
      revealRing.classList.remove("show");
      finished.classList.remove("show");
    }

    function showHint() {
      const item = currentObject();
      hintTitle.textContent = `Look in this area for the ${item.name}`;
      hintCrop.style.backgroundPosition = `${item.x}% ${item.y}%`;
      hintDialog.showModal();
    }

    function revealObject() {
      const item = currentObject();
      revealRing.style.left = `${item.x}%`;
      revealRing.style.top = `${item.y}%`;
      revealRing.style.width = `${item.size}%`;
      revealRing.classList.add("show");
    }

    function nextObject() {
      if (index === objects.length - 1) {
        revealRing.classList.remove("show");
        finished.classList.add("show");
        prompt.textContent = "You found all 10 hidden objects!";
        document.getElementById("nextBtn").textContent = "Play Again";
        index = -1;
        return;
      }
      index += 1;
      document.getElementById("nextBtn").textContent = "Next Object →";
      updateRound();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }

    document.getElementById("hintBtn").addEventListener("click", showHint);
    document.getElementById("revealBtn").addEventListener("click", revealObject);
    document.getElementById("nextBtn").addEventListener("click", nextObject);
    document.getElementById("fullscreenBtn").addEventListener("click", toggleFullscreen);
    document.getElementById("closeHintBtn").addEventListener("click", () => hintDialog.close());
    hintDialog.addEventListener("click", event => {
      if (event.target === hintDialog) hintDialog.close();
    });
    document.addEventListener("keydown", event => {
      if (event.code === "Space") { event.preventDefault(); nextObject(); }
      if (event.code === "KeyH") showHint();
      if (event.code === "KeyR") revealObject();
      if (event.code === "KeyF") toggleFullscreen();
    });

    updateRound();
  </script>
</body>
</html>
