<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Classic Bingo Caller — ProjectorFirst</title>

<script data-memberstack-app="app_cmgnwpg8y00x10suih4pua785" src="https://static.memberstack.com/scripts/v2/memberstack.js" type="text/javascript"></script>
<script src="/guard.js"></script>

<meta name="description" content="Large-screen bingo caller with giant numbers and a visible tray of called balls for senior groups."/>
<meta name="theme-color" content="#17324d"/>
<link rel="icon" href="/logo.svg" type="image/svg+xml"/>

<style>
:root{
  --navy:#17324d;--blue:#3f7898;--blue2:#2f607a;--coral:#d97961;--coral2:#bc5e4b;
  --sage:#6e9d8b;--sage2:#557e70;--cream:#fff8e8;--ivory:#fffdf6;--gold:#d5c49d;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  min-height:100vh;min-height:100dvh;max-height:100dvh;overflow:hidden;
  padding:12px 16px;color:var(--navy);font-family:Arial,sans-serif;
  display:flex;flex-direction:column;
  background:
    radial-gradient(circle at 12% 10%,rgba(242,184,75,.26),transparent 24%),
    radial-gradient(circle at 88% 18%,rgba(110,157,139,.22),transparent 26%),
    linear-gradient(145deg,#fff8e8,#f3ede2 52%,#e6f0ed);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;
  background-image:
    linear-gradient(90deg,transparent 49%,rgba(23,50,77,.07) 50%,transparent 51%),
    linear-gradient(transparent 49%,rgba(23,50,77,.05) 50%,transparent 51%);
  background-size:48px 48px;
}
.topbar{
  position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin-bottom:8px
}
.back-btn,.top-btn{
  border:0;border-radius:14px;background:#1e3a8a;color:#fff;text-decoration:none;
  font-weight:900;font-size:clamp(1rem,2vmin,1.2rem);padding:10px 16px;
  box-shadow:0 5px 0 rgba(23,50,77,.22);cursor:pointer;white-space:nowrap
}
.title-block{text-align:center;flex:1;min-width:260px}
.eyebrow{font-size:.78rem;font-weight:900;letter-spacing:.18em;color:#80694e}
h1{
  margin:2px 0 0;font-family:Georgia,serif;font-size:clamp(1.7rem,3.2vmin,2.6rem);
  line-height:1;color:var(--navy);text-shadow:0 2px 0 #fff
}
.topbar-options{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#themeGame{
  border:3px solid #d5c49d;border-radius:14px;padding:9px 11px;background:#fffdf6;
  color:var(--navy);font-weight:900;font-size:clamp(.95rem,1.8vmin,1.12rem)
}
.stage{
  position:relative;z-index:1;flex:1 1 auto;min-height:0;display:flex;align-items:center;
  justify-content:center;gap:clamp(1rem,3vw,2.6rem)
}
.controls{display:flex;flex-direction:column;gap:14px}
.btn{
  min-width:clamp(150px,16vw,210px);border:4px solid rgba(255,255,255,.78);
  border-radius:20px;color:#fff;cursor:pointer;font-weight:900;
  font-size:clamp(1.2rem,2.5vmin,1.65rem);padding:clamp(.85rem,1.8vmin,1.2rem) 1.4rem;
  box-shadow:0 7px 0 rgba(23,50,77,.24)
}
.btn-next{background:linear-gradient(145deg,var(--blue),var(--blue2));box-shadow:0 7px 0 #244d63}
.btn-reset{background:linear-gradient(145deg,var(--coral),var(--coral2));box-shadow:0 7px 0 #934738}
.btn:disabled{opacity:.5;cursor:not-allowed}
.caller-box{
  width:min(60vw,calc(100dvh - 15.5rem),650px);aspect-ratio:1/1;
  background:linear-gradient(145deg,#fffdf6,#efe3c7);color:var(--navy);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:5px solid #d5c49d;border-radius:30px;
  box-shadow:0 10px 0 #b99d69,0 18px 36px rgba(23,50,77,.18);
  font-weight:900;user-select:none;padding:26px
}
.caller-letter{
  min-height:1.15em;
  margin-bottom:clamp(2px,.8vmin,8px);
  padding:clamp(4px,.8vmin,8px) clamp(14px,2.2vmin,24px);
  border-radius:999px;
  background:var(--navy);
  color:#fff;
  font-family:"Arial Black",Arial,sans-serif;
  font-size:clamp(1.5rem,4.5vmin,3rem);
  font-weight:900;
  line-height:1;
  letter-spacing:.03em;
  text-align:center;
  box-shadow:0 5px 0 rgba(23,50,77,.20)
}
.caller-letter:empty{
  min-height:0;
  margin:0;
  padding:0;
  box-shadow:none
}
.caller-number{
  white-space:nowrap;
  line-height:.82;
  font-family:"Arial Black",Arial,sans-serif;
  font-weight:900;
  letter-spacing:-.045em;
  text-align:center;
  color:#102d46;
  font-variant-numeric:tabular-nums
}
.caller-emoji{font-size:clamp(1.8rem,5vmin,3.5rem);margin-top:10px;min-height:1em}
.caller-sub{
  margin-top:12px;min-height:1.4em;font-size:clamp(1rem,2.2vmin,1.35rem);
  font-weight:900;color:#68747a;text-align:center
}
.tray-wrap{
  position:relative;z-index:1;flex:0 0 auto;margin-top:8px;padding:12px 14px 8px;
  background:rgba(255,253,246,.88);border:2px solid rgba(23,50,77,.10);
  border-radius:20px;box-shadow:0 5px 14px rgba(23,50,77,.06)
}
.tray-head{
  display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;
  margin-bottom:8px
}
.tray-label{font-size:clamp(.95rem,1.8vmin,1.1rem);font-weight:900;color:#52616c}
.progress-text{font-size:clamp(.95rem,1.8vmin,1.1rem);font-weight:900;color:#80694e}
.recent-calls{
  display:flex;align-items:center;gap:9px;overflow-x:auto;overflow-y:hidden;
  padding:3px 2px 10px;-webkit-overflow-scrolling:touch
}
.recent-calls span{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  width:clamp(58px,8vmin,88px);height:clamp(58px,8vmin,88px);border-radius:50%;
  color:#fff;font-family:Georgia,serif;font-size:clamp(1.25rem,2.8vmin,1.9rem);
  font-weight:900;box-shadow:0 5px 0 rgba(23,50,77,.22)
}
.recent-calls span:first-child{outline:4px solid #f2c45d;outline-offset:3px}
.ball-B{background:#315f93}.ball-I{background:#c45f50}.ball-N{background:#5f8d79}
.ball-G{background:#c99736}.ball-O{background:#725d89}
.ball-generic{background:#3f7898}
@media(max-width:820px){
  body{overflow:auto;max-height:none}
  .stage{flex-direction:column;gap:12px}
  .caller-box{width:min(88vw,calc(100dvh - 23rem),620px)}
  .controls{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .topbar{justify-content:center}.topbar-options{justify-content:center}.title-block{order:-1;flex-basis:100%}
}
</style>
</head>

<body>
<div class="topbar">
  <a href="apps.html" class="back-btn">← Back to Apps</a>

  <div class="title-block">
    <div class="eyebrow">BINGO CALLER</div>
    <h1>Classic Bingo</h1>
  </div>

  <div class="topbar-options">
    <select id="themeGame" aria-label="Bingo game style">
      <option value="classic-75">Classic 1–75</option>
      <option value="halloween-75">Halloween 🎃</option>
      <option value="christmas-75">Christmas 🎄</option>
      <option value="easter-75">Easter 🐣</option>
      <option value="valentines-75">Valentine’s 💘</option>
      <option value="patriotic-75">Patriotic ⭐</option>
      <option value="classic-90">1–90</option>
      <option value="classic-100">1–100</option>
    </select>
    <button id="fsBtn" class="top-btn">⛶ Fullscreen</button>
  </div>
</div>

<div class="stage">
  <div class="controls">
    <button id="nextBtn" class="btn btn-next">Call Next</button>
  </div>

  <div id="callerBox" class="caller-box">
    <div id="callerLetter" class="caller-letter" aria-hidden="true"></div>
    <div id="callerNumber" class="caller-number">—</div>
    <div id="callerEmoji" class="caller-emoji"></div>
    <div id="callerSub" class="caller-sub">Ready to begin.</div>
  </div>

  <div class="controls">
    <button id="resetBtn" class="btn btn-reset">Reset Game</button>
  </div>
</div>

<div class="tray-wrap">
  <div class="tray-head">
    <div class="tray-label">Called balls: <span id="callCount">0</span></div>
    <div id="progressText" class="progress-text">0 of 75 called • 75 remaining</div>
  </div>
  <div id="recentCalls" class="recent-calls"></div>
</div>

<script>
const letters=["B","I","N","G","O"];
const ranges=[[1,15],[16,30],[31,45],[46,60],[61,75]];
const THEMES={
  classic:{emoji:""},
  halloween:{emoji:"🎃"},
  christmas:{emoji:"🎄"},
  easter:{emoji:"🐣"},
  valentines:{emoji:"💘"},
  patriotic:{emoji:"⭐"}
};

let pool=[],history=[],currentTheme="classic",maxNumber=75;

const callerLetter=document.getElementById("callerLetter");
const callerNumber=document.getElementById("callerNumber");
const callerEmoji=document.getElementById("callerEmoji");
const callerSub=document.getElementById("callerSub");
const recentDiv=document.getElementById("recentCalls");
const themeGameSel=document.getElementById("themeGame");
const callCount=document.getElementById("callCount");
const progressText=document.getElementById("progressText");
const nextBtn=document.getElementById("nextBtn");

function shuffle(arr){
  const randomValues=new Uint32Array(arr.length);
  crypto.getRandomValues(randomValues);
  for(let i=arr.length-1;i>0;i--){
    const j=randomValues[i]%(i+1);
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

function initGame(){
  pool=[];
  history=[];

  const [theme,size]=themeGameSel.value.split("-");
  maxNumber=parseInt(size,10);
  currentTheme=theme;

  if(maxNumber===75){
    for(let i=0;i<letters.length;i++){
      const[min,max]=ranges[i];
      for(let n=min;n<=max;n++)pool.push({letter:letters[i],number:n});
    }
  }else{
    for(let n=1;n<=maxNumber;n++)pool.push({letter:"",number:n});
  }

  shuffle(pool);
  callerLetter.textContent="";
  callerNumber.textContent="—";
  callerEmoji.textContent="";
  callerSub.textContent="Ready to begin.";
  recentDiv.innerHTML="";
  callCount.textContent="0";
  nextBtn.disabled=false;
  nextBtn.textContent="Call Next";
  updateProgress();
  fitCaller();
}

function callNext(){
  if(pool.length===0)return;

  const pick=pool.pop();
  history.push(pick);
  const emoji=THEMES[currentTheme]?.emoji||"";

  callerLetter.textContent=pick.letter||"";
  callerNumber.textContent=String(pick.number);
  callerEmoji.textContent=emoji;
  callerSub.textContent=pool.length===0?"All numbers have been called.":"";
  addRecent(pick);
  callCount.textContent=history.length;
  updateProgress();
  fitCaller();

  if(pool.length===0){
    nextBtn.disabled=true;
    nextBtn.textContent="Round Complete";
  }
}

function addRecent(call){
  const el=document.createElement("span");
  el.textContent=call.letter?call.letter+" "+call.number:String(call.number);
  el.className=call.letter?"ball-"+call.letter:"ball-generic";
  recentDiv.prepend(el);
  recentDiv.scrollLeft=0;
  if(recentDiv.children.length>100)recentDiv.lastChild.remove();
}

function updateProgress(){
  const total=history.length+pool.length;
  progressText.textContent=history.length+" of "+total+" called • "+pool.length+" remaining";
}

function fitCaller(){
  const box=document.getElementById("callerBox");
  const text=callerNumber.textContent||"—";
  const digits=Math.max(text.length,1);
  let size=Math.min(
    box.clientHeight*(callerLetter.textContent?.trim()?0.52:0.64),
    box.clientWidth/(digits===1?0.72:digits===2?1.34:1.95)
  );
  callerNumber.style.fontSize=size+"px";
  let guard=24;
  while(callerNumber.scrollWidth>box.clientWidth*.90&&guard-->0){
    size*=.94;
    callerNumber.style.fontSize=size+"px";
  }
}

function toggleFullscreen(){
  if(!document.fullscreenElement)document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

window.addEventListener("resize",fitCaller);
document.addEventListener("fullscreenchange",fitCaller);
document.getElementById("nextBtn").addEventListener("click",callNext);
document.getElementById("resetBtn").addEventListener("click",initGame);
document.getElementById("fsBtn").addEventListener("click",toggleFullscreen);
themeGameSel.addEventListener("change",initGame);

document.addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();callNext()}
  if(e.code==="KeyR")initGame();
  if(e.code==="KeyF")toggleFullscreen();
});

initGame();
</script>
</body>
</html>
